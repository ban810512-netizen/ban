</style>

<script type="module">
import * as THREE from 'three';

// ═══════════════════════════════════════════════════════════════
// PARK GOLF PRO v6 — Three.js WebGL — Complete Game Engine

// ─── COURSE DATA ────────────────────────────────────────────
const COURSES = [
  {name:"일산 킨텍스 파크골프장",city:"고양시",par:[3,4,3,5,3,4,3,4,3],dist:[32,58,28,82,35,65,30,55,25],

   theme:"wetland",wind:1.1,trees:"sparse",water:[1,3,6,8]},
  {name:"춘천 의암호 파크골프장",city:"춘천시",par:[3,4,3,3,5,4,3,4,3],dist:[30,58,25,32,78,55,28,62,27],
   theme:"lake",wind:0.9,trees:"dense",water:[2,5,7]},
  {name:"경주 보문 파크골프장",city:"경주시",par:[4,3,4,3,3,5,3,4,3],dist:[52,30,58,28,35,80,25,62,30],
   theme:"plains",wind:1.0,trees:"mixed",water:[4,6]},
  {name:"여수 엑스포 파크골프장",city:"여수시",par:[3,3,4,5,3,3,4,3,4],dist:[28,32,55,78,30,25,60,33,58],
   theme:"coastal",wind:1.6,trees:"sparse",water:[2,4,8]},
  {name:"평창 알펜시아 파크골프장",city:"평창군",par:[3,5,3,4,3,4,3,3,4],dist:[25,80,30,62,28,58,32,27,55],
   theme:"mountain",wind:1.4,trees:"pine",water:[3]}
];

const CLUBS = [
  {name:"Driver",  icon:"D", maxDist:85, loft:12, spin:0.3},
  {name:"Wood",    icon:"W", maxDist:60, loft:18, spin:0.5},

const SCORE_NAMES = {
  '-4':'Condor!','-3':'Albatross!','-2':'Eagle!','-1':'Birdie!',
  '0':'Par','1':'Bogey','2':'D.Bogey','3':'T.Bogey'
};

// ─── STORAGE ────────────────────────────────────────────────
const STO = {
  _key: 'pg6',
  _d: null,
  _defaults() {
    return {name:'Player',vol:80,vib:true,records:[],current:null};
  },
  load() {
    try {
      const s = localStorage.getItem(this._key);
      this._d = s ? JSON.parse(s) : this._defaults();
    } catch(e) { this._d = this._defaults(); }
    return this._d;
  },
  save() { try { localStorage.setItem(this._key, JSON.stringify(this._d)); } catch(e){} },
  get d() { if(!this._d) this.load(); return this._d; }
};

// ─── AUDIO ──────────────────────────────────────────────────
const AUDIO = {
  ctx: null,
  vol: 0.8,
  init() {
    if(this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
  },
  resume() { if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  play(type) {
    if(!this.ctx) return;
    this.resume();
    const now = this.ctx.currentTime;
    const g = this.ctx.createGain();
    g.connect(this.ctx.destination);
    g.gain.value = this.vol * 0.4;
    switch(type) {
      case 'hit': {
        const o = this.ctx.createOscillator();
        o.type = 'sine'; o.frequency.setValueAtTime(800, now);
        o.frequency.exponentialRampToValueAtTime(200, now+0.15);
        g.gain.setValueAtTime(this.vol*0.5, now);
        g.gain.exponentialRampToValueAtTime(0.001, now+0.2);
        o.connect(g); o.start(now); o.stop(now+0.2);
        // click layer
        const b = this.ctx.createBufferSource();
        const buf = this.ctx.createBuffer(1,this.ctx.sampleRate*0.04,this.ctx.sampleRate);
        const d = buf.getChannelData(0);
        for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,8);
        b.buffer = buf; const g2=this.ctx.createGain();
        g2.gain.value=this.vol*0.6; b.connect(g2); g2.connect(this.ctx.destination);
        b.start(now); break;
      }
      case 'putt': {
        const o = this.ctx.createOscillator();
        o.type='sine'; o.frequency.value=400;
        g.gain.setValueAtTime(this.vol*0.3,now);
        g.gain.exponentialRampToValueAtTime(0.001,now+0.1);
        o.connect(g); o.start(now); o.stop(now+0.1); break;
      }
      case 'hole': {
        [523,659,784,1047].forEach((f,i) => {
          const o=this.ctx.createOscillator();
          o.type='sine'; o.frequency.value=f;
          const gn=this.ctx.createGain();
          gn.gain.setValueAtTime(0,now+i*0.12);
          gn.gain.linearRampToValueAtTime(this.vol*0.3,now+i*0.12+0.03);
          gn.gain.exponentialRampToValueAtTime(0.001,now+i*0.12+0.35);
          o.connect(gn); gn.connect(this.ctx.destination);
          o.start(now+i*0.12); o.stop(now+i*0.12+0.35);
        }); break;
      }
      case 'splash': {
        const b=this.ctx.createBufferSource();
        const buf=this.ctx.createBuffer(1,this.ctx.sampleRate*0.4,this.ctx.sampleRate);
        const d=buf.getChannelData(0);
        for(let i=0;i<d.length;i++){
          const t=i/this.ctx.sampleRate;
          d[i]=(Math.random()*2-1)*Math.exp(-t*8)*0.5;
        }
        b.buffer=buf; g.gain.value=this.vol*0.5;
        b.connect(g); b.start(now); break;
      }
      case 'bounce': {
        const o=this.ctx.createOscillator();
        o.type='sine'; o.frequency.setValueAtTime(300,now);
        o.frequency.exponentialRampToValueAtTime(100,now+0.08);
        g.gain.setValueAtTime(this.vol*0.2,now);
        g.gain.exponentialRampToValueAtTime(0.001,now+0.1);
        o.connect(g); o.start(now); o.stop(now+0.1); break;
      }
      case 'wind': {
        const b=this.ctx.createBufferSource();
        const buf=this.ctx.createBuffer(1,this.ctx.sampleRate*1.5,this.ctx.sampleRate);
        const d=buf.getChannelData(0);
        for(let i=0;i<d.length;i++){
          d[i]=(Math.random()*2-1)*0.02*Math.sin(i/this.ctx.sampleRate*2*Math.PI*0.5);
        }
        b.buffer=buf; b.loop=true; g.gain.value=this.vol*0.05;
        b.connect(g); b.start(now); return {stop:()=>{g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+0.5);setTimeout(()=>b.stop(),600);}}; 
      }
      case 'ob': {
        const o=this.ctx.createOscillator();
        o.type='square'; o.frequency.value=200;
        g.gain.setValueAtTime(this.vol*0.3,now);
        g.gain.exponentialRampToValueAtTime(0.001,now+0.3);
        o.connect(g); o.start(now); o.stop(now+0.3); break;
      }
    }
  }
};

// ─── VIBRATION ──────────────────────────────────────────────
function vibrate(ms) {
  if(STO.d.vib && navigator.vibrate) navigator.vibrate(ms);
}

// ─── DOM REFS ───────────────────────────────────────────────
const $ = id => document.getElementById(id);
const hud=$('hud'), hHole=$('hHole'), hPar=$('hPar'), hCourse=$('hCourse');
const hStrokes=$('hStrokes'), hDist=$('hDist'), hWind=$('hWind'), clubBtn=$('clubBtn');
const bigMsg=$('bigMsg'), aimGuide=$('aimGuide');
const swingPanel=$('swingPanel'), powerFill=$('powerFill'), powerMark=$('powerMark');
const accBar=$('accBar'), accNeedle=$('accNeedle'), swingBtn=$('swingBtn');
const puttInfo=$('puttInfo');

// ─── THREE.JS SCENE SETUP ───────────────────────────────────
let scene, camera, renderer, clock;
let sunLight, ambientLight, hemiLight;
const FIELD_SCALE = 1.0; // 1 unit = 1 meter

function initThree() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87CEEB);
  scene.fog = new THREE.FogExp2(0x87CEEB, 0.004);

  camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 500);
  camera.position.set(0, 8, 15);

  renderer = new THREE.WebGLRenderer({antialias:true, alpha:false, powerPreference:'high-performance'});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  container.appendChild(renderer.domElement);

  // Lights
  sunLight = new THREE.DirectionalLight(0xfff5e0, 2.2);
  sunLight.position.set(40, 60, 30);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.width = 2048;
  sunLight.shadow.mapSize.height = 2048;
  sunLight.shadow.camera.near = 0.5;
  sunLight.shadow.camera.far = 200;
  sunLight.shadow.camera.left = -60;
  sunLight.shadow.camera.right = 60;
  sunLight.shadow.camera.top = 60;
  sunLight.shadow.camera.bottom = -60;
  sunLight.shadow.bias = -0.001;
  sunLight.shadow.normalBias = 0.02;
  scene.add(sunLight);

  ambientLight = new THREE.AmbientLight(0x4488aa, 0.5);
  scene.add(ambientLight);

  hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x3a7d44, 0.7);
  scene.add(hemiLight);

  clock = new THREE.Clock();

  window.addEventListener('resize', onResize);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// ─── GEOMETRY CACHE ─────────────────────────────────────────
const GEO = {};
function getGeo(key, factory) {
  if(!GEO[key]) GEO[key] = factory();
  return GEO[key];
}

// ─── COURSE BUILDER ─────────────────────────────────────────
let courseGroup = null;
let holeData = null; // current hole layout
let greenCenter = new THREE.Vector3();
let greenRadius = 0;
let teePos = new THREE.Vector3();
let holePos = new THREE.Vector3(); // actual hole/cup position
let flagMesh = null;
let bunkers = []; // {center, radius}
let waterAreas = []; // {center, size}
let obBounds = {minX:-30,maxX:30,minZ:-100,maxZ:10};
let fairwayPath = []; // array of {x,z,w} for fairway center + width

function buildCourse(courseIdx, holeIdx) {
  if(courseGroup) {
    scene.remove(courseGroup);
    courseGroup.traverse(c => { if(c.geometry) c.geometry.dispose(); });
  }
  courseGroup = new THREE.Group();
  bunkers = [];
  waterAreas = [];
  fairwayPath = [];

  const course = COURSES[courseIdx];
  const dist = course.dist[holeIdx];
  const par = course.par[holeIdx];
  const hasWater = course.water && course.water.includes(holeIdx+1);
  const seed = courseIdx * 100 + holeIdx;
  const rng = mulberry32(seed);

  // Sky color based on theme
  const skyColors = {
    plains:0x87CEEB, coastal:0x7ec8e3, forest:0x6eb5c0, hills:0x8ecae6,
    wetland:0x90c5b0, lake:0x7bbcd5, mountain:0x9dc5e0
  };
  scene.background = new THREE.Color(skyColors[course.theme]||0x87CEEB);
  scene.fog = new THREE.FogExp2(skyColors[course.theme]||0x87CEEB, 0.003);

  // ── Ground plane (large background) ──
  const bgGeo = new THREE.PlaneGeometry(200, 200);
  const bgMesh = new THREE.Mesh(bgGeo, MAT.bg);
  bgMesh.rotation.x = -Math.PI/2;
  bgMesh.position.set(0, -0.05, -dist/2);
  bgMesh.receiveShadow = true;
  courseGroup.add(bgMesh);

  // ── Tee box ──
  teePos.set(0, 0, 0);
  const teeGeo = new THREE.BoxGeometry(3, 0.08, 3);
  const teeMesh = new THREE.Mesh(teeGeo, MAT.tee);
  teeMesh.position.set(0, 0.04, 0);
  teeMesh.receiveShadow = true;
  courseGroup.add(teeMesh);

  // tee markers
  const tMarkerGeo = getGeo('tmarker', ()=>new THREE.SphereGeometry(0.1,8,6));
  [-0.8,0.8].forEach(x => {
    const m = new THREE.Mesh(tMarkerGeo, MAT.flag);
    m.position.set(x,0.12,0.8);
    courseGroup.add(m);
  });

  // ── Fairway ──  
  // Create a curved fairway path from tee to green
  const numSegments = 12;
  const curveAmount = (rng()-0.5) * dist * 0.25;
  const midCurve = (rng()-0.5) * dist * 0.15;
  
  for(let i=0; i<=numSegments; i++) {
    const t = i/numSegments;
    const z = -t * dist;
    const x = Math.sin(t * Math.PI) * curveAmount + Math.sin(t * Math.PI * 2) * midCurve * 0.3;
    const w = 3.5 + Math.sin(t*Math.PI)*2 + (par>=4?1.5:0);
    fairwayPath.push({x, z, w});
  }

  // Build fairway as connected quads
  const fwVerts = [];
  const fwIdx = [];
  const fwUvs = [];
  for(let i=0; i<fairwayPath.length; i++) {
    const p = fairwayPath[i];
    fwVerts.push(p.x - p.w, 0.01, p.z);
    fwVerts.push(p.x + p.w, 0.01, p.z);
    fwUvs.push(0, i/fairwayPath.length);
    fwUvs.push(1, i/fairwayPath.length);
    if(i>0) {
      const b = (i-1)*2;
      fwIdx.push(b, b+1, b+2, b+1, b+3, b+2);
    }
  }
  const fwGeo = new THREE.BufferGeometry();
  fwGeo.setAttribute('position', new THREE.Float32BufferAttribute(fwVerts, 3));
  fwGeo.setAttribute('uv', new THREE.Float32BufferAttribute(fwUvs, 2));
  fwGeo.setIndex(fwIdx);
  fwGeo.computeVertexNormals();
  const fwMesh = new THREE.Mesh(fwGeo, MAT.fairway);
  fwMesh.receiveShadow = true;
  courseGroup.add(fwMesh);

  // ── Rough on both sides ──
  for(let side of [-1, 1]) {
    const roughVerts = [];
    const roughIdx = [];
    for(let i=0; i<fairwayPath.length; i++) {
      const p = fairwayPath[i];
      const inner = p.x + side * p.w;
      const outer = p.x + side * (p.w + 8 + rng()*4);
      roughVerts.push(inner, 0.005, p.z);
      roughVerts.push(outer, 0.005, p.z);
      if(i>0) {
        const b=(i-1)*2;
        roughIdx.push(b,b+1,b+2,b+1,b+3,b+2);
      }
    }
    const rGeo = new THREE.BufferGeometry();
    rGeo.setAttribute('position', new THREE.Float32BufferAttribute(roughVerts, 3));
    rGeo.setIndex(roughIdx);
    rGeo.computeVertexNormals();
    const rMesh = new THREE.Mesh(rGeo, MAT.rough);
    rMesh.receiveShadow = true;
    courseGroup.add(rMesh);
  }

  // ── Green ──
  const lastFw = fairwayPath[fairwayPath.length-1];
  greenRadius = 3.5 + par * 0.8;
  greenCenter.set(lastFw.x, 0, lastFw.z - greenRadius*0.3);
  
  const greenGeo = new THREE.CircleGeometry(greenRadius, 32);
  const greenMesh = new THREE.Mesh(greenGeo, MAT.green);
  greenMesh.rotation.x = -Math.PI/2;
  greenMesh.position.set(greenCenter.x, 0.02, greenCenter.z);
  greenMesh.receiveShadow = true;
  courseGroup.add(greenMesh);

  // green fringe
  const fringeGeo = new THREE.RingGeometry(greenRadius, greenRadius+0.8, 32);
  const fringeMesh = new THREE.Mesh(fringeGeo, MAT.fairway);
  fringeMesh.rotation.x = -Math.PI/2;
  fringeMesh.position.set(greenCenter.x, 0.015, greenCenter.z);
  fringeMesh.receiveShadow = true;
  courseGroup.add(fringeMesh);

  // ── Hole & Flag ──
  const holePosOffset = (rng()-0.5)*greenRadius*0.4;
  holePos.set(greenCenter.x + holePosOffset, 0, greenCenter.z + (rng()-0.5)*greenRadius*0.4);

  // hole cup
  const cupGeo = getGeo('cup', ()=>new THREE.CylinderGeometry(0.054, 0.054, 0.1, 16));
  const cupMat = new THREE.MeshStandardMaterial({color:0x111111, roughness:0.5});
  const cupMesh = new THREE.Mesh(cupGeo, cupMat);
  cupMesh.position.set(holePos.x, -0.02, holePos.z);
  courseGroup.add(cupMesh);

  // flag pole
  const poleGeo = getGeo('pole', ()=>new THREE.CylinderGeometry(0.02, 0.02, 2.0, 8));
  const poleMesh = new THREE.Mesh(poleGeo, MAT.pole);
  poleMesh.position.set(holePos.x, 1.0, holePos.z);
  poleMesh.castShadow = true;
  courseGroup.add(poleMesh);

  // flag
  const flagShape = new THREE.Shape();
  flagShape.moveTo(0, 0);
  flagShape.lineTo(0.7, 0.15);
  flagShape.lineTo(0, 0.3);
  flagShape.lineTo(0, 0);
  const flagGeo = new THREE.ShapeGeometry(flagShape);
  flagMesh = new THREE.Mesh(flagGeo, MAT.flag);
  flagMesh.position.set(holePos.x + 0.02, 1.7, holePos.z);
  flagMesh.castShadow = true;
  courseGroup.add(flagMesh);

  // ── Bunkers ──
  const numBunkers = par >= 4 ? 2 : 1;
  for(let b=0; b<numBunkers; b++) {
    const bT = 0.5 + rng()*0.35;
    const bFw = fairwayPath[Math.floor(bT * (fairwayPath.length-1))];
    const bSide = rng()>0.5 ? 1 : -1;
    const bR = 1.2 + rng()*1.5;
    const bx = bFw.x + bSide * (bFw.w - bR*0.5 + rng()*2);
    const bz = bFw.z + (rng()-0.5)*3;
    bunkers.push({center: new THREE.Vector3(bx, 0, bz), radius: bR});
    
    // sand surface
    const bGeo = new THREE.CircleGeometry(bR, 16);
    const bMesh = new THREE.Mesh(bGeo, MAT.sand);
    bMesh.rotation.x = -Math.PI/2;
    bMesh.position.set(bx, 0.015, bz);
    bMesh.receiveShadow = true;
    courseGroup.add(bMesh);
    
    // bunker lip (ring)
    const lipGeo = new THREE.TorusGeometry(bR, 0.15, 6, 24);
    const lipMesh = new THREE.Mesh(lipGeo, MAT.dirt);
    lipMesh.rotation.x = -Math.PI/2;
    lipMesh.position.set(bx, 0.08, bz);
    lipMesh.castShadow = true;
    courseGroup.add(lipMesh);
  }

  // ── Water hazards ──
  if(hasWater) {
    const wT = 0.3 + rng()*0.3;
    const wFw = fairwayPath[Math.floor(wT*(fairwayPath.length-1))];
    const wSide = rng()>0.5?1:-1;
    const ww = 4+rng()*5, wh = 3+rng()*3;
    const wx = wFw.x + wSide*(wFw.w+ww*0.3);
    const wz = wFw.z;
    waterAreas.push({center:new THREE.Vector3(wx,0,wz), size:{x:ww,z:wh}});
    
    const wGeo = new THREE.PlaneGeometry(ww, wh);
    const wMesh = new THREE.Mesh(wGeo, MAT.water);
    wMesh.rotation.x = -Math.PI/2;
    wMesh.position.set(wx, 0.01, wz);
    wMesh.receiveShadow = true;
    courseGroup.add(wMesh);
    
    // water edge rocks
    for(let r=0; r<8; r++) {
      const angle = rng()*Math.PI*2;
      const rd = Math.max(ww,wh)*0.5 + rng()*0.5;
      const rockGeo = getGeo('rock', ()=>new THREE.DodecahedronGeometry(0.25, 0));
      const rock = new THREE.Mesh(rockGeo, MAT.rock);
      const sc = 0.5+rng()*0.8;
      rock.scale.set(sc, sc*0.5, sc);
      rock.position.set(wx+Math.cos(angle)*rd, 0.08, wz+Math.sin(angle)*rd*(wh/ww));
      rock.rotation.set(rng(), rng(), rng());
      rock.castShadow = true;
      courseGroup.add(rock);
    }
  }

  // ── Trees ──
  const treeDensity = {sparse:6, mixed:12, dense:18, palm:8, pine:14};
  const numTrees = treeDensity[course.trees] || 10;
  for(let t=0; t<numTrees; t++) {
    const tz = -(rng()*dist*1.2) - 3;
    const side = rng()>0.5?1:-1;
    const tx = side * (5 + rng()*25);
    // don't place on fairway
    const nearFw = fairwayPath.reduce((best,p) => {
      const d = Math.abs(p.z-tz);
      return d<best.d ? {d,p} : best;
    }, {d:Infinity,p:null});
    if(nearFw.p && Math.abs(tx-nearFw.p.x) < nearFw.p.w+1.5) continue;
    
    buildTree(courseGroup, tx, tz, course.trees, rng);
  }
  
  // ── Cart path ──
  const pathVerts = [];
  const pathIdx = [];
  for(let i=0; i<fairwayPath.length; i++) {
    const p = fairwayPath[i];
    const px = p.x + p.w + 2.5;
    pathVerts.push(px-0.5, 0.008, p.z);
    pathVerts.push(px+0.5, 0.008, p.z);
    if(i>0) { const b=(i-1)*2; pathIdx.push(b,b+1,b+2,b+1,b+3,b+2); }
  }
  const pathGeo = new THREE.BufferGeometry();
  pathGeo.setAttribute('position', new THREE.Float32BufferAttribute(pathVerts,3));
  pathGeo.setIndex(pathIdx);
  pathGeo.computeVertexNormals();
  const pathMesh = new THREE.Mesh(pathGeo, MAT.path);
  pathMesh.receiveShadow = true;
  courseGroup.add(pathMesh);

  // ── OB Markers ──
  obBounds = {minX: -28, maxX: 28, minZ: -(dist+20), maxZ: 8};
  for(let i=0; i<20; i++) {
    const mGeo = getGeo('obpost', ()=>new THREE.CylinderGeometry(0.04, 0.04, 0.7, 6));
    const mMesh = new THREE.Mesh(mGeo, MAT.obMarker);
    const topGeo = getGeo('obtop', ()=>new THREE.SphereGeometry(0.06, 6, 4));
    const topMesh = new THREE.Mesh(topGeo, MAT.obTop);
    
    let mx, mz;
    if(i<5) { mx = obBounds.minX; mz = obBounds.minZ + i*(dist+28)/4; }
    else if(i<10) { mx = obBounds.maxX; mz = obBounds.minZ + (i-5)*(dist+28)/4; }
    else if(i<15) { mz = obBounds.minZ; mx = obBounds.minX + (i-10)*56/4; }
    else { mz = obBounds.maxZ; mx = obBounds.minX + (i-15)*56/4; }
    
    mMesh.position.set(mx, 0.35, mz);
    topMesh.position.set(mx, 0.72, mz);
    mMesh.castShadow = true;
    courseGroup.add(mMesh);
    courseGroup.add(topMesh);
  }

  // ── Flowers & decoration ──
  const flowerMats = [MAT.flower1, MAT.flower2, MAT.flower3];
  for(let f=0; f<15; f++) {
    const fz = -(rng()*dist*0.9) - 2;
    const fx = (rng()>0.5?1:-1) * (4+rng()*20);
    const flGeo = getGeo('flower', ()=>new THREE.SphereGeometry(0.12, 5, 4));
    const flMesh = new THREE.Mesh(flGeo, flowerMats[Math.floor(rng()*3)]);
    flMesh.position.set(fx, 0.12, fz);
    flMesh.scale.set(1, 0.6, 1);
    courseGroup.add(flMesh);
  }

  // ── Distant mountains / background ──
  buildBackground(courseGroup, course.theme, dist, rng);

  scene.add(courseGroup);
}

function buildTree(group, x, z, type, rng) {
  const h = 2 + rng()*3;
  
  if(type === 'palm') {
    // Palm tree - curved trunk
    const trunkCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(rng()*0.5, h*0.4, rng()*0.3),
      new THREE.Vector3(rng()*0.3, h*0.8, rng()*0.2),
      new THREE.Vector3(0, h, 0)
    ]);
    const trunkGeo = new THREE.TubeGeometry(trunkCurve, 8, 0.1, 6);
    const trunk = new THREE.Mesh(trunkGeo, MAT.trunk);
    trunk.position.set(x, 0, z);
    trunk.castShadow = true;
    group.add(trunk);
    
    // Palm fronds
    for(let f=0; f<6; f++) {
      const angle = (f/6)*Math.PI*2;
      const frondGeo = getGeo('frond', ()=>{
        const shape = new THREE.Shape();
        shape.moveTo(0,0); shape.quadraticCurveTo(1,0.3,2.2,0.1);
        shape.quadraticCurveTo(1,-0.3,0,0);
        return new THREE.ShapeGeometry(shape);
      });
      const frond = new THREE.Mesh(frondGeo, MAT.palm);
      frond.position.set(x, h, z);
      frond.rotation.set(-0.5, angle, 0);
      frond.castShadow = true;
      group.add(frond);
    }
  } else if(type === 'pine') {
    // Pine tree - cone layers
    const trunkGeo = getGeo('ptrunk', ()=>new THREE.CylinderGeometry(0.08, 0.12, 1.5, 6));
    const trunk = new THREE.Mesh(trunkGeo, MAT.trunk);
    trunk.position.set(x, 0.75, z);
    trunk.castShadow = true;
    group.add(trunk);
    
    for(let layer=0; layer<3; layer++) {
      const ly = 1.5 + layer*0.9;
      const lr = 1.2 - layer*0.3;
      const coneGeo = new THREE.ConeGeometry(lr, 1.5, 8);
      const cone = new THREE.Mesh(coneGeo, MAT.pine);
      cone.position.set(x, ly, z);
      cone.castShadow = true;
      cone.receiveShadow = true;
      group.add(cone);
    }
  } else {
    // Deciduous tree
    const trunkGeo = getGeo('dtrunk', ()=>new THREE.CylinderGeometry(0.06, 0.12, 2, 6));
    const trunk = new THREE.Mesh(trunkGeo, MAT.trunk);
    trunk.position.set(x, 1, z);
    trunk.castShadow = true;
    group.add(trunk);
    
    // Canopy - multiple spheres for organic look
    const mat = rng()>0.5 ? MAT.leaves : MAT.leavesDark;
    for(let c=0; c<3; c++) {
      const cr = 0.8 + rng()*0.6;
      const canopyGeo = new THREE.SphereGeometry(cr, 8, 6);
      const canopy = new THREE.Mesh(canopyGeo, mat);
      canopy.position.set(x+(rng()-0.5)*0.5, 2+h*0.3+rng()*0.5, z+(rng()-0.5)*0.5);
      canopy.scale.set(1, 0.7+rng()*0.3, 1);
      canopy.castShadow = true;
      canopy.receiveShadow = true;
      group.add(canopy);
    }
  }
}

function buildBackground(group, theme, dist, rng) {
  // Distant mountains
  const mountainGeo = new THREE.BufferGeometry();
  const mVerts = [];
  const mIdx = [];
  const numPeaks = 12;
  const mDist = 120;
  
  for(let i=0; i<=numPeaks; i++) {
    const angle = (i/numPeaks)*Math.PI - Math.PI*0.5;
    const x = Math.sin(angle)*mDist;
    const z = -dist/2 - Math.cos(angle)*mDist;
    const height = 15 + rng()*25;
    mVerts.push(x, 0, z);
    mVerts.push(x, height, z);
  }
  for(let i=0; i<numPeaks; i++) {
    const b=i*2;
    mIdx.push(b,b+1,b+2, b+1,b+3,b+2);
  }
  mountainGeo.setAttribute('position', new THREE.Float32BufferAttribute(mVerts,3));
  mountainGeo.setIndex(mIdx);
  mountainGeo.computeVertexNormals();
  
  const mColors = {
    plains:0x6a9a5a, coastal:0x5a8a9a, forest:0x3a6a3a,
    hills:0x7a9a6a, wetland:0x5a8a6a, lake:0x4a7a8a,
    mountain:0x8a8a9a
  };
  const mMat = new THREE.MeshStandardMaterial({
    color: mColors[theme]||0x6a9a5a, roughness:0.95, metalness:0, fog:true
  });
  const mMesh = new THREE.Mesh(mountainGeo, mMat);
  mMesh.receiveShadow = false;
  group.add(mMesh);

  // Clouds
  const cloudGeo = getGeo('cloud', ()=>new THREE.SphereGeometry(1,7,5));
  const cloudMat = new THREE.MeshStandardMaterial({color:0xffffff,roughness:1,metalness:0,transparent:true,opacity:0.7});
  for(let c=0; c<8; c++) {
    const cg = new THREE.Group();
    for(let p=0; p<3; p++) {
      const cm = new THREE.Mesh(cloudGeo, cloudMat);
      cm.position.set((rng()-0.5)*3, rng()*0.5, (rng()-0.5)*1.5);
      cm.scale.set(2+rng()*2, 0.6+rng()*0.4, 1+rng()*0.5);
      cg.add(cm);
    }
    cg.position.set(
      (rng()-0.5)*100,
      30+rng()*20,
      -dist/2 + (rng()-0.5)*80
    );
    group.add(cg);
  }
}

// Seeded RNG
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}

// ─── BALL ───────────────────────────────────────────────────
let ballMesh, ballShadow;
let ballPos = new THREE.Vector3();
let ballVel = new THREE.Vector3();
let ballOnGround = true;
let ballInBunker = false;
let ballInWater = false;
let ballOB = false;

function createBall() {
  const geo = new THREE.SphereGeometry(0.021, 16, 12); // regulation ~42mm diameter
  ballMesh = new THREE.Mesh(geo, MAT.ball);
  ballMesh.castShadow = true;
  ballMesh.scale.set(3, 3, 3); // visual scale up for visibility
  scene.add(ballMesh);
  
  // Blob shadow under ball
  const shGeo = new THREE.CircleGeometry(0.12, 12);
  const shMat = new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:0.3, depthWrite:false});
  ballShadow = new THREE.Mesh(shGeo, shMat);
  ballShadow.rotation.x = -Math.PI/2;
  scene.add(ballShadow);
}

function resetBall(x, y, z) {
  ballPos.set(x, y, z);
  ballVel.set(0, 0, 0);
  ballOnGround = true;
  ballInBunker = false;
  ballInWater = false;
  ballOB = false;
  updateBallMesh();
}

function updateBallMesh() {
  if(!ballMesh) return;
  ballMesh.position.copy(ballPos);
  ballMesh.position.y += 0.065; // raise visual ball
  ballShadow.position.set(ballPos.x, 0.005, ballPos.z);
  ballShadow.material.opacity = Math.max(0, 0.3 - ballPos.y * 0.015);
}

// ─── AIM LINE ───────────────────────────────────────────────
let aimLine = null;
let aimArrow = null;
let aimAngle = 0; // radians, 0 = toward hole

function createAimLine() {
  const mat = new THREE.LineBasicMaterial({color:0xffffff, transparent:true, opacity:0.6, linewidth:2});
  const geo = new THREE.BufferGeometry();
  const pts = [];
  for(let i=0; i<30; i++) pts.push(0,0.1,0);
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
  aimLine = new THREE.Line(geo, mat);
  scene.add(aimLine);
  
  // Aim dot at end
  const dotGeo = new THREE.SphereGeometry(0.1,8,6);
  const dotMat = new THREE.MeshBasicMaterial({color:0xfdd835, transparent:true, opacity:0.7});
  aimArrow = new THREE.Mesh(dotGeo, dotMat);
  scene.add(aimArrow);
}

function updateAimLine(power) {
  if(!aimLine) return;
  const club = CLUBS[G.clubIdx];
  const maxD = club.maxDist * (power || 0.5);
  const dir = new THREE.Vector3(Math.sin(aimAngle), 0, -Math.cos(aimAngle));
  const positions = aimLine.geometry.attributes.position.array;
  
  const steps = 10;
  for(let i=0; i<steps; i++) {
    const t = i/(steps-1);
    const d = t * maxD;
    // Parabolic arc preview
    const height = Math.sin(t * Math.PI) * club.loft * 0.15 * power;
    const idx = i*3;
    positions[idx]   = ballPos.x + dir.x * d;
    positions[idx+1] = 0.1 + height;
    positions[idx+2] = ballPos.z + dir.z * d;
  }
  // zero out remaining
  for(let i=steps; i<10; i++) {
    const idx=i*3;
    positions[idx]=positions[(steps-1)*3];
    positions[idx+1]=0.1;
    positions[idx+2]=positions[(steps-1)*3+2];
  }
  aimLine.geometry.attributes.position.needsUpdate = true;
  
  aimArrow.position.set(
    ballPos.x + dir.x * maxD,
    0.15,
    ballPos.z + dir.z * maxD
  );
  aimLine.visible = true;
  aimArrow.visible = true;
}

function hideAimLine() {
  if(aimLine) aimLine.visible = false;
  if(aimArrow) aimArrow.visible = false;
}

// ─── PARTICLES ──────────────────────────────────────────────
let particles = [];

function spawnParticles(pos, count, color, spread, speed) {
  for(let i=0; i<count; i++) {
    const geo = new THREE.SphereGeometry(0.04+Math.random()*0.06, 4, 3);
    const mat = new THREE.MeshBasicMaterial({color, transparent:true, opacity:1});
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(pos);
    scene.add(mesh);
    particles.push({
      mesh,
      vel: new THREE.Vector3((Math.random()-0.5)*spread, Math.random()*speed, (Math.random()-0.5)*spread),
      life: 1.0,
      decay: 0.5 + Math.random()*0.5
    });
  }
}

function updateParticles(dt) {
  for(let i=particles.length-1; i>=0; i--) {
    const p = particles[i];
    p.vel.y -= 9.8 * dt;
    p.mesh.position.add(p.vel.clone().multiplyScalar(dt));
    p.life -= p.decay * dt;
    p.mesh.material.opacity = Math.max(0, p.life);
    if(p.life <= 0) {
      scene.remove(p.mesh);
      p.mesh.geometry.dispose();
      p.mesh.material.dispose();
      particles.splice(i, 1);
    }
  }
}

// ─── CAMERA CONTROLLER ─────────────────────────────────────
const CAM = {
  target: new THREE.Vector3(),
  current: new THREE.Vector3(),
  lookAt: new THREE.Vector3(),
  currentLookAt: new THREE.Vector3(),
  mode: 'menu', // menu, flyover, aim, follow, result

  setBehindBall(instant) {
    const dir = new THREE.Vector3(Math.sin(aimAngle), 0, -Math.cos(aimAngle));
    this.target.set(
      ballPos.x - dir.x * 6,
      3.5,
      ballPos.z - dir.z * -4 + 4
    );
    this.lookAt.set(ballPos.x + dir.x * 8, 0, ballPos.z + dir.z * -8);
    if(instant) {
      this.current.copy(this.target);
      this.currentLookAt.copy(this.lookAt);
      camera.position.copy(this.current);
      camera.lookAt(this.currentLookAt);
    }
  },

  setFollowBall() {
    const behind = ballVel.clone().normalize().multiplyScalar(-8);
    behind.y = 0;
    this.target.set(
      ballPos.x + behind.x,
      Math.max(3, ballPos.y + 4),
      ballPos.z + behind.z + 3
    );
    this.lookAt.copy(ballPos);
  },

  setFlyover(t, dist) {
    const fwMid = fairwayPath[Math.floor(fairwayPath.length/2)];
    const cx = fwMid ? fwMid.x : 0;
    const startZ = 2;
    const endZ = -(dist + 5);
    const z = startZ + (endZ - startZ) * t;
    this.target.set(cx + Math.sin(t*Math.PI)*8, 12 + Math.sin(t*Math.PI)*5, z + 10);
    this.lookAt.set(cx, 0, z - 5);
  },

  setResult() {
    this.target.set(holePos.x + 4, 3, holePos.z + 4);
    this.lookAt.copy(holePos);
  },

  update(dt) {
    const speed = 3.0;
    this.current.lerp(this.target, 1 - Math.exp(-speed * dt));
    this.currentLookAt.lerp(this.lookAt, 1 - Math.exp(-speed * dt));
    camera.position.copy(this.current);
    camera.lookAt(this.currentLookAt);
  }
};

// ─── PHYSICS ────────────────────────────────────────────────
const GRAVITY = 9.8;
const AIR_RESIST = 0.02;
const BOUNCE_DAMP = 0.35;
const ROLL_FRICTION = 0.92;
const GREEN_FRICTION = 0.88;
const SAND_FRICTION = 0.75;
const ROLL_STOP = 0.05;

function physicsTick(dt) {
  if(ballOnGround && ballVel.lengthSq() < ROLL_STOP*ROLL_STOP) {
    ballVel.set(0,0,0);
    return 'stopped';
  }
  
  // Substeps for accuracy
  const steps = 3;
  const subDt = dt / steps;
  
  for(let s=0; s<steps; s++) {
    // Gravity
    if(!ballOnGround) {
      ballVel.y -= GRAVITY * subDt;
    }
    
    // Air resistance (when airborne)
    if(!ballOnGround) {
      const speed = ballVel.length();
      if(speed > 0.1) {
        const drag = AIR_RESIST * speed * speed;
        const dragVec = ballVel.clone().normalize().multiplyScalar(-drag * subDt);
        ballVel.add(dragVec);
      }
    }
    
    // Wind
    ballVel.x += G.wind.x * subDt * (ballOnGround ? 0.1 : 0.5);
    ballVel.z += G.wind.z * subDt * (ballOnGround ? 0.1 : 0.5);
    
    // Update position
    ballPos.add(ballVel.clone().multiplyScalar(subDt));
    
    // Ground collision
    const groundY = getGroundHeight(ballPos.x, ballPos.z);
    if(ballPos.y <= groundY) {
      ballPos.y = groundY;
      if(!ballOnGround && ballVel.y < -0.5) {
        // Bounce
        ballVel.y = -ballVel.y * BOUNCE_DAMP;
        ballVel.x *= 0.8;
        ballVel.z *= 0.8;
        AUDIO.play('bounce');
        if(Math.abs(ballVel.y) < 0.3) {
          ballOnGround = true;
          ballVel.y = 0;
        }
      } else {
        ballOnGround = true;
        ballVel.y = 0;
      }
    } else {
      ballOnGround = false;
    }
    
    // Rolling friction
    if(ballOnGround) {
      const onGreen = isOnGreen(ballPos.x, ballPos.z);
      const inSand = isInBunker(ballPos.x, ballPos.z);
      let fric = onGreen ? GREEN_FRICTION : ROLL_FRICTION;
      if(inSand) { fric = SAND_FRICTION; ballInBunker = true; }
      
      ballVel.x *= Math.pow(fric, subDt*60);
      ballVel.z *= Math.pow(fric, subDt*60);
      
      // Green slope toward hole
      if(onGreen) {
        const toHole = new THREE.Vector3(holePos.x - ballPos.x, 0, holePos.z - ballPos.z);
        const slopeDist = toHole.length();
        if(slopeDist > 0.5 && slopeDist < greenRadius) {
          toHole.normalize().multiplyScalar(0.15 * subDt);
          ballVel.add(toHole);
        }
      }
    }
    
    // Water check
    for(const w of waterAreas) {
      if(Math.abs(ballPos.x - w.center.x) < w.size.x/2 &&
         Math.abs(ballPos.z - w.center.z) < w.size.z/2 &&
         ballPos.y < 0.1) {
        ballInWater = true;
        ballVel.set(0,0,0);
        AUDIO.play('splash');
        return 'water';
      }
    }
    
    // OB check
    if(ballPos.x < obBounds.minX || ballPos.x > obBounds.maxX ||
       ballPos.z < obBounds.minZ || ballPos.z > obBounds.maxZ) {
      ballOB = true;
      ballVel.set(0,0,0);
      AUDIO.play('ob');
      return 'ob';
    }
    
    // Hole-in check
    if(ballOnGround && isOnGreen(ballPos.x, ballPos.z)) {
      const dh = Math.sqrt(
        (ballPos.x-holePos.x)**2 + (ballPos.z-holePos.z)**2
      );
      const speed = Math.sqrt(ballVel.x**2 + ballVel.z**2);
      if(dh < 0.15 && speed < 3.0) {
        ballPos.set(holePos.x, holePos.y, holePos.z);
        ballVel.set(0,0,0);
        return 'holed';
      }
    }
  }
  
  updateBallMesh();
  return ballOnGround && ballVel.lengthSq() < ROLL_STOP*ROLL_STOP ? 'stopped' : 'flying';
}

function getGroundHeight(x, z) {
  // Slight undulation
  return Math.sin(x*0.5)*0.05 + Math.cos(z*0.3)*0.05;
}

function isOnGreen(x, z) {
  const dx = x - greenCenter.x;
  const dz = z - greenCenter.z;
  return (dx*dx + dz*dz) < greenRadius*greenRadius;
}

function isInBunker(x, z) {
  for(const b of bunkers) {
    const dx = x - b.center.x;
    const dz = z - b.center.z;
    if(dx*dx + dz*dz < b.radius*b.radius) return true;
  }
  return false;
}

function distToHole() {
  return Math.sqrt((ballPos.x-holePos.x)**2 + (ballPos.z-holePos.z)**2);
}

// ─── GAME STATE ─────────────────────────────────────────────
const G = {
  state: 'menu',
  courseIdx: 0,
  holeIdx: 0,
  clubIdx: 0,
  strokes: 0,
  scores: [], // per hole
  par: 0,
  dist: 0,
  wind: {x:0, z:0, speed:0, dir:0},
  power: 0,
  accuracy: 0,
  powerDir: 1,
  accDir: 1,
  powerSpeed: 1.8,
  accSpeed: 2.5,
  practice: false,
  flyoverT: 0,
  prevBallPos: new THREE.Vector3(),
  animFrame: null,
  windSound: null,
  maxStrokes: 8,
};

function newWind(courseIdx) {
  const course = COURSES[courseIdx];
  const strength = course.wind * (0.5 + Math.random()*0.5);
  const dir = Math.random() * Math.PI * 2;
  G.wind = {
    x: Math.cos(dir) * strength * 0.5,
    z: Math.sin(dir) * strength * 0.5,
    speed: strength,
    dir: dir
  };
}

function autoSelectClub() {
  const d = distToHole();
  if(d < 5) G.clubIdx = 3; // putter
  else if(d < 25) G.clubIdx = 2; // iron
  else if(d < 50) G.clubIdx = 1; // wood
  else G.clubIdx = 0; // driver
}

function showScreen(el) {
  document.querySelectorAll('.scr').forEach(s => s.classList.remove('on'));
  if(el) el.classList.add('on');
}

function showHUD(show) {

  clubBtn.style.display = show ? 'block' : 'none';
}

function updateHUD() {
  hHole.textContent = 'H' + (G.holeIdx+1);

  hWind.textContent = windDirs[wi] + ' ' + G.wind.speed.toFixed(1) + 'm/s';

// ─── SCORECARD ──────────────────────────────────────────────
function buildScorecard(tableEl, scores, coursePars) {
  let html = '<tr><th>Hole</th>';
  for(let i=0; i<scores.length; i++) html += '<th>'+(i+1)+'</th>';
  html += '<th>TOT</th></tr><tr><td>Par</td>';
  let totalPar = 0;
  for(let i=0; i<scores.length; i++) { html+='<td>'+coursePars[i]+'</td>'; totalPar+=coursePars[i]; }
  html += '<td>'+totalPar+'</td></tr><tr><td>Score</td>';
  let total = 0;
  for(let i=0; i<scores.length; i++) {
    const diff = scores[i] - coursePars[i];
    const cls = diff < 0 ? 'un' : diff > 0 ? 'ov' : '';
    html += '<td class="'+cls+'">'+scores[i]+'</td>';
    total += scores[i];
  }
  html += '<td><b>'+total+'</b></td></tr>';
  tableEl.innerHTML = html;
  return {total, totalPar};
}

function getScoreName(strokes, par) {
  const diff = strokes - par;
  return SCORE_NAMES[String(diff)] || (diff > 0 ? '+'+diff : diff.toString());
}

function getRank(totalDiff) {
  if(totalDiff <= -9) return 'SS';
  if(totalDiff <= -5) return 'S';
  if(totalDiff <= -2) return 'A';
  if(totalDiff <= 1) return 'B';
  if(totalDiff <= 5) return 'C';
  return 'D';
}

// ─── MAIN GAME FLOW ─────────────────────────────────────────
function startRound(courseIdx, practice) {
  AUDIO.init();
  G.courseIdx = courseIdx;
  G.practice = practice;
  G.holeIdx = 0;
  G.scores = [];
  showScreen(null);
  startHole();
}

function startHole() {
  const course = COURSES[G.courseIdx];
  G.par = course.par[G.holeIdx];
  G.dist = course.dist[G.holeIdx];
  G.strokes = 0;
  newWind(G.courseIdx);

  buildCourse(G.courseIdx, G.holeIdx);
  
  if(!ballMesh) createBall();
  if(!aimLine) createAimLine();
  resetBall(0, 0, 0);
  
  // Point aim toward green
  aimAngle = Math.atan2(greenCenter.x - ballPos.x, -(greenCenter.z - ballPos.z));
  autoSelectClub();
  
  // Start flyover
  G.state = 'flyover';
  G.flyoverT = 0;
  showScreen(null);
  showHUD(false);
  showSwingPanel(false);
  hideAimLine();
  showFlyover(true);
  
  flyHole.textContent = 'H' + (G.holeIdx+1);
  flyName.textContent = course.name;
  flyInfo.textContent = 'Par ' + G.par + '  |  ' + G.dist + 'm';
  flyProg.style.width = '0%';
  
  if(G.windSound) { G.windSound.stop(); G.windSound = null; }
  if(G.wind.speed > 0.5) G.windSound = AUDIO.play('wind');
  
  ballMesh.visible = false;
  if(aimLine) aimLine.visible = false;
  if(aimArrow) aimArrow.visible = false;
}

function endFlyover() {
  G.state = 'aim';
  showFlyover(false);
  showHUD(true);
  showSwingPanel(true);
  aimGuide.style.display = 'block';
  puttInfo.style.display = 'none';
  ballMesh.visible = true;
  
  updateHUD();
  CAM.setBehindBall(true);
  updateAimLine(0.5);
}

function doSwing(power, accuracy) {
  G.strokes++;
  const club = CLUBS[G.clubIdx];
  
  // accuracy: 0-1, 0.5 = perfect
  const accError = (accuracy - 0.5) * 2; // -1 to 1
  const angleError = accError * 0.25; // max ~14 degrees off
  
  const totalAngle = aimAngle + angleError;
  const dist = club.maxDist * power;
  const loftRad = club.loft * Math.PI / 180;
  
  const speed = dist * 0.7; // tuned for feel
  const vx = Math.sin(totalAngle) * Math.cos(loftRad) * speed;
  const vy = Math.sin(loftRad) * speed;
  const vz = -Math.cos(totalAngle) * Math.cos(loftRad) * speed;
  
  // Spin effect
  const spinCurve = accError * club.spin * 2;
  
  ballVel.set(vx + spinCurve, vy, vz);
  ballOnGround = false;
  G.prevBallPos.copy(ballPos);
  
  G.state = 'flying';
  hideAimLine();
  showSwingPanel(false);
  aimGuide.style.display = 'none';
  
  if(club.name === 'Putter') {
    AUDIO.play('putt');
  } else {
    AUDIO.play('hit');
  }
  vibrate(30);
  
  updateHUD();
}

function onBallStopped(result) {
  if(result === 'holed') {
    // Ball in hole!
    const sName = getScoreName(G.strokes, G.par);
    showBigMessage(sName, G.strokes === 1 ? 'HOLE IN ONE!' : G.strokes + ' strokes', 2500);
    AUDIO.play('hole');
    vibrate([100,50,100,50,200]);
    spawnParticles(holePos.clone().add(new THREE.Vector3(0,0.5,0)), 30, 0xfdd835, 3, 5);
    spawnParticles(holePos.clone().add(new THREE.Vector3(0,0.3,0)), 20, 0xff6644, 2, 4);
    
    G.scores.push(G.strokes);
    CAM.setResult();
    
    setTimeout(()=> {
      bigMsg.style.display = 'none';
      showScorecard();
    }, 2800);
    G.state = 'result';
    return;
  }
  
  if(result === 'water') {
    showBigMessage('WATER', '+1 penalty', 1800);
    vibrate(200);
    G.strokes++;
    spawnParticles(ballPos.clone().add(new THREE.Vector3(0,0.2,0)), 15, 0x4488ff, 2, 3);
    setTimeout(()=>{
      bigMsg.style.display='none';
      resetBall(G.prevBallPos.x, 0, G.prevBallPos.z);
      goToAim();
    }, 2000);
    G.state = 'penalty';
    return;
  }
  
  if(result === 'ob') {
    showBigMessage('O.B.', '+1 penalty', 1800);
    vibrate(200);
    G.strokes++;
    setTimeout(()=>{
      bigMsg.style.display='none';
      resetBall(G.prevBallPos.x, 0, G.prevBallPos.z);
      goToAim();
    }, 2000);
    G.state = 'penalty';
    return;
  }
  
  // Max strokes check
  if(G.strokes >= G.maxStrokes) {
    showBigMessage('MAX', G.maxStrokes + ' strokes', 1800);
    G.scores.push(G.maxStrokes);
    setTimeout(()=>{
      bigMsg.style.display='none';
      showScorecard();
    }, 2000);
    G.state = 'result';
    return;
  }
  
  // Normal stop - continue playing
  goToAim();
}

function goToAim() {
  G.state = 'aim';
  aimAngle = Math.atan2(holePos.x - ballPos.x, -(holePos.z - ballPos.z));
  autoSelectClub();
  
  showHUD(true);
  showSwingPanel(true);
  updateHUD();
  CAM.setBehindBall(false);
  updateAimLine(0.5);
  aimGuide.style.display = 'block';
  
  // Show putt info if on green
  if(isOnGreen(ballPos.x, ballPos.z)) {
    const d = distToHole();
    puttInfo.innerHTML = 'Green ' + d.toFixed(1) + 'm';
    puttInfo.style.display = 'block';
  } else {
    puttInfo.style.display = 'none';
  }
}

function showScorecard() {
  const course = COURSES[G.courseIdx];
  scName.textContent = course.name;
  const pars = course.par.slice(0, G.scores.length);
  const {total, totalPar} = buildScorecard(scTable, G.scores, pars);
  const diff = total - totalPar;
  scTotal.textContent = total + ' (' + (diff>=0?'+':'') + diff + ')';
  
  if(G.holeIdx >= 8) {
    scNext.textContent = 'View Results';
  } else {
    scNext.textContent = 'Next Hole ▶';
  }
  
  showScreen(scoreScr);
  showHUD(false);
  G.state = 'scorecard';
}

function nextHole() {
  showScreen(null);
  G.holeIdx++;
  if(G.holeIdx >= 9) {
    showRoundResult();
    return;
  }
  startHole();
}

function showRoundResult() {
  const course = COURSES[G.courseIdx];
  rsName.textContent = course.name;
  const {total, totalPar} = buildScorecard(rsTable, G.scores, course.par);
  const diff = total - totalPar;
  rsTotal.textContent = total + ' (' + (diff>=0?'+':'') + diff + ')';
  rsRank.textContent = 'Rank: ' + getRank(diff);
  
  // Save record
  if(!G.practice) {
    STO.d.records.push({
      course: G.courseIdx,
      name: course.name,
      scores: [...G.scores],
      total,
      diff,
      date: new Date().toISOString().split('T')[0]
    });
    // Keep last 50 records
    if(STO.d.records.length > 50) STO.d.records = STO.d.records.slice(-50);
    STO.save();
  }
  
  showScreen(resultScr);
  showHUD(false);
  G.state = 'roundResult';
}

// ─── TOUCH / INPUT HANDLING ─────────────────────────────────
let touchStartX = 0;
let touchStartY = 0;
let isDragging = false;

function initInput() {
  const canvas = renderer.domElement;
  
  // Drag to aim
  canvas.addEventListener('pointerdown', e => {
    if(G.state !== 'aim') return;
    touchStartX = e.clientX;
    touchStartY = e.clientY;
    isDragging = true;
  });
  
  canvas.addEventListener('pointermove', e => {
    if(!isDragging || G.state !== 'aim') return;
    const dx = e.clientX - touchStartX;
    aimAngle -= dx * 0.004;
    touchStartX = e.clientX;
    touchStartY = e.clientY;
    CAM.setBehindBall(false);
    updateAimLine(0.5);
    updateHUD();
  });
  
  canvas.addEventListener('pointerup', () => { isDragging = false; });
  canvas.addEventListener('pointercancel', () => { isDragging = false; });
  
  // Swing button
  swingBtn.addEventListener('pointerdown', e => {
    e.stopPropagation();
    AUDIO.resume();
    if(G.state === 'aim') {
      // Start power gauge
      G.state = 'swingPower';
      G.power = 0;
      G.powerDir = 1;
      aimGuide.style.display = 'none';
      swingBtn.textContent = 'POWER!';
    } else if(G.state === 'swingPower') {
      // Lock power, start accuracy
      G.state = 'swingAccuracy';
      G.accuracy = 0;
      G.accDir = 1;
      powerMark.style.display = 'block';
      powerMark.style.left = (G.power*100) + '%';
      accBar.style.display = 'block';
      swingBtn.textContent = 'SWING!';
    } else if(G.state === 'swingAccuracy') {
      // Execute swing
      doSwing(G.power, G.accuracy);
    }
  });
  
  // Club switch
  clubBtn.addEventListener('click', () => {
    if(G.state !== 'aim') return;
    G.clubIdx = (G.clubIdx + 1) % CLUBS.length;
    clubBtn.textContent = CLUBS[G.clubIdx].name;
    updateAimLine(0.5);
    vibrate(10);
  });
  
  // Flyover skip
  flySkip.addEventListener('click', () => {
    if(G.state === 'flyover') endFlyover();
  });
  
  // Scorecard next
  scNext.addEventListener('click', () => {
    if(G.state === 'scorecard') nextHole();
  });
  
  // Result menu
  rsMenu.addEventListener('click', () => {
    showScreen(menuScr);
    showHUD(false);
    G.state = 'menu';
  });
  
  // Menu buttons
  btnPlay.addEventListener('click', () => {
    AUDIO.init();
    showCourseSelect(false);
  });
  
  btnPractice.addEventListener('click', () => {
    AUDIO.init();
    showCourseSelect(true);
  });
  
  btnRecords.addEventListener('click', showRecords);
  btnSettings.addEventListener('click', showSettings);
  courseBack.addEventListener('click', () => { showScreen(menuScr); G.state = 'menu'; });
  recordBack.addEventListener('click', () => { showScreen(menuScr); G.state = 'menu'; });
  setBack.addEventListener('click', () => { showScreen(menuScr); G.state = 'menu'; });
  
  setSave.addEventListener('click', () => {
    STO.d.name = setName.value || 'Player';
    STO.d.vol = parseInt(setVol.value);
    STO.d.vib = setVib.checked;
    AUDIO.vol = STO.d.vol / 100;
    STO.save();
    showScreen(menuScr);
    menuPlayer.textContent = STO.d.name;
    G.state = 'menu';
  });
}

function showCourseSelect(practice) {
  G.practice = practice;
  courseList.innerHTML = '';
  COURSES.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'courseItem';
    const totalPar = c.par.reduce((a,b)=>a+b,0);
    const best = STO.d.records.filter(r=>r.course===i).reduce((b,r)=>Math.min(b,r.total),Infinity);
    div.innerHTML = '<div class="cn">' + c.name + '</div>' +
      '<div class="ci">' + c.city + ' | Par ' + totalPar + ' | 9H</div>' +
      '<div class="cb">' + (best<Infinity ? 'Best: '+best : 'NEW') + '</div>';
    div.addEventListener('click', () => startRound(i, practice));
    courseList.appendChild(div);
  });
  showScreen(courseScr);
  G.state = 'courseSelect';
}

function showRecords() {
  const recs = STO.d.records;
  if(!recs.length) {
    recordList.innerHTML = '<p style="color:#888;text-align:center;padding:20px">No records yet</p>';
  } else {
    let html = '';
    const sorted = [...recs].reverse().slice(0, 20);
    sorted.forEach(r => {
      const diff = r.diff;
      const cls = diff < 0 ? 'un' : diff > 0 ? 'ov' : '';
      html += '<div style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 14px;margin-bottom:6px">' +
        '<div style="font-size:14px;font-weight:700">' + (r.name||COURSES[r.course].name) + '</div>' +
        '<div style="font-size:12px;color:#999">' + r.date + '</div>' +
        '<div class="'+cls+'" style="font-size:16px;font-weight:800">' + r.total + ' (' + (diff>=0?'+':'') + diff + ')</div></div>';
    });
    recordList.innerHTML = html;
  }
  showScreen(recordScr);
  G.state = 'records';
}

function showSettings() {
  setName.value = STO.d.name;
  setVol.value = STO.d.vol;
  setVib.checked = STO.d.vib;
  showScreen(settingScr);
  G.state = 'settings';
}

// ─── MAIN LOOP ──────────────────────────────────────────────
let waterTime = 0;

function gameLoop() {
  G.animFrame = requestAnimationFrame(gameLoop);
  const dt = Math.min(clock.getDelta(), 0.05);
  waterTime += dt;

  // Animate water
  waterAreas.forEach(w => {
    // We'll animate via material
  });
  if(MAT.water.opacity !== undefined) {
    MAT.water.opacity = 0.65 + Math.sin(waterTime*2)*0.1;
  }

  // Animate flag wave
  if(flagMesh) {
    flagMesh.rotation.y = Math.sin(waterTime*3)*0.15;
  }

  switch(G.state) {
    case 'flyover': {
      G.flyoverT += dt * 0.35;
      flyProg.style.width = Math.min(100, G.flyoverT*100) + '%';
      CAM.setFlyover(Math.min(G.flyoverT, 1), G.dist);
      if(G.flyoverT >= 1) endFlyover();
      break;
    }
    case 'aim': {
      CAM.setBehindBall(false);
      break;
    }
    case 'swingPower': {
      G.power += G.powerDir * G.powerSpeed * dt;
      if(G.power >= 1) { G.power = 1; G.powerDir = -1; }
      if(G.power <= 0) { G.power = 0; G.powerDir = 1; }
      powerFill.style.width = (G.power*100) + '%';
      updateAimLine(G.power);
      break;
    }
    case 'swingAccuracy': {
      G.accuracy += G.accDir * G.accSpeed * dt;
      if(G.accuracy >= 1) { G.accuracy = 1; G.accDir = -1; }
      if(G.accuracy <= 0) { G.accuracy = 0; G.accDir = 1; }
      accNeedle.style.left = (G.accuracy*100) + '%';
      break;
    }
    case 'flying': {
      const result = physicsTick(dt);
      CAM.setFollowBall();
      if(result === 'stopped' || result === 'holed' || result === 'water' || result === 'ob') {
        onBallStopped(result);
      }
      break;
    }
  }

  updateParticles(dt);
  CAM.update(dt);
  renderer.render(scene, camera);
}

// ─── INIT ───────────────────────────────────────────────────
function init() {
  STO.load();
  AUDIO.vol = STO.d.vol / 100;
  menuPlayer.textContent = STO.d.name;
  
  initThree();
  createBall();
  createAimLine();
  ballMesh.visible = false;
  aimLine.visible = false;
  aimArrow.visible = false;
  
  initInput();
  
  showScreen(menuScr);
  showHUD(false);
  showSwingPanel(false);
  G.state = 'menu';
  
  // Menu background scene
  buildCourse(0, 0);
  CAM.target.set(5, 10, 8);
  CAM.lookAt.set(0, 0, -15);
  CAM.current.copy(CAM.target);
  CAM.currentLookAt.copy(CAM.lookAt);
  
  gameLoop();
  
  // Register service worker
  if('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
}

init();

</script>
