#minimap{position:absolute;bottom:130px;right:6px;width:120px;height:120px;border-radius:10px;border:1.5px solid rgba(255,255,255,.2);z-index:12;pointer-events:none;overflow:hidden;display:none}

.barWrap{position:relative;height:22px;border-radius:11px;overflow:hidden;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.12);margin-bottom:8px}
#pwrFill{height:100%;width:0%;border-radius:11px;background:linear-gradient(90deg,#2ecc40,#f1c40f 50%,#e74c3c 85%);transition:none}
#accWrap{display:none}

.si{max-width:420px;margin:0 auto;padding:18px 14px}
.st{font-size:22px;font-weight:900;color:#ffd700;text-align:center;margin-bottom:4px}
.ss{font-size:12px;color:rgba(255,255,255,.5);text-align:center;margin-bottom:14px}
.scTbl{width:100%;border-collapse:collapse;margin-bottom:14px}
.scTbl th{background:rgba(255,215,0,.12);color:#ffd700;font-size:9px;padding:5px 3px;font-weight:700}
.scTbl td{text-align:center;padding:5px 3px;font-size:12px;color:#fff;border-bottom:1px solid rgba(255,255,255,.06)}
.eagle{color:#ffd700!important;font-weight:800}.birdie{color:#ff4444!important;font-weight:700}.par{color:rgba(255,255,255,.5)}.bogey{color:#4af}.dbogey{color:#88f}
.tot{text-align:center;font-size:16px;font-weight:800;color:#fff;margin:10px 0;padding:8px;background:rgba(255,215,0,.08);border-radius:8px}
.btn{display:block;width:100%;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;color:#fff;margin-top:8px;text-align:center}
.btn.p{background:linear-gradient(135deg,#27ae60,#2ecc71)}.btn.s{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15)}
.btn:active{transform:scale(.97);filter:brightness(.85)}
.resHole{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px;color:#fff}

#menuLogo{font-size:34px;font-weight:900;color:#ffd700;text-shadow:0 0 25px rgba(255,215,0,.35);margin-bottom:3px;letter-spacing:2px}
#menuSub{font-size:13px;color:rgba(255,255,255,.4);margin-bottom:26px}

.mb:active{transform:scale(.96);filter:brightness(.85)}
#btnPlay{background:linear-gradient(135deg,#27ae60,#2ecc71)}
#btnRec{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15)}
#btnSet{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15)}

.ph h2{flex:1;text-align:center;font-size:16px;color:#ffd700;font-weight:800}
.pb{background:none;border:none;color:rgba(255,255,255,.6);font-size:22px;cursor:pointer;padding:3px 6px}

.lt{color:#ffd700;font-size:15px;font-weight:700;margin-top:14px}
.lb{width:180px;height:3px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:8px;overflow:hidden}

</div></div>
<button id="clubBtn">드라이버</button>
<div id="minimap"><canvas id="mmCvs" width="160" height="160"></canvas></div>
<div id="bigMsg"></div>
<!-- Swing Panel -->
<div id="swingPanel"><div id="swingInner">
<div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="color:rgba(255,255,255,.5);font-size:10px;font-weight:700">파워</span><span id="swVal" style="color:#ffd700;font-size:13px;font-weight:800">0%</span></div>
<div class="barWrap" id="pwrWrap"><div id="pwrFill"></div></div>
<div class="barWrap" id="accWrap"><div id="accFill"></div></div>
<button id="swBtn" ontouchstart="onSwTap(event)" onclick="onSwTap(event)">스윙!</button>
</div></div>
<!-- Flyover -->
<div id="flyover"><div id="flyTop"><div id="flyH">1홀</div><div id="flyInfo"><span>PAR <em id="flyPar">4</em></span><span><em id="flyDist">50</em>m</span></div></div><button id="flySk" ontouchstart="endFly()" onclick="endFly()">건너뛰기 ▶</button></div>
<!-- Scorecard -->
<div id="scoreScr" class="scrFull"><div class="si"><div class="st" id="scTitle">스코어카드</div><div class="ss" id="scSub"></div><table class="scTbl" id="scTbl"></table><div class="tot" id="scTot"></div><button class="btn p" id="scNext" onclick="nextHole()">다음 홀</button></div></div>
<!-- Result -->
<div id="resultScr" class="scrFull"><div class="si"><div class="st" id="rsTitle">라운드 결과</div><div class="ss" id="rsSub"></div><div id="rsBody"></div><div class="tot" id="rsTot"></div><button class="btn p" onclick="startRound(G.ci)">다시 플레이</button><button class="btn s" onclick="showMenu()" style="margin-top:6px">메인 메뉴</button></div></div>
<!-- Menu -->
<div id="menuScr"><div id="menuLogo">파크골프 프로</div><div id="menuSub">전국투어 2026</div>
<button class="mb" id="btnPlay" onclick="openCourseSelect()">🏆 전국투어</button>
<button class="mb" id="btnRec" onclick="openRecords()">📊 기록실</button>
<button class="mb" id="btnSet" onclick="openSettings()">⚙️ 설정</button></div>
<!-- Course Select -->
<div id="courseScr" class="scrFull"><div class="ph"><button class="pb" onclick="showMenu()">←</button><h2>코스 선택</h2><div style="width:32px"></div></div><div id="cList"></div></div>
<!-- Records -->
<div id="recordScr" class="scrFull"><div class="ph"><button class="pb" onclick="showMenu()">←</button><h2>기록실</h2><div style="width:32px"></div></div><div id="rList"></div></div>
<!-- Settings -->
<div id="settingScr" class="scrFull"><div class="ph"><button class="pb" onclick="showMenu()">←</button><h2>설정</h2><div style="width:32px"></div></div>
<div class="sr"><label>볼륨</label><input type="range" id="sVol" min="0" max="100" value="80"></div>
<div class="sr"><label>진동</label><div class="tg on" id="sVib" onclick="this.classList.toggle('on')"></div></div>
</div>
<!-- Loading -->
<div id="loading"><div style="font-size:36px">⛳</div><div class="lt">로딩중...</div><div class="lb"><div class="lf" id="ldFill"></div></div></div>
</div>

const AUD={ctx:null,gain:null,
init(){if(this.ctx)return;this.ctx=new(window.AudioContext||window.webkitAudioContext)();this.gain=this.ctx.createGain();this.gain.connect(this.ctx.destination);this.gain.gain.value=STO.d.vol/100},

play(type){if(!this.ctx)return;this.resume();const t=this.ctx.currentTime;
const mk=(f,dur,tp='sine',vol=.3)=>{const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=tp;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(this.gain);o.start(t);o.stop(t+dur)};
const noise=(dur,vol=.1)=>{const sz=this.ctx.sampleRate*dur,buf=this.ctx.createBuffer(1,sz,this.ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<sz;i++)d[i]=(Math.random()*2-1)*vol;const s=this.ctx.createBufferSource(),g=this.ctx.createGain();s.buffer=buf;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(g);g.connect(this.gain);s.start(t);s.stop(t+dur)};
switch(type){
case'hit':mk(800,.08,'square',.4);mk(400,.15,'sine',.3);noise(.1,.15);break;
case'putt':mk(600,.06,'sine',.25);mk(300,.1,'sine',.15);break;

/* ===== SWING ANIMATION ===== */
const SA={active:false,phase:'idle',time:0,power:0,isPutt:false,cb:null,
dur:{back:.55,down:.15,hit:.04,follow:.75},
start(pwr,putt,cb){this.active=true;this.phase=putt?'pb':'back';this.time=0;this.power=pwr;this.isPutt=putt;this.cb=cb;if(!putt)AUD.play('swing')},
update(dt){if(!this.active||!golfer)return;this.time+=dt;this.isPutt?this._putt():this._full()},
_full(){const d=this.dur;
if(this.phase==='back'){const t=this.time/d.back;P.back(golfer,t);if(t>=1){this.phase='down';this.time=0}}
else if(this.phase==='down'){const t=this.time/d.down;P.down(golfer,t);if(t>=1){this.phase='hit';this.time=0;if(this.cb){this.cb();this.cb=null}vib(30)}}
else if(this.phase==='hit'){const t=this.time/d.hit;P.impact(golfer);if(t>=1){this.phase='follow';this.time=0}}
else if(this.phase==='follow'){const t=this.time/d.follow;P.follow(golfer,t);if(t>=1){this.active=false;this.phase='idle'}}},
_putt(){const T=this.time/.55;
if(T<.38)P.pstroke(golfer,-(T/.38));
else if(T<.58){P.pstroke(golfer,-1+(T-.38)/.2*2);if(T>=.48&&this.cb){this.cb();this.cb=null;vib(15)}}
else if(T<1)P.pstroke(golfer,1-(T-.58)/.42);
else{this.active=false;this.phase='idle';P.paddr(golfer)}},
reset(){this.active=false;this.phase='idle';this.time=0}};

for(let i=0;i<7;i++){const a=i/7*Math.PI*2,len=1.2*s+Math.random()*.5*s,sh=new THREE.Shape();sh.moveTo(0,0);sh.quadraticCurveTo(len*.3,.15*s,len,-.1*s);sh.quadraticCurveTo(len*.3,-.05*s,0,0);
const fr=new THREE.Mesh(new THREE.ShapeGeometry(sh),new THREE.MeshStandardMaterial({color:0x228833,roughness:.7,side:THREE.DoubleSide}));fr.position.copy(pts[10]);fr.rotation.set(-.3+Math.random()*.3,a,Math.random()*.2-.1);fr.castShadow=true;g.add(fr)}}

const cc=[0x2d8a2d,0x3a9a3a,0x228822,0x44aa44];for(let i=0;i<5;i++){const r=(.4+Math.random()*.3)*s;const sp=new THREE.Mesh(new THREE.SphereGeometry(r,8,6),new THREE.MeshStandardMaterial({color:cc[i%4],roughness:.72}));sp.position.set((Math.random()-.5)*.3*s,1.5*s+Math.random()*.5*s,(Math.random()-.5)*.3*s);sp.castShadow=true;g.add(sp)}}

/* ===== MOUNTAINS ===== */
function mkMountains(){const g=new THREE.Group();
for(let layer=0;layer<3;layer++){const dist=70+layer*35,color=[0x3a6a3a,0x4a7a4a,0x6a9a6a][layer],peaks=10+layer*4;
const verts=[],idx=[];for(let i=0;i<=peaks;i++){const a=(i/peaks)*Math.PI*2,r=dist+Math.random()*12,x=Math.cos(a)*r,z=Math.sin(a)*r,h=(10+Math.random()*18)*(1-layer*.25);

function buildCourse(ci,hi){if(grp)scene.remove(grp);grp=new THREE.Group();bunks=[];waters=[];fwPath=[];
const c=COURSES[ci],seed=ci*100+hi,rng=mulberry32(seed),dist=c.dist[hi];
teeP=new THREE.Vector3(0,0,0);const ang=rng()*Math.PI*.4-.2;holeP=new THREE.Vector3(Math.sin(ang)*dist*.3,0,-dist*.3);
// Ground
const gndGeo=new THREE.PlaneGeometry(140,140,80,80),pa=gndGeo.attributes.position.array;
for(let i=0;i<pa.length;i+=3){const gx=pa[i],gy=pa[i+1];pa[i+2]=Math.sin(gx*.04)*Math.cos(gy*.04)*.4+Math.sin(gx*.1+gy*.07)*.2+Math.cos(gx*.06-gy*.09)*.15}
gndGeo.computeVertexNormals();const gnd=new THREE.Mesh(gndGeo,M.grass);gnd.rotation.x=-Math.PI/2;gnd.receiveShadow=true;grp.add(gnd);
// Extended ground
const gnd2=new THREE.Mesh(new THREE.PlaneGeometry(300,300),M.grass);gnd2.rotation.x=-Math.PI/2;gnd2.position.y=-.05;gnd2.receiveShadow=true;grp.add(gnd2);
// Fairway
const midX=(teeP.x+holeP.x)/2+(rng()-.5)*dist*.15;
for(let i=0;i<=20;i++){const t=i/20,x=teeP.x*(1-t)*(1-t)+2*midX*t*(1-t)+holeP.x*t*t,z=teeP.z*(1-t)+holeP.z*t;fwPath.push(new THREE.Vector3(x,.01,z))}
const fwW=2.8+dist*.015;
for(let i=0;i<fwPath.length-1;i++){const p1=fwPath[i],p2=fwPath[i+1],dx=p2.x-p1.x,dz=p2.z-p1.z,len=Math.sqrt(dx*dx+dz*dz);
const fw=new THREE.Mesh(new THREE.PlaneGeometry(fwW,len),M.fairway);fw.rotation.x=-Math.PI/2;fw.rotation.z=-Math.atan2(dz,dx)+Math.PI/2;
fw.position.set((p1.x+p2.x)/2,.015,(p1.z+p2.z)/2);fw.receiveShadow=true;grp.add(fw);
for(const side of[-1,1]){const rw=new THREE.Mesh(new THREE.PlaneGeometry(fwW*.7,len),M.rough);const nx=-dz/len*side,nz=dx/len*side;
rw.rotation.x=-Math.PI/2;rw.rotation.z=-Math.atan2(dz,dx)+Math.PI/2;rw.position.set((p1.x+p2.x)/2+nx*(fwW*.85),.012,(p1.z+p2.z)/2+nz*(fwW*.85));rw.receiveShadow=true;grp.add(rw)}}
// Tee box
const tb=new THREE.Mesh(new THREE.PlaneGeometry(2.2,2.8),M.tee);tb.rotation.x=-Math.PI/2;tb.position.set(teeP.x,.02,teeP.z);tb.receiveShadow=true;grp.add(tb);
for(const sx of[-.6,.6]){const mk=new THREE.Mesh(new THREE.SphereGeometry(.055,8,6),M.white);mk.position.set(teeP.x+sx,.055,teeP.z+.8);mk.castShadow=true;grp.add(mk)}
// Green
grnR=2.8+dist*.012;grnC=holeP.clone();
const gm=new THREE.Mesh(new THREE.CircleGeometry(grnR,32),M.green);gm.rotation.x=-Math.PI/2;gm.position.set(grnC.x,.025,grnC.z);gm.receiveShadow=true;grp.add(gm);
const fri=new THREE.Mesh(new THREE.RingGeometry(grnR,grnR+.6,32),M.fairway);fri.rotation.x=-Math.PI/2;fri.position.set(grnC.x,.018,grnC.z);fri.receiveShadow=true;grp.add(fri);
// Hole + flag
grp.add(mkM(new THREE.CylinderGeometry(.054,.054,.05,16),new THREE.MeshStandardMaterial({color:0x111111}),holeP.x,0,holeP.z,false));
const pl=new THREE.Mesh(new THREE.CylinderGeometry(.007,.007,1.2,6),M.pole);pl.position.set(holeP.x,.6,holeP.z);pl.castShadow=true;grp.add(pl);
const fs=new THREE.Shape();fs.moveTo(0,0);fs.lineTo(.28,-.07);fs.lineTo(0,-.14);
flagM=new THREE.Mesh(new THREE.ShapeGeometry(fs),M.red);flagM.position.set(holeP.x+.007,1.18,holeP.z);flagM.castShadow=true;grp.add(flagM);
// Bunkers
if(rng()>.25){const nb=1+Math.floor(rng()*2);for(let i=0;i<nb;i++){const bt=.5+rng()*.35,bp=new THREE.Vector3();bp.lerpVectors(teeP,holeP,bt);
const bpx=bp.x+(rng()-.5)*fwW*1.5,bpz=bp.z+(rng()-.5)*2,br=.8+rng()*.9;
const bm=new THREE.Mesh(new THREE.CircleGeometry(br,16),M.sand);bm.rotation.x=-Math.PI/2;bm.position.set(bpx,.022,bpz);bm.receiveShadow=true;grp.add(bm);
const lip=new THREE.Mesh(new THREE.TorusGeometry(br,.055,6,24),new THREE.MeshStandardMaterial({color:0xc4a44a,roughness:.78}));lip.rotation.x=-Math.PI/2;lip.position.set(bpx,.05,bpz);lip.castShadow=true;grp.add(lip);
bunks.push({x:bpx,z:bpz,r:br})}}
// Water
if(c.water.includes(hi+1)){const wt=.3+rng()*.35,wp=new THREE.Vector3();wp.lerpVectors(teeP,holeP,wt);
const woff=(rng()>.5?1:-1)*(fwW*.8+rng()*2),wx=wp.x+woff,wz=wp.z+(rng()-.5)*3,ww=3.5+rng()*3.5,wh=2.5+rng()*2;
const wm=new THREE.Mesh(new THREE.PlaneGeometry(ww,wh),M.water);wm.rotation.x=-Math.PI/2;wm.position.set(wx,.008,wz);wm.receiveShadow=true;wm.userData={isWater:true,baseY:.008};grp.add(wm);
waters.push({x:wx,z:wz,w:ww/2,h:wh/2,mesh:wm});
for(let i=0;i<8;i++){const ra=rng()*Math.PI*2,rd=Math.max(ww,wh)/2+.2+rng()*.5;
const rk=new THREE.Mesh(new THREE.DodecahedronGeometry(.12+rng()*.22,0),M.rock);rk.position.set(wx+Math.cos(ra)*rd,.08,wz+Math.sin(ra)*rd);rk.rotation.set(rng(),rng(),rng());rk.castShadow=true;grp.add(rk)}}
// Trees
const nTrees=12+Math.floor(rng()*12);for(let i=0;i<nTrees;i++){const ta=rng()*Math.PI*2,td=5+rng()*45;
const tx=Math.cos(ta)*td,tz=-dist*.15+Math.sin(ta)*td;let onFw=false;for(const fp of fwPath)if(Math.hypot(tx-fp.x,tz-fp.z)<fwW*1.3){onFw=true;break}
if(onFw)continue;const tt=c.trees==='mixed'?['deciduous','pine','palm'][Math.floor(rng()*3)]:c.trees;grp.add(mkTree(tt,tx,tz,.8+rng()*.5))}
// Flowers
const fMats=[M.fl1,M.fl2,M.fl3];
for(let i=0;i<6+Math.floor(rng()*10);i++){const fa=rng()*Math.PI*2,fd=4+rng()*22,fx=Math.cos(fa)*fd,fz=-dist*.15+Math.sin(fa)*fd;
const fl=new THREE.Mesh(new THREE.SphereGeometry(.06+rng()*.05,6,4),fMats[Math.floor(rng()*3)]);fl.position.set(fx,.07+rng()*.04,fz);fl.castShadow=true;grp.add(fl);
grp.add(mkM(new THREE.CylinderGeometry(.006,.006,.08,4),new THREE.MeshStandardMaterial({color:0x228822}),fx,.035,fz,false))}
// Cart path
const cp=new THREE.Mesh(new THREE.PlaneGeometry(.65,dist*.38),M.dirt);cp.rotation.x=-Math.PI/2;cp.position.set(teeP.x+fwW+1.8,.013,(teeP.z+holeP.z)/2);cp.receiveShadow=true;grp.add(cp);
// OB stakes
obB=16+dist*.13;for(let a=0;a<Math.PI*2;a+=Math.PI/6){const ox=Math.cos(a)*obB,oz=-dist*.15+Math.sin(a)*obB;grp.add(mkM(new THREE.CylinderGeometry(.018,.018,.38,4),M.ob,ox,.19,oz,false))}
grp.add(mkMountains());scene.add(grp)}

function mkBall(){ballM=new THREE.Mesh(new THREE.SphereGeometry(.021,16,12),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.22,metalness:.05}));ballM.castShadow=true;ballM.scale.set(3,3,3);scene.add(ballM);

function updBM(){if(!ballM)return;ballM.position.set(G.ball.x,G.ball.y,G.ball.z);ballShadow.position.set(G.ball.x,.004,G.ball.z);const h=Math.max(0,G.ball.y-.063);ballShadow.scale.setScalar(1+h*2);ballShadow.material.opacity=.28/(1+h*3)}
function mkAim(){const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(new Float32Array(60*3),3));

function updAim(pwr){if(!aimLine||!G)return;const club=CLUBS[G.ci],maxD=club.power*(pwr/100)*2.5,loft=rad(club.loft),dir=G.aim;
const pts=aimLine.geometry.attributes.position.array,n=20,dx=Math.sin(dir),dz=-Math.cos(dir);
for(let i=0;i<n;i++){const t=i/(n-1),d=maxD*t*.3,h=Math.sin(t*Math.PI)*maxD*Math.sin(loft)*.06;pts[i*3]=G.ball.x+dx*d;pts[i*3+1]=.063+h;pts[i*3+2]=G.ball.z+dz*d}
for(let i=n;i<60;i++)pts[i*3]=pts[i*3+1]=pts[i*3+2]=0;aimLine.geometry.attributes.position.needsUpdate=true;
aimDot.position.set(G.ball.x+dx*maxD*.3,.063,G.ball.z+dz*maxD*.3);aimDot.visible=true}
function hideAim(){if(aimLine)aimLine.visible=false;if(aimDot)aimDot.visible=false}
function showAimL(){if(aimLine)aimLine.visible=true;if(aimDot)aimDot.visible=true}
function initTrail(){const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(new Float32Array(90*3),3));geo.setDrawRange(0,0);trailLine=new THREE.Line(geo,new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.45}));scene.add(trailLine)}
function updTrail(){if(!trailLine||!G.ball.flying)return;trailPts.push(G.ball.x,G.ball.y,G.ball.z);if(trailPts.length>90*3)trailPts.splice(0,3);const a=trailLine.geometry.attributes.position.array;for(let i=0;i<trailPts.length;i++)a[i]=trailPts[i];trailLine.geometry.attributes.position.needsUpdate=true;trailLine.geometry.setDrawRange(0,trailPts.length/3);trailLine.visible=true}

function spawnP(x,y,z,col,n=10){for(let i=0;i<n;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.012,4,3),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.75}));m.position.set(x,y,z);scene.add(m);particles.push({m,v:{x:(Math.random()-.5)*.1,y:.04+Math.random()*.1,z:(Math.random()-.5)*.1},life:1})}}
function updP(dt){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.m.position.x+=p.v.x*dt*3;p.m.position.y+=p.v.y*dt*3;p.m.position.z+=p.v.z*dt*3;p.v.y-=.15*dt;p.life-=dt*1.5;p.m.material.opacity=p.life;if(p.life<=0){scene.remove(p.m);particles.splice(i,1)}}}

/* ===== CAMERA ===== */
const CAM={
tgt:new THREE.Vector3(),pos:new THREE.Vector3(),mode:'behind',shakeT:0,shakeI:0,
behind(bp,aa){const d=3.8,h=2.4;this.tgt.set(bp.x-Math.sin(aa)*.8,.25,bp.z+Math.cos(aa)*.8);this.pos.set(bp.x+Math.sin(aa)*d,bp.y+h,bp.z+Math.cos(aa)*d)},
swingClose(bp,aa){this.tgt.set(bp.x,.85,bp.z);const sa=aa+Math.PI*.12;this.pos.set(bp.x+Math.sin(sa)*2.8,bp.y+1.6,bp.z+Math.cos(sa)*2.8)},
follow(bp,v){const sp=Math.sqrt(v.x*v.x+v.z*v.z),d=4.5+sp*.4,h=2.2+bp.y*.4;const bh=sp>.1?Math.atan2(-v.x,-v.z):G.aim;this.tgt.lerp(new THREE.Vector3(bp.x,bp.y*.4,bp.z),.07);this.pos.lerp(new THREE.Vector3(bp.x+Math.sin(bh)*d,h,bp.z+Math.cos(bh)*d),.05)},
flyover(t,tp,hp){const p=clamp(t,0,1),cx=lerp(tp.x,hp.x,p),cz=lerp(tp.z,hp.z,p),d=tp.distanceTo(hp),h=4.5+d*.08,a=Math.atan2(hp.x-tp.x,hp.z-tp.z);this.pos.set(cx+Math.sin(a+.3)*6.5,h,cz+Math.cos(a+.3)*6.5);this.tgt.set(cx,0,cz)},
result(hp){const t=performance.now()*.00025;this.pos.set(hp.x+Math.sin(t)*3.5,2.2,hp.z+Math.cos(t)*3.5);this.tgt.set(hp.x,.4,hp.z)},
shake(i=.03,d=.2){this.shakeT=d;this.shakeI=i},
update(dt){const sp=this.mode==='flyover'||this.mode==='result'?.99:.06;camera.position.lerp(this.pos,sp);const lt=this.tgt.clone();if(this.shakeT>0){this.shakeT-=dt;const s=this.shakeI*(this.shakeT/.2);lt.x+=Math.sin(performance.now()*.05)*s;lt.y+=Math.cos(performance.now()*.07)*s}camera.lookAt(lt)}
};

/* ===== PHYSICS ===== */
function gndH(x,z){return Math.sin(x*.04)*Math.cos(z*.04)*.4+Math.sin(x*.1+z*.07)*.2+Math.cos(x*.06-z*.09)*.15}
function isGrn(x,z){return grnC&&Math.hypot(x-grnC.x,z-grnC.z)<grnR}
function isBnk(x,z){for(const b of bunks)if(Math.hypot(x-b.x,z-b.z)<b.r)return true;return false}
function physTick(dt){
if(!G.ball.flying)return;const ss=3,sd=dt/ss;
for(let s=0;s<ss;s++){
G.ball.vy-=9.81*sd;G.ball.vx*=(1-.03*sd);G.ball.vz*=(1-.03*sd);
G.ball.vx+=G.wind.x*sd*.08;G.ball.vz+=G.wind.z*sd*.08;
G.ball.x+=G.ball.vx*sd;G.ball.y+=G.ball.vy*sd;G.ball.z+=G.ball.vz*sd;
const gh=gndH(G.ball.x,G.ball.z);
if(G.ball.y<=gh+.063){
G.ball.y=gh+.063;const onG=isGrn(G.ball.x,G.ball.z),inB=isBnk(G.ball.x,G.ball.z);
if(G.ball.vy<-.3){G.ball.vy=-G.ball.vy*(inB?.15:onG?.3:.45);G.ball.vx*=.7;G.ball.vz*=.7;AUD.play('bounce');spawnP(G.ball.x,G.ball.y,G.ball.z,inB?0xd4b978:0x44aa44,5)}else G.ball.vy=0;
const fr=onG?.985:inB?.93:.96;G.ball.vx*=fr;G.ball.vz*=fr;
if(onG&&holeP){const dx=holeP.x-G.ball.x,dz=holeP.z-G.ball.z,dd=Math.sqrt(dx*dx+dz*dz);if(dd>.1&&dd<grnR){const sl=.015/(dd+.5);G.ball.vx+=dx/dd*sl;G.ball.vz+=dz/dd*sl}}
const spd=Math.sqrt(G.ball.vx*G.ball.vx+G.ball.vy*G.ball.vy+G.ball.vz*G.ball.vz);
if(spd<.02&&Math.abs(G.ball.vy)<.05){G.ball.vx=G.ball.vy=G.ball.vz=0;G.ball.flying=false;G.ball.stopped=true}}
for(const w of waters){if(Math.abs(G.ball.x-w.x)<w.w&&Math.abs(G.ball.z-w.z)<w.h&&G.ball.y<.1){G.ball.flying=false;G.ball.stopped=true;G.ball.inWater=true;AUD.play('splash');spawnP(G.ball.x,.05,G.ball.z,0x4488cc,15);CAM.shake(.04,.3);return}}
if(holeP&&Math.hypot(G.ball.x,G.ball.z+holeP.z*.5)>obB){G.ball.flying=false;G.ball.stopped=true;G.ball.isOB=true;AUD.play('ob');return}
if(holeP){const hd=Math.hypot(G.ball.x-holeP.x,G.ball.z-holeP.z),sp2=Math.sqrt(G.ball.vx*G.ball.vx+G.ball.vz*G.ball.vz);
if(hd<.12&&G.ball.y<.15&&sp2<2.2){G.ball.x=holeP.x;G.ball.z=holeP.z;G.ball.y=0;G.ball.vx=G.ball.vy=G.ball.vz=0;G.ball.flying=false;G.ball.stopped=true;G.ball.holed=true;AUD.play('hole');spawnP(holeP.x,.1,holeP.z,0xffd700,20);CAM.shake(.02,.3);return}}
}}

function drawMinimap(){
const cv=$('mmCvs');if(!cv)return;const ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
ctx.clearRect(0,0,W,H);
ctx.fillStyle='rgba(0,60,0,0.85)';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;ctx.strokeRect(0,0,W,H);
const sc=W/160,ox=W/2,oz=H*.85;
const tx=x=>ox+x*sc,tz=z=>oz+z*sc;
// Fairway
if(teeP&&holeP){
ctx.fillStyle='rgba(100,200,80,0.4)';ctx.beginPath();
ctx.ellipse(tx((teeP.x+holeP.x)/2),tz((teeP.z+holeP.z)/2),
Math.abs(holeP.z-teeP.z)*sc/2+10,15,
Math.atan2(holeP.x-teeP.x,holeP.z-teeP.z),0,Math.PI*2);ctx.fill();
// Green
ctx.fillStyle='rgba(0,180,60,0.7)';ctx.beginPath();ctx.arc(tx(holeP.x),tz(holeP.z),8,0,Math.PI*2);ctx.fill();
// Pin
ctx.fillStyle='#ff3333';ctx.beginPath();ctx.arc(tx(holeP.x),tz(holeP.z),3,0,Math.PI*2);ctx.fill();
// Tee
ctx.fillStyle='#ffcc00';ctx.beginPath();ctx.arc(tx(teeP.x),tz(teeP.z),3,0,Math.PI*2);ctx.fill()}
// Water
waters.forEach(w=>{ctx.fillStyle='rgba(30,100,200,0.5)';ctx.beginPath();ctx.arc(tx(w.x),tz(w.z),5,0,Math.PI*2);ctx.fill()});
// Ball
ctx.fillStyle='#ffffff';ctx.strokeStyle='#000';ctx.lineWidth=1;
ctx.beginPath();ctx.arc(tx(G.ball.x),tz(G.ball.z),4,0,Math.PI*2);ctx.fill();ctx.stroke();
// Wind arrow
if(G.wind.spd>0){ctx.save();ctx.translate(W-20,20);ctx.rotate(G.wind.dir);
ctx.strokeStyle='#ff6';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(0,10);ctx.moveTo(-4,-5);ctx.lineTo(0,-10);ctx.lineTo(4,-5);ctx.stroke();ctx.restore();
ctx.fillStyle='#ff6';ctx.font='9px sans-serif';ctx.textAlign='center';ctx.fillText(`${G.wind.spd.toFixed(1)}`,W-20,38)}}

function mkScore(){
const c=COURSES[G.ci];
let html='<tr><th>홀</th>';for(let i=0;i<9;i++)html+=`<th>${i+1}</th>`;html+='<th>합</th></tr>';
html+='<tr><td>PAR</td>';let tp=0;for(let i=0;i<9;i++){tp+=c.par[i];html+=`<td>${c.par[i]}</td>`}html+=`<td>${tp}</td></tr>`;
html+='<tr><td>타수</td>';let ts=0;
for(let i=0;i<9;i++){const s=G.scores[i];
if(s!==undefined){ts+=s;const d=s-c.par[i];const cls=d<=-2?'eagle':d===-1?'birdie':d===0?'par':d===1?'bogey':'dbogey';
html+=`<td class="${cls}">${s}</td>`}else html+='<td>-</td>'}
html+=`<td>${ts||'-'}</td></tr>`;
$('scTbl').innerHTML=html;
$('scTot').textContent=ts?`${ts}타 (${ts-tp>=0?'+':''}${ts-tp})`:'';
$('scTitle').textContent=c.name;$('scSub').textContent=`${G.hi+1}홀 완료`}

/* ===== WIND ===== */
function setWind(){
const c=COURSES[G.ci];
G.wind.spd=Math.random()*(c.wind||3)+.5;
G.wind.dir=Math.random()*Math.PI*2;
G.wind.x=Math.sin(G.wind.dir)*G.wind.spd*.15;
G.wind.z=Math.cos(G.wind.dir)*G.wind.spd*.15}

/* ===== AUTO CLUB ===== */
function autoClub(){
const d=holeP?Math.hypot(G.ball.x-holeP.x,G.ball.z-holeP.z):50;
if(d<8){G.ci_=3;G.putting=true}
else if(d<25){G.ci_=2;G.putting=false}
else if(d<50){G.ci_=1;G.putting=false}
else{G.ci_=0;G.putting=false}}

/* ===== POSITION GOLFER ===== */
function posGolfer(){
if(!golfer)return;golfer.visible=true;
golfer.position.set(G.ball.x,gndH(G.ball.x,G.ball.z),G.ball.z);
golfer.rotation.set(0,G.aim,0);
P.addr(golfer)}

/* ===== START ROUND ===== */
function startRound(ci){
G.ci=ci;G.hi=0;G.scores=[];G.roundActive=true;
showScr('loading');$('ldFill').style.width='0%';
setTimeout(()=>{$('ldFill').style.width='50%'},100);
setTimeout(()=>{$('ldFill').style.width='100%';startHole()},500)}

/* ===== START HOLE ===== */
function startHole(){
const c=COURSES[G.ci];
G.par=c.par[G.hi];G.stroke=0;G.settled=false;G.putting=false;G.ci_=0;
G.ball.holed=false;G.ball.inWater=false;G.ball.isOB=false;G.ball.flying=false;G.ball.stopped=true;
setWind();buildCourse(G.ci,G.hi);
// Reset ball to tee
G.ball.x=teeP.x;G.ball.y=gndH(teeP.x,teeP.z)+.063;G.ball.z=teeP.z;
G.ball.vx=G.ball.vy=G.ball.vz=0;
updBM();if(ballM)ballM.visible=true;
autoClub();
// Aim toward hole
G.aim=Math.atan2(holeP.x-teeP.x,-(holeP.z-teeP.z));
clearTrail();
// Flyover
G.flyActive=true;G.flyT=0;
showScr('flyover');
$('flyH').textContent=`${G.hi+1}홀`;
$('flyPar').textContent=G.par;
$('flyDist').textContent=c.dist[G.hi];
updHUD();drawMinimap();
AUD.init();AUD.resume()}

/* ===== END FLYOVER ===== */
window.endFly=function(){
G.flyActive=false;G.state='aim';
showScr('game');
posGolfer();
updAim(70);showAimL();
CAM.behind({x:G.ball.x,y:G.ball.y,z:G.ball.z},G.aim);CAM.mode='behind';
updHUD();drawMinimap();
showBig(`${G.hi+1}홀 PAR ${G.par}`,1500)};

/* ===== DO SWING ===== */
function doSwing(power,accuracy){
G.state='swing';G.settled=false;G.stroke++;
const club=CLUBS[G.ci_];
const accOff=(accuracy-50)/50*.12;
const dir=G.aim+accOff;
const spd=club.power*(power/100);
const loft=rad(club.loft);
G.ball.vx=Math.sin(dir)*Math.cos(loft)*spd;
G.ball.vy=Math.sin(loft)*spd;
G.ball.vz=-Math.cos(dir)*Math.cos(loft)*spd;
G.ball.flying=true;G.ball.stopped=false;G.ball.holed=false;G.ball.inWater=false;G.ball.isOB=false;
hideAim();clearTrail();
if(!G.putting)AUD.play('hit');else AUD.play('putt');
SA.start(power,G.putting,null);
CAM.swingClose({x:G.ball.x,y:G.ball.y,z:G.ball.z},G.aim);CAM.mode='swing';
CAM.shake(.03,.25);
updHUD()}

/* ===== ON BALL STOP ===== */
function onBallStop(){
if(G.settled)return;G.settled=true;
updBM();
// Holed
if(G.ball.holed){
if(ballM)ballM.visible=false;
const diff=G.stroke-G.par;
let msg='';
if(G.stroke===1)msg='🎉 홀인원!!!';
else if(diff<=-3)msg='🦅 알바트로스!';
else if(diff===-2)msg='🦅 이글!';
else if(diff===-1)msg='🐦 버디!';
else if(diff===0)msg='👍 파!';
else if(diff===1)msg='보기';
else if(diff===2)msg='더블보기';
else msg='트리플보기+';
showBig(msg,2500);if(golfer)P.celebrate(golfer);
G.scores[G.hi]=G.stroke;
setTimeout(()=>showScorecard(),3000);return}
// Water penalty
if(G.ball.inWater){showBig('💦 워터 해저드! +1벌타',1800);G.stroke++;
G.ball.x=teeP.x;G.ball.y=gndH(teeP.x,teeP.z)+.063;G.ball.z=teeP.z;
G.ball.vx=G.ball.vy=G.ball.vz=0;G.ball.flying=false;G.ball.stopped=true;updBM()}
// OB penalty
if(G.ball.isOB){showBig('⚠️ OB! +1벌타',1800);G.stroke++;
G.ball.x=teeP.x;G.ball.y=gndH(teeP.x,teeP.z)+.063;G.ball.z=teeP.z;
G.ball.vx=G.ball.vy=G.ball.vz=0;G.ball.flying=false;G.ball.stopped=true;updBM()}
// Max strokes
if(G.stroke>=G.maxStk){showBig('최대타수 도달',1500);G.scores[G.hi]=G.maxStk;
setTimeout(()=>showScorecard(),2000);return}
// Continue
setTimeout(()=>{
autoClub();
G.aim=Math.atan2(holeP.x-G.ball.x,-(holeP.z-G.ball.z));
posGolfer();updAim(70);showAimL();
G.state='aim';
CAM.behind({x:G.ball.x,y:G.ball.y,z:G.ball.z},G.aim);CAM.mode='behind';
showScr('game');updHUD();drawMinimap()},800)}

/* ===== SCORECARD ===== */
function showScorecard(){mkScore();showScr('score');G.state='score'}

/* ===== NEXT HOLE ===== */
window.nextHole=function(){
if(G.hi<8){G.hi++;showScr('loading');$('ldFill').style.width='0%';
setTimeout(()=>{$('ldFill').style.width='100%';startHole()},400)}
else showResult()};

/* ===== RESULT ===== */
function showResult(){
G.roundActive=false;const c=COURSES[G.ci];
let tp=0,ts=0;for(let i=0;i<9;i++){tp+=c.par[i];ts+=G.scores[i]||0}
$('rsTitle').textContent=c.name+' 라운드 결과';
$('rsSub').textContent=`${ts}타`;
const diff=ts-tp;
$('rsTot').textContent=diff===0?'이븐파':diff>0?`+${diff}`:`${diff}`;
$('rsTot').style.color=diff<0?'#4f4':diff===0?'#fff':'#f66';
let html='';for(let i=0;i<9;i++){const s=G.scores[i]||0,p=c.par[i],d=s-p;
const cls=d<=-2?'eagle':d===-1?'birdie':d===0?'par':d===1?'bogey':'dbogey';
html+=`<div class="resHole"><span>${i+1}홀</span><span>PAR${p}</span><span class="${cls}">${s}(${d>=0?'+':''}${d})</span></div>`}
$('rsBody').innerHTML=html;
// Save best
const data=STO.d;const key='c'+G.ci;
if(!data.best[key]||ts<data.best[key]){data.best[key]=ts;STO.save()}
showScr('result');G.state='result'}

/* ===== GAUGE TICK ===== */
function tickGauge(dt){
if(G.swPhase==='power'){
G.gaugeVal+=G.gaugeDir*2.8*dt*100;
if(G.gaugeVal>=100){G.gaugeVal=100;G.gaugeDir=-1}
if(G.gaugeVal<=0){G.gaugeVal=0;G.gaugeDir=1}
$('pwrFill').style.width=G.gaugeVal+'%';
$('swVal').textContent=Math.round(G.gaugeVal)+'%'}
else if(G.swPhase==='accuracy'){
G.accVal+=G.accDir*3.4*dt*100;
if(G.accVal>=100){G.accVal=100;G.accDir=-1}
if(G.accVal<=0){G.accVal=0;G.accDir=1}
$('accFill').style.width=G.accVal+'%'}}

/* ===== SWING TAP ===== */
window.onSwTap=function(e){
if(e)e.preventDefault();
if(G.swPhase==='power'){
G.power=G.gaugeVal;G.swPhase='accuracy';
$('accWrap').style.display='block';G.accVal=50;G.accDir=1;
$('swVal').textContent='정확도';AUD.play('click')}
else if(G.swPhase==='accuracy'){
G.accuracy=G.accVal;G.swPhase='idle';
showSwing(false);showScr('game');
doSwing(G.power,G.accuracy);AUD.play('click')}};

/* ===== TOUCH / MOUSE INPUT ===== */
let dragStart=null,dragging=false,lastTouch=null;
function getXY(e){if(e.touches&&e.touches.length>0)return{x:e.touches[0].clientX,y:e.touches[0].clientY};return{x:e.clientX,y:e.clientY}}

function onPtrDown(e){
AUD.init();AUD.resume();
const p=getXY(e);dragStart={x:p.x,y:p.y};dragging=false;lastTouch=p}

function onPtrMove(e){
if(!dragStart)return;const p=getXY(e);
if(Math.abs(p.x-dragStart.x)+Math.abs(p.y-dragStart.y)>5)dragging=true;
if(dragging&&G.state==='aim'){
const sens=0.004;
G.aim-=(p.x-lastTouch.x)*sens;
updAim(70);
if(golfer)golfer.rotation.y=G.aim;
CAM.behind({x:G.ball.x,y:G.ball.y,z:G.ball.z},G.aim);CAM.update(0)}
lastTouch=p}

function onPtrUp(e){
if(!dragging){
if(G.state==='aim'){
showSwing(true);showScr('swing');
if(G.putting)P.paddr(golfer);else P.addr(golfer)}
else if(G.flyActive){endFly()}}
dragStart=null;dragging=false}

/* Keyboard */
function onKey(e){
if(e.code==='Space'||e.code==='Enter'){
if(G.state==='aim'){showSwing(true);showScr('swing')}
else if(G.swPhase==='power'||G.swPhase==='accuracy'){onSwTap()}
else if(G.flyActive){endFly()}
else if(G.state==='score'){nextHole()}}
if(G.state==='aim'){
if(e.code==='ArrowLeft'){G.aim+=.03;updAim(70);if(golfer)golfer.rotation.y=G.aim;CAM.behind({x:G.ball.x,y:G.ball.y,z:G.ball.z},G.aim)}
if(e.code==='ArrowRight'){G.aim-=.03;updAim(70);if(golfer)golfer.rotation.y=G.aim;CAM.behind({x:G.ball.x,y:G.ball.y,z:G.ball.z},G.aim)}}}

function bindInput(){
const cv=renderer.domElement;
cv.addEventListener('mousedown',onPtrDown);cv.addEventListener('mousemove',onPtrMove);cv.addEventListener('mouseup',onPtrUp);
cv.addEventListener('touchstart',onPtrDown,{passive:true});cv.addEventListener('touchmove',onPtrMove,{passive:true});cv.addEventListener('touchend',onPtrUp);
document.addEventListener('keydown',onKey)}

/* ===== CLUB CYCLE ===== */
$('clubBtn').onclick=function(){
G.ci_=(G.ci_+1)%4;G.putting=G.ci_===3;
updHUD();AUD.play('click')};

/* ===== MENU FUNCTIONS ===== */
window.showMenu=function(){G.state='menu';showScr('menu')};
window.openCourseSelect=function(){
let html='';COURSES.forEach((c,i)=>{
const tp=c.par.reduce((a,v)=>a+v,0);
const best=STO.d.best&&STO.d.best['c'+i]?` 🏆 ${STO.d.best['c'+i]}타`:'';
html+=`<div class="ci" onclick="startRound(${i})"><div style="width:40px;height:40px;border-radius:8px;background:linear-gradient(135deg,#2a8a2a,#4aba4a);display:flex;align-items:center;justify-content:center;font-size:18px;margin-right:12px">⛳</div><div><div class="cn">${c.name}</div><div class="cc">${c.city} · 9홀 · PAR ${tp}${best}</div></div></div>`});
$('cList').innerHTML=html;showScr('course');G.state='course'};
window.openRecords=function(){
let html='';COURSES.forEach((c,i)=>{
const tp=c.par.reduce((a,v)=>a+v,0);
const best=STO.d.best&&STO.d.best['c'+i];
html+=`<div style="padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.05)"><div style="display:flex;justify-content:space-between"><span style="color:#fff;font-weight:700">${c.name}</span><span style="color:${best?'#ffd700':'rgba(255,255,255,.3)'}">${best?best+'타':'-'}</span></div><div style="font-size:10px;color:rgba(255,255,255,.4)">${c.city} · PAR ${tp}${best?` (${best-tp>=0?'+':''}${best-tp})`:''}</div></div>`});
$('rList').innerHTML=html;showScr('records');G.state='records'};
window.openSettings=function(){showScr('settings');G.state='settings'};
window.startRound=startRound;

/* ===== MAIN GAME LOOP ===== */
const clock=new THREE.Clock();
let lastMiniT=0;

function gameLoop(){
requestAnimationFrame(gameLoop);
const dt=Math.min(clock.getDelta(),.05);
const elapsed=clock.getElapsedTime();

// Gauge
if(G.swPhase==='power'||G.swPhase==='accuracy')tickGauge(dt);

// Swing animation
SA.update(dt);

// Flyover
if(G.flyActive){
G.flyT+=dt*.35;
if(G.flyT>=1)endFly();
else{const t=G.flyT;CAM.flyover(t,teeP,holeP);CAM.update(dt)}}

// Physics
if(G.state==='swing'&&G.ball.flying){
physTick(dt);updBM();updTrail();
CAM.follow({x:G.ball.x,y:G.ball.y,z:G.ball.z},{x:G.ball.vx,z:G.ball.vz});CAM.update(dt);
if(G.ball.stopped&&!G.settled){setTimeout(()=>onBallStop(),400)}}

// Camera in aim
if(G.state==='aim'){CAM.update(dt)}

// Result cam orbit
if(G.state==='result'&&holeP){CAM.result(holeP);CAM.update(dt)}

// Particles
updP(dt);

// Water animation
waters.forEach(w=>{if(w.mesh)w.mesh.position.y=w.mesh.userData.baseY+Math.sin(elapsed*1.5+w.x*.1)*.05});

// Flag wave
if(flagM)flagM.rotation.y=Math.sin(elapsed*3)*.3;

// Golfer idle breathing
if(golfer&&golfer.visible&&G.state==='aim'&&!SA.active){
const b=Math.sin(elapsed*2)*.008;
golfer.userData.torso.position.y=golfer.userData.torsoBaseY+b}

// Minimap
if(elapsed-lastMiniT>.3&&(G.state==='aim'||G.state==='swing')){drawMinimap();lastMiniT=elapsed}

renderer.render(scene,camera)}

/* ===== INITIALIZATION ===== */
function init(){
initScene();initMaterials();
createGolfer();mkBall();mkAim();initTrail();
bindInput();
showScr('menu');G.state='menu';
$('loading').style.display='none';
gameLoop();
console.log('Park Golf Pro v9 initialized')}

/* ===== SERVICE WORKER ===== */
if('serviceWorker' in navigator){
navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW:',e))}

/* ===== START ===== */
window.addEventListener('DOMContentLoaded',()=>setTimeout(init,100));

</script>
</body>
</html>
