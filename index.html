project(x,y,z){
const dx=x-this.cam.x,dy=y-this.cam.y,dz=z-this.cam.z;
const fx=this.cam.tx-this.cam.x,fy=this.cam.ty-this.cam.y,fz=this.cam.tz-this.cam.z;
const fl=Math.sqrt(fx*fx+fy*fy+fz*fz)||1;
const nx=fx/fl,ny=fy/fl,nz=fz/fl;
const dot=dx*nx+dy*ny+dz*nz;
if(dot<1)return null;
const px=dx-dot*nx,py=dy-dot*ny,pz=dz-dot*nz;
const rx=-pz*ny+py*nz,ry=pz*nx-px*nz;
const up_x=0,up_y=1,up_z=0;
const rx2=ny*up_z-nz*up_y,ry2=nz*up_x-nx*up_z,rz2=nx*up_y-ny*up_x;
const rl=Math.sqrt(rx2*rx2+ry2*ry2+rz2*rz2)||1;
const ux=rx2/rl,uy=ry2/rl,uz=rz2/rl;
const vx=uy*nz-uz*ny,vy=uz*nx-ux*nz,vz=ux*ny-uy*nx;
const sx=dx*ux+dy*uy+dz*uz;
const sy=dx*vx+dy*vy+dz*vz;

return{x:this.W/2+sx*sc,y:this.H/2-sy*sc,s:sc,d:dot}},

let r=seed;
const nr=()=>{r=(r*16807+0)%2147483647;return(r&0x7fffffff)/2147483647};

for(let i=0;i<35;i++){
const side=nr()>.5?1:-1;
const along=nr()*dist;
const off=8+nr()*25;

const tp=nr()>.7?1:0;
this.trees.push({x:along,z:side*off,h:h,tp:tp,c:nr()>.5?"#2d5a1e":"#1a4a1a"})
}

},

cv.addEventListener("touchmove",ev=>{
ev.preventDefault();
if(!this.dragStart)return;
const t=ev.touches[0];const dx=t.clientX-this.dragStart.x;
if(Math.abs(dx)>5)this.dragging=true;
if(this.state==="aim"&&this.dragging){
this.aimAng-=dx*0.004;
this.dragStart={x:t.clientX,y:t.clientY};
this._updatePred()}},{passive:false});
cv.addEventListener("touchend",ev=>{
ev.preventDefault();this.dragStart=null;this.dragging=false},{passive:false});
window.addEventListener("resize",()=>R.resize());
},
_showMenu(){
this._hideAll();this.els.mn.classList.add("on");this.state="menu";
this.els.pin.textContent=D.g("nm")||"Player";
},
_hideAll(){
const screens=["mn","cs","rc","st","sc","rr","fo"];
screens.forEach(s=>{if(this.els[s])this.els[s].classList.remove("on")});
this.els.hud.style.display="none";this.els.sw.style.display="none";
this.els.ah.style.display="none";this.els.pi.style.display="none";
this.els.msg.style.display="none";
},
_showCourseSelect(){
this._hideAll();this.els.cs.classList.add("on");
const cl=this.els.cl;cl.innerHTML="";
COURSES.forEach((c,i)=>{
const d=document.createElement("div");d.className="CI";
const best=D.g("bst");const bk="c"+i;
const bs=best&&best[bk]?best[bk]:null;
d.innerHTML="<b>"+(i+1)+". "+c.name+"</b><small>"+c.region+" | Par "+c.par+(bs?" | Best: "+bs:"")+"</small>";
d.onclick=()=>this._startRound(i);
cl.appendChild(d)});
},
_showRecords(){
this._hideAll();this.els.rc.classList.add("on");
const rds=D.g("rds")||[];
this.els.rct.innerHTML="";
if(rds.length===0){this.els.rct.innerHTML="<p style='text-align:center;color:#888;padding:20px'>No records yet</p>";return}
rds.slice(0,20).forEach(r=>{
const c=COURSES[r.c];
const d=document.createElement("div");d.className="RI";
const diff=r.t-(c?c.par:27);const cls=diff<0?"un":diff>0?"ov":"";
d.innerHTML="<b>"+(c?c.name:"?")+"</b> <span class='"+cls+"'>"+r.t+(diff>=0?"+":"")+diff+"</span><br><small>"+new Date(r.d).toLocaleDateString()+"</small>";
this.els.rct.appendChild(d)});
},
_showSettings(){
this._hideAll();this.els.st.classList.add("on");
this.els.sna.value=D.g("nm")||"Player";
this.els.svl.value=D.g("vol")||80;
this.els.svb.checked=D.g("vib")!==false;
},
_saveSettings(){
D.s("nm",this.els.sna.value||"Player");
D.s("vol",parseInt(this.els.svl.value));
D.s("vib",this.els.svb.checked);
SFX.v=parseInt(this.els.svl.value)/100;
this._showMenu();
},
_startRound(ci){
this.ci=ci;this.hi=0;this.scores=[];this.strokes=0;
this.mode=this.practice?"practice":"play";
this._hideAll();
this._startHole();
},
_startHole(){
const course=COURSES[this.ci];const hole=course.holes[this.hi];
this.ball={x:0,y:0,z:0,vx:0,vy:0,vz:0,moving:false,holed:false,ob:false};
this.strokes=0;this.clubIdx=0;this.aimAng=0;this.swingPhase=0;
this.power=0;this.accuracy=50;
this.wind.dir=Math.random()*Math.PI*2;
this.wind.spd=Math.random()*3;
this.wind.x=Math.cos(this.wind.dir)*this.wind.spd;
this.wind.z=Math.sin(this.wind.dir)*this.wind.spd;
R.genTrees(hole,this.ci*100+this.hi*10+7);
this.flyT=0;this.state="flyover";
this._hideAll();
this.els.fo.style.display="flex";
this.els.ft.textContent="Hole "+(this.hi+1);
this.els.fi.textContent=course.name+" | Par "+hole.par+" | "+hole.dist+"m";
this.els.fbr.style.width="0%";
},
_startAim(){
this.state="aim";this.swingPhase=0;
this.els.fo.style.display="none";
this.els.hud.style.display="block";
this.els.sw.style.display="flex";
this.els.ah.style.display="block";
this.els.pi.style.display="none";
this.els.ab.style.display="none";
this.els.pm.style.display="none";
this.els.pf.style.width="0%";
this.els.sb.textContent="SWING";
this._autoClub();
this._updateHUD();
this._updatePred();
const d2h=Math.sqrt((this.ball.x-COURSES[this.ci].holes[this.hi].dist)**2+this.ball.z**2);
if(d2h<12){
this.els.pi.style.display="block";
this.els.pi.innerHTML="Putt | Slope: "+COURSES[this.ci].holes[this.hi].gd+"\u00b0"}
},
_autoClub(){
const hole=COURSES[this.ci].holes[this.hi];
const d=Math.sqrt((this.ball.x-hole.dist)**2+this.ball.z**2);
if(d<12){this.clubIdx=3;return}
if(d<35){this.clubIdx=2;return}
if(d<60){this.clubIdx=1;return}
this.clubIdx=0;
},
_cycleClub(){
this.clubIdx=(this.clubIdx+1)%CLUBS.length;
SFX.ck();this._updateHUD();this._updatePred();
},
_isPutt(){return this.clubIdx===3},
_updateHUD(){
const course=COURSES[this.ci];const hole=course.holes[this.hi];
const d2h=Math.sqrt((this.ball.x-hole.dist)**2+this.ball.z**2);
this.els.hcn.textContent=course.name;
this.els.hh.textContent="H"+(this.hi+1);
this.els.hpr.textContent="Par "+hole.par;
this.els.hst.textContent=this.strokes+" strokes";
this.els.hw.textContent=this.wind.spd<0.3?"Calm":this.wind.spd.toFixed(1)+"m/s";
this.els.hdi.textContent=d2h.toFixed(1)+"m";
this.els.hcb.textContent=CLUBS[this.clubIdx].n;
},
_updatePred(){
const hole=COURSES[this.ci].holes[this.hi];
const club=CLUBS[this.clubIdx];
const pw=this._isPutt()?40:70;
this.predPts=PHY.predict(this.ball.x,this.ball.z,this.aimAng,pw,club,hole,this._isPutt());
},
_onSwingTap(){
if(this.state!=="aim")return;
SFX.res();
if(this.swingPhase===0){
this.swingPhase=1;this.power=0;this.pwDir=1;
this.els.sb.textContent="TAP!";
this.els.ah.style.display="none";
}else if(this.swingPhase===1){
this.swingPhase=2;
this.els.ab.style.display="block";
this.els.pm.style.display="block";
this.els.pm.style.left=this.power+"%";
this.accuracy=0;this.acDir=1;
this.els.sb.textContent="HIT!";
}else if(this.swingPhase===2){
this._doSwing();
}
},
_doSwing(){
this.strokes++;
const hole=COURSES[this.ci].holes[this.hi];
const club=CLUBS[this.clubIdx];
const isPutt=this._isPutt();
const v=PHY.calcLaunch(this.power,this.accuracy,this.aimAng,club,isPutt);
this.ball.vx=v.vx;this.ball.vy=v.vy;this.ball.vz=v.vz;
this.ball.moving=true;this.ball.holed=false;this.ball.ob=false;
this.state="flying";
this.els.sw.style.display="none";this.els.ah.style.display="none";this.els.pi.style.display="none";
if(isPutt)SFX.pt();else{SFX.sw();setTimeout(()=>SFX.hit(),200)}
this._updateHUD();
this.predPts=null;
},
_showMsg(txt,dur){
this.els.msg.textContent=txt;this.els.msg.style.display="block";
this.els.msg.style.animation="none";
void this.els.msg.offsetHeight;
this.els.msg.style.animation="pop .4s ease-out forwards";
setTimeout(()=>{this.els.msg.style.display="none"},dur||2000);
},
_onBallStop(){
const hole=COURSES[this.ci].holes[this.hi];
if(this.ball.holed){
const diff=this.strokes-hole.par;
const name=SN[diff.toString()]||(diff>0?"+"+diff:diff.toString());
if(diff<=-2){SFX.ea();R.addPts(this.ball.x,.5,this.ball.z,"#ffd700",30)}
else if(diff<0){SFX.bi();R.addPts(this.ball.x,.5,this.ball.z,"#4caf50",20)}
else SFX.hi();
R.addPts(hole.dist,.5,0,"#fff",15);
this._showMsg(name+(diff<=0?" \u26f3":""),2500);
this.state="result";this.resultT=0;
return}
if(this.ball.ob){
SFX.ob();this._showMsg("OB!",1500);
this.strokes++;
this.ball.x=this.ball.x<0?2:Math.min(this.ball.x,hole.dist-5);
this.ball.z=this.ball.z>0?-3:3;
this.ball.y=0;this.ball.vx=0;this.ball.vy=0;this.ball.vz=0;
this.ball.ob=false;
setTimeout(()=>this._startAim(),1800);
return}
if(this.strokes>=hole.par+4){
this._showMsg("Max strokes!",1500);
this.ball.holed=true;
this.state="result";this.resultT=0;
return}
const d2h=Math.sqrt((this.ball.x-hole.dist)**2+this.ball.z**2);
if(d2h<0.5&&!this.ball.holed){
this.ball.holed=true;this.ball.x=hole.dist;this.ball.z=0;
const diff=this.strokes-hole.par;
const name=SN[diff.toString()]||(diff>0?"+"+diff:diff.toString());
SFX.hi();R.addPts(hole.dist,.5,0,"#fff",15);
this._showMsg(name,2500);
this.state="result";this.resultT=0;
return}
SFX.ln();
setTimeout(()=>this._startAim(),800);
},
_showScore(){
this.state="scorecard";
this._hideAll();
const course=COURSES[this.ci];
this.scores.push(this.strokes);
this.els.sc.classList.add("on");
this.els.scn.textContent=course.name+" - Hole "+(this.hi+1)+" of "+course.holes.length;
let html="<tr><th>Hole</th>";
for(let i=0;i<=this.hi;i++)html+="<th>"+(i+1)+"</th>";
html+="<th>Total</th></tr><tr><td>Par</td>";
let tp=0;for(let i=0;i<=this.hi;i++){tp+=course.holes[i].par;html+="<td>"+course.holes[i].par+"</td>"}
html+="<td>"+tp+"</td></tr><tr><td>Score</td>";
let ts=0;for(let i=0;i<this.scores.length;i++){
ts+=this.scores[i];const d=this.scores[i]-course.holes[i].par;
const c=d<0?"un":d>0?"ov":"";
html+="<td class='"+c+"'>"+this.scores[i]+"</td>"}
html+="<td>"+(ts-tp>=0?"+":"")+(ts-tp)+"</td></tr>";
this.els.sct.innerHTML=html;
this.els.stt.textContent="Total: "+ts+" (Par "+tp+")";
if(this.hi>=course.holes.length-1)this.els.snx.textContent="Finish";
else this.els.snx.textContent="Next Hole \u25b6";
},
_nextHole(){
const course=COURSES[this.ci];
if(this.hi>=course.holes.length-1){this._finishRound();return}
this.hi++;this.els.sc.classList.remove("on");
this._startHole();
},
_finishRound(){
this.els.sc.classList.remove("on");
const course=COURSES[this.ci];
const total=this.scores.reduce((a,b)=>a+b,0);
const diff=total-course.par;
if(!this.practice)D.addR(this.ci,this.scores.slice(),total);
this.state="roundResult";
this._hideAll();this.els.rr.classList.add("on");
this.els.rrn.textContent=course.name;
let html="<tr><th>H</th><th>Par</th><th>Score</th><th>+/-</th></tr>";
for(let i=0;i<this.scores.length;i++){
const d=this.scores[i]-course.holes[i].par;
const c=d<0?"un":d>0?"ov":"";
html+="<tr><td>"+(i+1)+"</td><td>"+course.holes[i].par+"</td><td>"+this.scores[i]+"</td><td class='"+c+"'>"+(d>=0?"+":"")+d+"</td></tr>"}
this.els.rrt.innerHTML=html;
this.els.rtt.textContent="Total: "+total+" / Par "+course.par+" ("+(diff>=0?"+":"")+diff+")";
const rk=diff<=-9?"Amazing!":diff<=-5?"Great!":diff<=0?"Good game!":"Keep practicing!";
this.els.rrk.textContent=rk;
},
_raf(){
const loop=()=>{
requestAnimationFrame(loop);
this._tick();
};loop();
},
_tick(){
const course=COURSES[this.ci];
const hole=course?course.holes[this.hi]:null;
if(this.state==="flyover"&&hole){
this.flyT+=0.016;
const t=Math.min(this.flyT/this.flyDur,1);
this.els.fbr.style.width=(t*100)+"%";
CAM.setFlyover(0,0,hole.dist,0,t);
CAM.ease=0.15;CAM.update();
R.draw({hole,ball:this.ball,windDir:this.wind.dir,windSpd:this.wind.spd,showDist:false});
if(t>=1){CAM.ease=0.06;this._startAim()}
}
else if(this.state==="aim"&&hole){
CAM.setBehind(this.ball.x,this.ball.y,this.ball.z,this.aimAng);
CAM.update();
if(this.swingPhase===1){
this.power+=this.pwDir*this.pwSpeed;
if(this.power>=100){this.power=100;this.pwDir=-1}
if(this.power<=0){this.power=0;this.pwDir=1}
this.els.pf.style.width=this.power+"%";
}
if(this.swingPhase===2){
this.accuracy+=this.acDir*this.acSpeed;
if(this.accuracy>=100){this.accuracy=100;this.acDir=-1}
if(this.accuracy<=0){this.accuracy=0;this.acDir=1}
this.els.an.style.left=this.accuracy+"%";
}
R.draw({hole,ball:this.ball,windDir:this.wind.dir,windSpd:this.wind.spd,
pred:this.predPts,isPutt:this._isPutt(),showDist:true,aimAng:this.aimAng});
}
else if(this.state==="flying"&&hole){
const still=!PHY.simulate(this.ball,this.wind,hole,0.016);
if(this.ball.moving){
if(Math.abs(this.ball.vx)>0.01||Math.abs(this.ball.vz)>0.01)
CAM.setFollow(this.ball.x,this.ball.y,this.ball.z,this.ball.vx,this.ball.vz);
}
CAM.ease=0.08;CAM.update();
R.draw({hole,ball:this.ball,windDir:this.wind.dir,windSpd:this.wind.spd,showDist:true});
this._updateHUD();
if(still)this._onBallStop();
}
else if(this.state==="result"&&hole){
this.resultT+=0.016;
CAM.setResult(hole.dist,0);CAM.update();
R.draw({hole,ball:this.ball,windDir:this.wind.dir,windSpd:this.wind.spd,showDist:false});
if(this.resultT>2.5)this._showScore();
}
else if(this.state==="menu"||this.state==="scorecard"||this.state==="roundResult"){
if(hole){
CAM.setFlyover(0,0,60,0,(Date.now()%10000)/10000);
CAM.ease=0.02;CAM.update();
R.draw({hole,ball:{x:30,y:0,z:0},windDir:0,windSpd:0,showDist:false})}
}
}
};

// === PART 6: INIT ===
document.addEventListener("DOMContentLoaded",()=>{G.init()});
if("serviceWorker"in navigator){navigator.serviceWorker.register("sw.js").catch(e=>console.log("SW err",e))}
</script></body></html>
