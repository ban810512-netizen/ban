<head>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;touch-action:none;user-select:none}
canvas{display:block;width:100%!important;height:100%!important;position:fixed;top:0;left:0}

/* === 골프킹 스타일 HUD === */
#hud{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;display:none}
#topBar{position:absolute;top:0;left:0;width:100%;padding:8px;display:flex;justify-content:space-between;align-items:flex-start}
#leftInfo{display:flex;flex-direction:column;gap:4px}
.info-pill{background:rgba(0,0,0,.7);backdrop-filter:blur(8px);border-radius:12px;padding:6px 14px;display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.08)}
.info-pill .label{font-size:10px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.5px}
.info-pill .value{font-size:14px;font-weight:800;color:#fff}
.info-pill .value.gold{color:#ffd700}
.info-pill .value.green{color:#2ecc71}
#rightInfo{display:flex;gap:4px}
.stat-box{background:rgba(0,0,0,.7);backdrop-filter:blur(8px);border-radius:12px;padding:8px 12px;text-align:center;min-width:52px;border:1px solid rgba(255,255,255,.08)}
.stat-box .sl{font-size:8px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.5px}
.stat-box .sv{font-size:16px;font-weight:900;color:#fff}

/* 미니맵 */
#miniWrap{position:absolute;top:90px;right:8px;width:120px;height:120px;border-radius:14px;overflow:hidden;border:1.5px solid rgba(255,255,255,.12);background:rgba(0,30,0,.6);backdrop-filter:blur(4px);display:none}
#miniCvs{width:100%;height:100%}

/* 거리 표시 */
#distShow{position:absolute;bottom:155px;left:50%;transform:translateX(-50%);pointer-events:none;display:none}
#distShow .dv{font-size:32px;font-weight:900;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.8),0 0 30px rgba(0,0,0,.3)}
#distShow .du{font-size:13px;color:rgba(255,255,255,.5);margin-left:2px}

/* 클럽 버튼 */
#clubBtn{position:absolute;bottom:155px;right:12px;pointer-events:auto;z-index:15;width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.75);border:2px solid rgba(46,204,113,.4);color:#fff;font-size:10px;font-weight:700;cursor:pointer;display:none;backdrop-filter:blur(6px);text-align:center;line-height:1.2}

/* 큰 메시지 */
#bigMsg{position:absolute;top:35%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:20;pointer-events:none;display:none;font-size:42px;font-weight:900;color:#ffd700;text-shadow:0 0 30px rgba(255,215,0,.5),0 3px 6px rgba(0,0,0,.8)}

/* === 스윙 패널 === */
#swingPanel{position:absolute;bottom:0;left:0;width:100%;z-index:18;display:none;pointer-events:auto}
#swingInner{padding:12px 16px 20px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.8) 35%,rgba(0,0,0,.95))}
.gauge-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.gauge-row .gl{font-size:11px;color:rgba(255,255,255,.5);font-weight:600}
.gauge-row .gv{font-size:14px;font-weight:800;color:#ffd700}
.bar-wrap{position:relative;height:28px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);margin-bottom:12px}
.bar-wrap .sweet{position:absolute;top:0;left:42%;width:16%;height:100%;border-left:2px solid rgba(255,255,255,.4);border-right:2px solid rgba(255,255,255,.4);background:rgba(46,204,113,.1);z-index:1}
#pwrFill{height:100%;width:0%;border-radius:14px;background:linear-gradient(90deg,#2ecc71 0%,#2ecc71 40%,#f1c40f 65%,#e74c3c 90%);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
#accWrap{display:none}
#accFill{height:100%;width:0%;border-radius:14px;background:linear-gradient(90deg,#e74c3c 0%,#f39c12 20%,#2ecc71 42%,#27ae60 50%,#2ecc71 58%,#f39c12 80%,#e74c3c 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
#accLabel{display:none}
#swBtn{width:100%;padding:14px;border:none;border-radius:14px;font-size:17px;font-weight:800;cursor:pointer;color:#fff;background:linear-gradient(135deg,#27ae60,#2ecc71);box-shadow:0 4px 15px rgba(46,204,64,.35);letter-spacing:1px}

/* === 플라이오버 === */
#flyover{position:fixed;top:0;left:0;width:100%;height:100%;z-index:25;display:none;pointer-events:auto}
#flyTop{position:absolute;top:0;left:0;width:100%;padding:16px;background:linear-gradient(180deg,rgba(0,0,0,.8),transparent)}
#flyH{font-size:30px;font-weight:900;color:#ffd700}
#flyInfo{display:flex;gap:16px;margin-top:6px;font-size:13px;color:rgba(255,255,255,.8)}
#flyInfo em{font-style:normal;color:#ffd700;font-weight:700}
#flySk{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.5);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:8px 26px;font-size:13px;cursor:pointer;backdrop-filter:blur(4px)}

/* === 메뉴/스코어/결과 등 풀스크린 === */
.scr-full{position:fixed;top:0;left:0;width:100%;height:100%;z-index:30;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
#menuScr{display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(0,50,0,.96),rgba(0,20,0,.98))}
#menuLogo{font-size:38px;font-weight:900;color:#ffd700;text-shadow:0 0 30px rgba(255,215,0,.3);margin-bottom:4px;letter-spacing:2px}
#menuSub{font-size:14px;color:rgba(255,255,255,.35);margin-bottom:30px}
.mbtn{display:block;width:230px;padding:14px;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;color:#fff;margin:6px 0;text-align:center}
.mbtn:active{transform:scale(.96);filter:brightness(.85)}
.mbtn.primary{background:linear-gradient(135deg,#27ae60,#2ecc71);box-shadow:0 4px 12px rgba(46,204,64,.3)}
.mbtn.secondary{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}

#scoreScr,#resultScr{background:linear-gradient(135deg,rgba(0,35,0,.97),rgba(0,15,0,.99))}
.scr-inner{max-width:420px;margin:0 auto;padding:20px 16px}
.scr-title{font-size:24px;font-weight:900;color:#ffd700;text-align:center;margin-bottom:6px}
.scr-sub{font-size:12px;color:rgba(255,255,255,.45);text-align:center;margin-bottom:16px}
.sc-tbl{width:100%;border-collapse:collapse;margin-bottom:16px}
.sc-tbl th{background:rgba(255,215,0,.1);color:#ffd700;font-size:9px;padding:6px 4px;font-weight:700}
.sc-tbl td{text-align:center;padding:6px 4px;font-size:12px;color:#fff;border-bottom:1px solid rgba(255,255,255,.05)}
.eagle{color:#ffd700!important;font-weight:800}.birdie{color:#ff4444!important;font-weight:700}.par-sc{color:rgba(255,255,255,.5)}.bogey{color:#4af}.dbogey{color:#88f}
.total-box{text-align:center;font-size:18px;font-weight:800;color:#fff;margin:12px 0;padding:10px;background:rgba(255,215,0,.08);border-radius:10px}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;color:#fff;margin-top:10px;text-align:center}
.btn.p{background:linear-gradient(135deg,#27ae60,#2ecc71)}.btn.s{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12)}
.btn:active{transform:scale(.97);filter:brightness(.85)}

#courseScr,#recordScr,#settingScr{background:linear-gradient(135deg,rgba(0,35,0,.97),rgba(0,15,0,.99))}
.page-hdr{display:flex;align-items:center;padding:14px 16px;background:rgba(0,0,0,.2)}
.page-hdr h2{flex:1;text-align:center;font-size:17px;color:#ffd700;font-weight:800}
.back-btn{background:none;border:none;color:rgba(255,255,255,.6);font-size:24px;cursor:pointer;padding:4px 8px}
.course-item{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer}
.course-item:active{background:rgba(255,255,255,.03)}
.ci-icon{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#2a8a2a,#4aba4a);display:flex;align-items:center;justify-content:center;font-size:20px;margin-right:14px;flex-shrink:0}
.ci-name{font-size:15px;font-weight:700;color:#fff}
.ci-desc{font-size:11px;color:rgba(255,255,255,.4);margin-top:2px}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.04)}
.setting-row label{font-size:14px;color:#fff;font-weight:600}
.setting-row input[type="range"]{width:120px;accent-color:#2ecc71}

/* 로딩 */
#loading{position:fixed;top:0;left:0;width:100%;height:100%;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a1a0a}
.ld-icon{font-size:42px}
.ld-txt{color:#ffd700;font-size:16px;font-weight:700;margin-top:16px}
.ld-bar{width:200px;height:3px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:10px;overflow:hidden}
.ld-fill{height:100%;width:0%;background:linear-gradient(90deg,#27ae60,#ffd700);border-radius:2px;transition:width .3s}
</style>
</head>

<div id="hud">

<button class="mbtn primary" onclick="openCourseSelect()">🏆 전국투어</button>

</div>

<script type="module">
import*as THREE from'three';

/* ========== 유틸리티 ========== */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rad=d=>d*Math.PI/180;
const $=id=>document.getElementById(id);
function mulberry32(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/4294967296}}

/* ========== 파크골프 코스 데이터 ========== */
const COURSES=[
{name:'서울숲',city:'서울',par:[3,4,3,3,5,3,4,3,5],dist:[25,40,20,30,55,22,35,28,50],trees:'mixed',water:[5,9]},
{name:'일산호수',city:'고양',par:[3,3,4,3,5,4,3,3,5],dist:[22,28,42,25,60,38,20,30,48],trees:'deciduous',water:[4,6]},
{name:'제주오름',city:'제주',par:[4,3,3,5,3,4,3,5,3],dist:[35,22,28,52,20,40,24,48,26],trees:'palm',water:[2,8]},
{name:'경주보문',city:'경주',par:[3,4,3,5,3,3,4,5,3],dist:[24,38,26,50,22,30,42,55,20],trees:'pine',water:[3,7]},
{name:'강릉솔밭',city:'강릉',par:[3,3,5,3,4,3,3,5,4],dist:[20,25,48,28,35,22,30,52,40],trees:'pine',water:[5]},
{name:'담양죽녹원',city:'담양',par:[4,3,3,3,5,4,3,3,5],dist:[36,22,24,28,55,38,20,26,50],trees:'mixed',water:[6,9]},
{name:'부산해운대',city:'부산',par:[3,5,3,4,3,3,5,3,4],dist:[22,52,26,40,20,28,48,24,38],trees:'palm',water:[2,4]},
{name:'대전유성',city:'대전',par:[3,3,4,3,5,3,4,3,5],dist:[24,20,35,28,50,22,40,26,55],trees:'deciduous',water:[5,8]},

];

const CLUB={name:'파크골프 클럽',power:4.5,loft:32};
const PUTTER={name:'퍼터 모드',power:2.0,loft:12};

/* ========== 저장소 ========== */
const STO={d:{vol:80,vib:true,best:{}},
load(){try{const s=localStorage.getItem('pgpro2');if(s)this.d=JSON.parse(s)}catch(e){}},
save(){try{localStorage.setItem('pgpro2',JSON.stringify(this.d))}catch(e){}}};
STO.load();

/* ========== 사운드 ========== */
const AUD={ctx:null,
init(){if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)()},
resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()},
play(type){if(!this.ctx)return;const vol=STO.d.vol/100;
const mk=(freq,dur,wt,v)=>{const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=wt;o.frequency.value=freq;g.gain.setValueAtTime(v*vol,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+dur);o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+dur)};
switch(type){
case'hit':mk(220,.15,'triangle',.3);mk(440,.08,'square',.15);break;
case'putt':mk(300,.1,'sine',.2);break;
case'hole':mk(523,.12,'sine',.25);mk(659,.12,'sine',.25);mk(784,.2,'sine',.3);break;
case'bounce':mk(180,.06,'triangle',.12);break;
case'splash':mk(100,.2,'sine',.2);break;
case'ob':mk(150,.3,'sawtooth',.15);break;
case'swing':mk(200,.25,'triangle',.1);break;
case'click':mk(1000,.03,'sine',.15);break}}};
function vib(ms=20){try{if(STO.d.vib&&navigator.vibrate)navigator.vibrate(ms)}catch(e){}}

/* ========== THREE.JS 씬 ========== */
let scene,camera,renderer,sunLight;
let grp,grnC,grnR,teeP,holeP,flagM,bunks=[],waters=[],obB,fwPath=[];
let M={},golfer=null;

function initScene(){
scene=new THREE.Scene();
camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,800);
renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance',alpha:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

renderer.shadowMap.type=THREE.PCFSoftShadowMap;

sunLight.position.set(50,80,30);

sc.left=-80;sc.right=80;sc.top=80;sc.bottom=-80;sc.near=1;sc.far=200;
sunLight.shadow.bias=-.0006;sunLight.shadow.normalBias=.02;
scene.add(sunLight);

// 보조광 — 그림자 부분을 밝게
const fill1=new THREE.DirectionalLight(0xffeedd,.7);fill1.position.set(-30,20,-15);scene.add(fill1);
const fill2=new THREE.DirectionalLight(0xaaddff,.4);fill2.position.set(-10,40,-40);scene.add(fill2);
scene.add(new THREE.AmbientLight(0x88aacc,.55));
scene.add(new THREE.HemisphereLight(0x99ccff,0x447733,.65));

// 하늘
scene.background=mkSky();
// 부드러운 안개 — 먼 배경만 살짝
scene.fog=new THREE.Fog(0xc8e0f4,50,200);

/* ========== 하늘 텍스처 — 골프킹 스타일 밝고 맑은 하늘 ========== */
function mkSky(){
const w=2048,h=1024,c=document.createElement('canvas');c.width=w;c.height=h;
const x=c.getContext('2d');
// 깊고 선명한 하늘 그라데이션
const grad=x.createLinearGradient(0,0,0,h);
grad.addColorStop(0,'#0a2a5a');
grad.addColorStop(.08,'#1a4a8a');
grad.addColorStop(.18,'#2a6abb');
grad.addColorStop(.3,'#4a90d8');
grad.addColorStop(.42,'#6ab0ec');
grad.addColorStop(.52,'#90ccf5');
grad.addColorStop(.6,'#b4ddf8');
grad.addColorStop(.67,'#d0ebfc');
grad.addColorStop(.72,'#e0f0e8');
grad.addColorStop(.78,'#c4ddb0');
grad.addColorStop(.85,'#88bb70');
grad.addColorStop(.92,'#5a9a48');
grad.addColorStop(1,'#3a7a30');
x.fillStyle=grad;x.fillRect(0,0,w,h);

// 사실적인 구름 — 여러 층
for(let layer=0;layer<3;layer++){
const numC=12+layer*6,baseY=60+layer*90,spread=h*.3;
for(let i=0;i<numC;i++){
const cx=Math.random()*w,cy=baseY+Math.random()*spread;
const cw=180+Math.random()*400,ch=40+Math.random()*80;
// 구름 몸체
for(let p=0;p<8;p++){
const px=cx+(Math.random()-.5)*cw*.7,py=cy+(Math.random()-.5)*ch*.5;
const pr=30+Math.random()*80;
const alpha=layer===0?.25:.12+Math.random()*.1;
const cg=x.createRadialGradient(px,py,0,px,py,pr);
cg.addColorStop(0,`rgba(255,255,255,${alpha})`);
cg.addColorStop(.4,`rgba(250,252,255,${alpha*.6})`);
cg.addColorStop(1,'rgba(255,255,255,0)');
x.fillStyle=cg;x.beginPath();x.ellipse(px,py,pr*1.3,pr*.6,0,0,Math.PI*2);x.fill()}}}

// 태양 — 밝고 따뜻한 글로우
const sx=w*.72,sy=h*.15;
for(let r=250;r>5;r-=8){
const alpha=r<20?.8:r<50?.15:r<100?.06:.02;
const sg=x.createRadialGradient(sx,sy,0,sx,sy,r);
sg.addColorStop(0,`rgba(255,255,240,${alpha})`);
sg.addColorStop(.3,`rgba(255,248,220,${alpha*.6})`);
sg.addColorStop(1,'rgba(255,250,200,0)');
x.fillStyle=sg;x.beginPath();x.arc(sx,sy,r,0,Math.PI*2);x.fill()}
// 태양 코어
const core=x.createRadialGradient(sx,sy,0,sx,sy,15);
core.addColorStop(0,'rgba(255,255,255,1)');
core.addColorStop(.5,'rgba(255,255,230,.9)');
core.addColorStop(1,'rgba(255,250,200,0)');
x.fillStyle=core;x.beginPath();x.arc(sx,sy,15,0,Math.PI*2);x.fill();

const t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;return t}

/* ========== 텍스처 생성 — 고품질 ========== */
function mkGrassTex(baseH=120,baseS=55,baseL=28,detail=18000){
const w=1024,h=1024,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
// 베이스 — 자연스러운 색 변화
for(let y=0;y<h;y++){
const hue=baseH+Math.sin(y*.008)*5+Math.sin(y*.025)*3;
const sat=baseS+Math.sin(y*.015)*6+Math.cos(y*.03)*4;
const lit=baseL+Math.sin(y*.005)*2+Math.random()*1.5;
x.fillStyle=`hsl(${hue},${sat}%,${lit}%)`;x.fillRect(0,y,w,1)}
// 밝은/어두운 패치 — 더 많이, 더 부드럽게
for(let i=0;i<50;i++){const px=Math.random()*w,py=Math.random()*h,pr=50+Math.random()*150;
const bright=Math.random()>.4;
const rg=x.createRadialGradient(px,py,0,px,py,pr);
rg.addColorStop(0,bright?`rgba(140,220,90,${.05+Math.random()*.06})`:`rgba(20,60,10,${.03+Math.random()*.04})`);
rg.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=rg;x.fillRect(px-pr,py-pr,pr*2,pr*2)}
// 잔디 블레이드 — 더 많이, 더 세밀
for(let i=0;i<detail;i++){
const bx=Math.random()*w,by=Math.random()*h,bl=5+Math.random()*16;
const hue=baseH-12+Math.random()*24;
const sat=40+Math.random()*35;
const lit=16+Math.random()*24;
x.strokeStyle=`hsla(${hue},${sat}%,${lit}%,${.15+Math.random()*.3})`;
x.lineWidth=.3+Math.random()*.7;x.beginPath();x.moveTo(bx,by);
x.quadraticCurveTo(bx+(Math.random()-.5)*5,by-bl*.5,bx+(Math.random()-.5)*4,by-bl);x.stroke()}
const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}

function mkSandTex(){
const w=512,h=512,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
// 사실적 모래 — 따뜻한 베이지
const bg=x.createRadialGradient(w/2,h/2,0,w/2,h/2,w*.7);
bg.addColorStop(0,'#dcc488');bg.addColorStop(1,'#c8a868');
x.fillStyle=bg;x.fillRect(0,0,w,h);
for(let i=0;i<12000;i++){
const r=175+Math.random()*65,g2=145+Math.random()*55,b=85+Math.random()*55;
x.fillStyle=`rgba(${r},${g2},${b},${.08+Math.random()*.15})`;
const s=.4+Math.random()*2.2;x.fillRect(Math.random()*w,Math.random()*h,s,s)}
const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}

function mkWaterTex(){
const w=512,h=512,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
const g=x.createLinearGradient(0,0,w,h);
g.addColorStop(0,'#1a6699');g.addColorStop(.3,'#2288bb');g.addColorStop(.6,'#2a99cc');g.addColorStop(1,'#1a77aa');
x.fillStyle=g;x.fillRect(0,0,w,h);
// 반짝이는 수면
for(let i=0;i<100;i++){
const lx=Math.random()*w,ly=Math.random()*h;
x.strokeStyle=`rgba(200,230,255,${.04+Math.random()*.08})`;
x.lineWidth=.5+Math.random()*.5;x.beginPath();
x.moveTo(lx,ly);x.quadraticCurveTo(lx+15+Math.random()*20,ly+(Math.random()-.5)*6,lx+30+Math.random()*40,ly+(Math.random()-.5)*10);x.stroke()}
const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}

/* ========== 지형 높이 함수 — 더 풍부한 언덕 ========== */
function gndH(x,z){
return Math.sin(x*.03)*Math.cos(z*.03)*1.4
+Math.sin(x*.07+z*.05)*.6
+Math.cos(x*.04-z*.06)*.45
+Math.sin(x*.015+z*.012)*.9
+Math.cos(x*.1+z*.08)*.2}

/* ========== 골퍼 캐릭터 — 골프킹 스타일 ========== */
function createGolfer(){
const g=new THREE.Group(),S=14;
// 골퍼를 1.8배 키워서 화면에서 확실히 보이게
function mk(geo,mat,x,y,z,shadow=true){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);if(shadow)m.castShadow=true;return m}

// 몸통
const torso=new THREE.Group();torso.name='torso';
torso.add(mk(new THREE.CylinderGeometry(.14,.12,.42,S),M.shirt,0,0,0));
// 칼라
const collar=mk(new THREE.TorusGeometry(.125,.015,8,S),M.shirt,0,.2,0,false);
collar.rotation.x=Math.PI/2;torso.add(collar);
// 어깨 패드
for(const sx of[-1,1]){const sh=mk(new THREE.SphereGeometry(.06,8,6),M.shirt,sx*.16,.18,0,false);sh.scale.set(1,.65,1);torso.add(sh)}
torso.position.y=.85;g.add(torso);

// 골반+벨트
const hips=new THREE.Group();hips.name='hips';
hips.add(mk(new THREE.CylinderGeometry(.12,.135,.16,S),M.pants,0,0,0));
hips.position.y=.62;g.add(hips);
// 벨트
const belt=mk(new THREE.TorusGeometry(.128,.014,8,20),new THREE.MeshStandardMaterial({color:0x3a2a1a,roughness:.4,metalness:.25}),0,.69,0,false);
belt.rotation.x=Math.PI/2;g.add(belt);

// 머리
const head=new THREE.Group();head.name='head';
head.add(mk(new THREE.SphereGeometry(.1,S,10),M.skin,0,0,0));
// 귀
for(const sx of[-1,1])head.add(mk(new THREE.SphereGeometry(.022,8,6),M.skin,sx*.092,-.01,0,false));
// 눈 (흰자+동자+하이라이트)
for(const sx of[-1,1]){
head.add(mk(new THREE.SphereGeometry(.016,8,6),new THREE.MeshBasicMaterial({color:0xf8f8f8}),sx*.034,.01,.085,false));
head.add(mk(new THREE.SphereGeometry(.009,6,4),new THREE.MeshBasicMaterial({color:0x1a0a0a}),sx*.034,.01,.093,false));
head.add(mk(new THREE.SphereGeometry(.003,4,3),new THREE.MeshBasicMaterial({color:0xffffff}),sx*.034+.003,.015,.096,false))}
// 눈썹
for(const sx of[-1,1])head.add(mk(new THREE.BoxGeometry(.025,.006,.006),M.hair,sx*.034,.032,.087,false));
// 코
const nose=mk(new THREE.CylinderGeometry(.008,.013,.024,6),M.skin,0,-.004,.093,false);nose.rotation.x=-.3;head.add(nose);
// 입 — 미소
const mouth=mk(new THREE.TorusGeometry(.018,.003,4,10,Math.PI),new THREE.MeshBasicMaterial({color:0xc08060}),0,-.032,.087,false);mouth.rotation.x=.1;head.add(mouth);
// 머리카락
head.add(mk(new THREE.SphereGeometry(.102,S,10,0,Math.PI*2,0,Math.PI*.48),M.hair,0,.002,0,false));
// 모자
const capBody=mk(new THREE.CylinderGeometry(.105,.105,.04,S),M.hat,0,.07,0);head.add(capBody);
head.add(mk(new THREE.BoxGeometry(.1,.008,.075),M.hat,0,.06,.092,false));
head.position.y=.34;torso.add(head);

// 팔
function mkArm(name,side){
const arm=new THREE.Group();arm.name=name;
arm.add(mk(new THREE.CylinderGeometry(.038,.034,.22,S),M.shirt,0,-.11,0));
const fore=new THREE.Group();fore.name=name.replace('Arm','Fore');
fore.add(mk(new THREE.CylinderGeometry(.034,.026,.2,S),M.skin,0,-.1,0));
fore.add(mk(new THREE.SphereGeometry(.028,8,6),side<0?M.glove:M.skin,0,-.195,0,false));
fore.position.y=-.22;arm.add(fore);
arm.position.set(side*.18,.06,0);torso.add(arm);return{arm,fore}}
const la=mkArm('lArm',1),ra=mkArm('rArm',-1);

// 다리
function mkLeg(name,side){
const leg=new THREE.Group();leg.name=name;
leg.add(mk(new THREE.CylinderGeometry(.056,.046,.28,S),M.pants,0,-.14,0));
const shin=new THREE.Group();shin.name=name.replace('Leg','Shin');
shin.add(mk(new THREE.CylinderGeometry(.046,.038,.28,S),M.pants,0,-.14,0));
const shoeG=new THREE.BoxGeometry(.058,.038,.12);shoeG.translate(0,0,.012);
shin.add(mk(shoeG,M.shoes,0,-.29,.015));
shin.position.y=-.28;leg.add(shin);
leg.position.set(side*.075,0,0);hips.add(leg);return{leg,shin}}
const ll=mkLeg('lLeg',1),rl=mkLeg('rLeg',-1);

// 파크골프 클럽
const club=new THREE.Group();club.name='club';
club.add(mk(new THREE.CylinderGeometry(.006,.006,.55,8),M.clubMetal,0,-.275,0,false));
club.add(mk(new THREE.CylinderGeometry(.01,.009,.12,8),M.grip,0,0,0,false));
const headGeo=new THREE.BoxGeometry(.08,.03,.048);
club.add(mk(headGeo,M.clubMetal,0,-.56,0));
club.position.set(0,-.19,0);la.fore.add(club);

// 그림자
const shadow=new THREE.Mesh(new THREE.CircleGeometry(.4,16),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.28,depthWrite:false}));
shadow.rotation.x=-Math.PI/2;shadow.position.y=.003;g.add(shadow);

g.userData={torso,hips,head,lArm:la.arm,lFore:la.fore,rArm:ra.arm,rFore:ra.fore,lLeg:ll.leg,lShin:ll.shin,rLeg:rl.leg,rShin:rl.shin,club,torsoBaseY:torso.position.y};
g.scale.set(1.15,1.15,1.15);
golfer=g;scene.add(g);golfer.visible=false;
return g}

/* ========== 포즈 시스템 ========== */
const P={
idle(g){const u=g.userData;u.torso.rotation.set(0,0,0);u.hips.rotation.set(0,0,0);u.head.rotation.set(0,0,0);
u.lArm.rotation.set(.08,0,0);u.lFore.rotation.set(0,0,0);u.rArm.rotation.set(.08,0,0);u.rFore.rotation.set(0,0,0);
u.lLeg.rotation.set(0,0,0);u.lShin.rotation.set(0,0,0);u.rLeg.rotation.set(0,0,0);u.rShin.rotation.set(0,0,0)},
addr(g){const u=g.userData;u.torso.rotation.set(.22,0,0);u.hips.rotation.set(.06,0,0);u.head.rotation.set(.05,0,0);
u.lArm.rotation.set(.65,0,.14);u.lFore.rotation.set(.22,0,0);u.rArm.rotation.set(.65,0,-.14);u.rFore.rotation.set(.22,0,0);
u.lLeg.rotation.set(-.04,0,-.03);u.lShin.rotation.set(.07,0,0);u.rLeg.rotation.set(-.04,0,.03);u.rShin.rotation.set(.07,0,0)},
back(g,t){const u=g.userData,T=clamp(t,0,1),e=T<.5?2*T*T:1-Math.pow(-2*T+2,2)/2;
u.torso.rotation.set(.18-e*.12,e*.65,e*.06);u.hips.rotation.set(.06,e*.18,0);u.head.rotation.set(.05,-e*.22,0);
u.lArm.rotation.set(.55-e*.9,e*.35,.14+e*.22);u.lFore.rotation.set(.22+e*1.3,0,0);
u.rArm.rotation.set(.55+e*.35,-e*.45,-.14-e*.32);u.rFore.rotation.set(.22+e*.85,0,0);
u.lLeg.rotation.set(-.04+e*.06,0,-.03);u.rLeg.rotation.set(-.04-e*.09,0,.03);u.rShin.rotation.set(.07+e*.12,0,0)},
down(g,t){const u=g.userData,T=clamp(t,0,1),e=T*T*T;
u.torso.rotation.set(lerp(.06,.32,e),lerp(.65,-.35,e),lerp(.06,0,e));
u.hips.rotation.set(.06,lerp(.18,-.22,e),0);u.head.rotation.set(.05,lerp(-.22,.12,e),0);
u.lArm.rotation.set(lerp(-.35,1.05,e),lerp(.35,-.12,e),lerp(.36,.04,e));u.lFore.rotation.set(lerp(1.52,.2,e),0,0);
u.rArm.rotation.set(lerp(.9,.18,e),lerp(-.45,.22,e),lerp(-.46,.06,e));u.rFore.rotation.set(lerp(1.07,.18,e),0,0);
u.lLeg.rotation.set(lerp(.02,-.09,e),0,-.03);u.rLeg.rotation.set(lerp(-.13,.02,e),0,.03);u.rShin.rotation.set(lerp(.19,.07,e),0,0)},
impact(g){const u=g.userData;u.torso.rotation.set(.32,-.35,0);u.hips.rotation.set(.06,-.22,0);u.head.rotation.set(0,.12,0);
u.lArm.rotation.set(1.05,-.12,.04);u.lFore.rotation.set(.2,0,0);u.rArm.rotation.set(.18,.22,.06);u.rFore.rotation.set(.18,0,0)},
follow(g,t){const u=g.userData,T=clamp(t,0,1),e=1-Math.pow(1-T,3);
u.torso.rotation.set(lerp(.32,.22,e),lerp(-.35,-.9,e),-e*.06);u.hips.rotation.set(.04,lerp(-.22,-.55,e),0);
u.head.rotation.set(-e*.12,lerp(.12,.47,e),0);
u.lArm.rotation.set(lerp(1.05,-.55,e),lerp(-.12,-.35,e),lerp(.04,-.18,e));u.lFore.rotation.set(lerp(.2,.72,e),0,0);
u.rArm.rotation.set(lerp(.18,-.65,e),lerp(.22,.65,e),lerp(.06,.35,e));u.rFore.rotation.set(lerp(.18,.85,e),0,0)},

u.lArm.rotation.set(.52,0,.07);u.lFore.rotation.set(.14,0,0);u.rArm.rotation.set(.52,0,-.07);u.rFore.rotation.set(.14,0,0)},
pstroke(g,t){const u=g.userData;u.torso.rotation.set(.26,0,0);
u.lArm.rotation.set(.52+t*.22,0,.07);u.lFore.rotation.set(.14-t*.1,0,0);
u.rArm.rotation.set(.52+t*.22,0,-.07);u.rFore.rotation.set(.14-t*.1,0,0)},

u.lArm.rotation.set(-1.3,0,.35);u.lFore.rotation.set(0,0,0);u.rArm.rotation.set(-1.3,0,-.35);u.rFore.rotation.set(0,0,0)}
};

/* ========== 스윙 애니메이션 ========== */
const SA={active:false,phase:'idle',time:0,power:0,isPutt:false,
dur:{back:.55,down:.15,hit:.04,follow:.75},
start(pwr,putt){this.active=true;this.phase=putt?'pb':'back';this.time=0;this.power=pwr;this.isPutt=putt;if(!putt)AUD.play('swing')},
update(dt){if(!this.active||!golfer)return;this.time+=dt;this.isPutt?this._putt():this._full()},
_full(){const d=this.dur;
if(this.phase==='back'){const t=this.time/d.back;P.back(golfer,t);if(t>=1){this.phase='down';this.time=0}}
else if(this.phase==='down'){const t=this.time/d.down;P.down(golfer,t);if(t>=1){this.phase='hit';this.time=0;vib(30)}}
else if(this.phase==='hit'){P.impact(golfer);if(this.time/d.hit>=1){this.phase='follow';this.time=0}}
else if(this.phase==='follow'){const t=this.time/d.follow;P.follow(golfer,t);if(t>=1){this.active=false;this.phase='idle'}}},
_putt(){const T=this.time/.55;
if(T<.38)P.pstroke(golfer,-(T/.38));
else if(T<.58){P.pstroke(golfer,-1+(T-.38)/.2*2);if(T>=.48)vib(15)}
else if(T<1)P.pstroke(golfer,1-(T-.58)/.42);
else{this.active=false;this.phase='idle';P.paddr(golfer)}},
reset(){this.active=false;this.phase='idle';this.time=0}};

/* ========== 나무 생성 — 크고 풍성한 나무 ========== */
function mkTree(type,x,z,sc=1){
const g=new THREE.Group();
const s=(2.8+Math.random()*2.0)*sc;
const h=gndH(x,z);

if(type==='palm'){
// 야자수 — 곡선 줄기 + 큰 잎
const pts=[];for(let i=0;i<=12;i++){const t=i/12;
pts.push(new THREE.Vector3(Math.sin(t*1.2)*.5*s,t*3.2*s,Math.cos(t*.4)*.15*s))}
const curve=new THREE.CatmullRomCurve3(pts);
const trunk=new THREE.Mesh(new THREE.TubeGeometry(curve,16,.07*s,7,false),M.barkLight);
trunk.castShadow=true;trunk.receiveShadow=true;g.add(trunk);
// 코코넛
for(let i=0;i<3;i++){const ca=i/3*Math.PI*2,cr=.08*s;
const nut=new THREE.Mesh(new THREE.SphereGeometry(.05*s,6,5),new THREE.MeshStandardMaterial({color:0x6a4422,roughness:.7}));
nut.position.set(pts[12].x+Math.cos(ca)*cr,pts[12].y-.1*s,pts[12].z+Math.sin(ca)*cr);
g.add(nut)}
// 야자 잎 — 길고 곡선
for(let i=0;i<8;i++){const a=i/8*Math.PI*2,len=1.8*s+Math.random()*.8*s;
const lpts=[];for(let j=0;j<=8;j++){const jt=j/8;
lpts.push(new THREE.Vector3(Math.cos(a)*jt*len,pts[12].y+.1*s-jt*jt*len*.35,Math.sin(a)*jt*len+pts[12].z))}
lpts[0].set(pts[12].x,pts[12].y+.1*s,pts[12].z);
for(let j=1;j<=8;j++){lpts[j].x+=pts[12].x;lpts[j].z+=pts[12].z-pts[12].z+lpts[j].z}
// 잎 평면
const leafG=new THREE.PlaneGeometry(len,.15*s,8,1);
const lpa=leafG.attributes.position.array;
for(let j=0;j<lpa.length;j+=3){
const jt=lpa[j]/len+.5;const droopY=-jt*jt*len*.3;
lpa[j+1]+=droopY;lpa[j]=Math.cos(a+lpa[j+1]*.001)*jt*len;
lpa[j+2]=Math.sin(a+lpa[j+1]*.001)*jt*len}
leafG.computeVertexNormals();
const leafC=new THREE.Color().setHSL(.3+Math.random()*.06,.65,.25+Math.random()*.08);
const lf=new THREE.Mesh(leafG,new THREE.MeshStandardMaterial({color:leafC,roughness:.7,side:THREE.DoubleSide}));
lf.position.copy(pts[12]);lf.castShadow=true;g.add(lf)}}
else if(type==='pine'){
// 소나무 — 두꺼운 줄기 + 겹겹 원뿔 캐노피
const trH=2.5*s;
const ptrunk=new THREE.Mesh(new THREE.CylinderGeometry(.06*s,.1*s,trH,8),M.bark);
ptrunk.position.set(0,trH/2,0);ptrunk.castShadow=true;ptrunk.receiveShadow=true;g.add(ptrunk);
// 5겹 캐노피
for(let i=0;i<5;i++){
const y=1.0*s+i*.55*s;
const r=(.9-i*.12)*s;
const ch=.7*s;
const leafC=new THREE.Color().setHSL(.26+i*.01,.55+Math.random()*.15,.18+i*.04);
const cone=new THREE.Mesh(new THREE.ConeGeometry(r,ch,10),new THREE.MeshStandardMaterial({color:leafC,roughness:.72}));
cone.position.set(0,y+ch/2,0);cone.castShadow=true;cone.receiveShadow=true;g.add(cone)}}
else{
// 활엽수 — 두꺼운 줄기 + 풍성한 구형 캐노피
const trH=1.8*s;
const dtrunk=new THREE.Mesh(new THREE.CylinderGeometry(.06*s,.1*s,trH,8),M.bark);
dtrunk.position.set(0,trH/2,0);dtrunk.castShadow=true;dtrunk.receiveShadow=true;g.add(dtrunk);
// 가지
for(const sx of[-1,1]){
const brLen=.4*s;
const br=new THREE.Mesh(new THREE.CylinderGeometry(.02*s,.03*s,brLen,5),M.bark);
br.position.set(sx*.12*s,trH*.7,0);br.rotation.z=sx*-.6;br.castShadow=true;g.add(br)}
// 풍성한 캐노피 — 8개 구체 클러스터
const cc=[0x2a8a2a,0x338833,0x228822,0x3a993a,0x44aa44,0x2d7a2d];
for(let i=0;i<8;i++){
const r=(.45+Math.random()*.35)*s;
const leafC=new THREE.Color(cc[Math.floor(Math.random()*cc.length)]);
const sp=new THREE.Mesh(new THREE.SphereGeometry(r,8,7),new THREE.MeshStandardMaterial({color:leafC,roughness:.68}));
const ang=Math.random()*Math.PI*2,dist2=Math.random()*.3*s;
sp.position.set(Math.cos(ang)*dist2,trH+.2*s+Math.random()*.4*s,Math.sin(ang)*dist2);
sp.castShadow=true;sp.receiveShadow=true;g.add(sp)}}
// 나무 그림자 원
const tShadow=new THREE.Mesh(new THREE.CircleGeometry(.5*s,10),new THREE.MeshBasicMaterial({color:0x001100,transparent:true,opacity:.08,depthWrite:false}));
tShadow.rotation.x=-Math.PI/2;tShadow.position.set(0,.01,0);g.add(tShadow);

g.position.set(x,h,z);return g}

/* ========== 산 — 더 크고 웅장한 배경산 ========== */
function mkMountains(){
const g=new THREE.Group();
const colors=[[0x2a5a2a,0x4a8a4a],[0x3a6a3a,0x5a9a5a],[0x4a7a4a,0x6aaa6a]];
for(let layer=0;layer<3;layer++){
const dist=100+layer*45,peaks=16+layer*6;
const verts=[],idx=[],cols=[];
for(let i=0;i<=peaks;i++){
const a=(i/peaks)*Math.PI*2;
const r=dist+Math.random()*25;
const x=Math.cos(a)*r,z=Math.sin(a)*r;
const mh=(20+Math.random()*35)*(1-layer*.18);
verts.push(x,-2,z,x,mh,z);
const bc=new THREE.Color(colors[layer][0]);cols.push(bc.r,bc.g,bc.b);
const pc=mh>30?new THREE.Color(0xe8e8f0):mh>22?new THREE.Color(0x8aaa7a):new THREE.Color(colors[layer][1]);
cols.push(pc.r,pc.g,pc.b);
if(i<peaks){const b=i*2;idx.push(b,b+1,b+2,b+1,b+3,b+2)}}
const geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
geo.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
geo.setIndex(idx);geo.computeVertexNormals();
const mtn=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.72,flatShading:true}));
mtn.receiveShadow=true;g.add(mtn)}
return g}

/* ========== 코스 빌더 ========== */
function buildCourse(ci,hi){
if(grp)scene.remove(grp);
grp=new THREE.Group();bunks=[];waters=[];fwPath=[];
const c=COURSES[ci],seed=ci*100+hi,rng=mulberry32(seed),dist=c.dist[hi];
const ang=rng()*Math.PI*.4-.2;
const tx=0,tz=0,hx=Math.sin(ang)*dist*.3,hz=-dist*.3;
teeP=new THREE.Vector3(tx,gndH(tx,tz),tz);
holeP=new THREE.Vector3(hx,gndH(hx,hz),hz);

// 지면 — 넓은 잔디 언덕
const gndGeo=new THREE.PlaneGeometry(300,300,160,160);
const pa=gndGeo.attributes.position.array;
for(let i=0;i<pa.length;i+=3){const gx=pa[i],gy=pa[i+1];pa[i+2]=gndH(gx,gy)}
gndGeo.computeVertexNormals();
const gnd=new THREE.Mesh(gndGeo,M.grass);gnd.rotation.x=-Math.PI/2;gnd.receiveShadow=true;grp.add(gnd);
// 먼 곳 확장 지면
const gnd2=new THREE.Mesh(new THREE.PlaneGeometry(800,800),new THREE.MeshStandardMaterial({color:0x3a7a2a,roughness:.9}));
gnd2.rotation.x=-Math.PI/2;gnd2.position.y=-1;gnd2.receiveShadow=true;grp.add(gnd2);

// 페어웨이 경로
const midX=(teeP.x+holeP.x)/2+(rng()-.5)*dist*.12;
for(let i=0;i<=24;i++){const t=i/24;
const x=teeP.x*(1-t)*(1-t)+2*midX*t*(1-t)+holeP.x*t*t;
const z=teeP.z*(1-t)+holeP.z*t;
fwPath.push(new THREE.Vector3(x,gndH(x,z)+.02,z))}
const fwW=3.2+dist*.015;

// 페어웨이 매트
for(let i=0;i<fwPath.length-1;i++){
const p1=fwPath[i],p2=fwPath[i+1],dx=p2.x-p1.x,dz=p2.z-p1.z,len=Math.sqrt(dx*dx+dz*dz);
const my=gndH((p1.x+p2.x)/2,(p1.z+p2.z)/2);
const fw=new THREE.Mesh(new THREE.PlaneGeometry(fwW,len+.5),M.fairway);
fw.rotation.x=-Math.PI/2;fw.rotation.z=-Math.atan2(dz,dx)+Math.PI/2;
fw.position.set((p1.x+p2.x)/2,my+.03,(p1.z+p2.z)/2);fw.receiveShadow=true;grp.add(fw);
// 러프 경계
for(const side of[-1,1]){const rw=new THREE.Mesh(new THREE.PlaneGeometry(fwW*.7,len+.5),M.rough);
const nx=-dz/len*side,nz=dx/len*side;
const rwx=(p1.x+p2.x)/2+nx*(fwW*.85),rwz=(p1.z+p2.z)/2+nz*(fwW*.85);
rw.rotation.x=-Math.PI/2;rw.rotation.z=-Math.atan2(dz,dx)+Math.PI/2;
rw.position.set(rwx,gndH(rwx,rwz)+.02,rwz);rw.receiveShadow=true;grp.add(rw)}}

// 티박스 — 깔끔한 직사각형
const tH=gndH(teeP.x,teeP.z);
const tb=new THREE.Mesh(new THREE.PlaneGeometry(2.6,3.2),M.tee);tb.rotation.x=-Math.PI/2;tb.position.set(teeP.x,tH+.04,teeP.z);tb.receiveShadow=true;grp.add(tb);
for(const sx of[-.8,.8]){const mkr=new THREE.Mesh(new THREE.SphereGeometry(.06,8,6),M.white);mkr.position.set(teeP.x+sx,tH+.07,teeP.z+1);mkr.castShadow=true;grp.add(mkr)}

// 그린 — 완만한 원형
grnR=3.2+dist*.012;grnC=holeP.clone();
const gH=gndH(grnC.x,grnC.z);
const gmesh=new THREE.Mesh(new THREE.CircleGeometry(grnR,36),M.green);
gmesh.rotation.x=-Math.PI/2;gmesh.position.set(grnC.x,gH+.04,grnC.z);gmesh.receiveShadow=true;grp.add(gmesh);
const fring=new THREE.Mesh(new THREE.RingGeometry(grnR,grnR+.8,36),M.fairway);
fring.rotation.x=-Math.PI/2;fring.position.set(grnC.x,gH+.03,grnC.z);fring.receiveShadow=true;grp.add(fring);

// 홀+깃발
const hH=gndH(holeP.x,holeP.z);
const holeCup=new THREE.Mesh(new THREE.CylinderGeometry(.054,.054,.06,16),new THREE.MeshStandardMaterial({color:0x111111}));
holeCup.position.set(holeP.x,hH+.02,holeP.z);grp.add(holeCup);
const pl=new THREE.Mesh(new THREE.CylinderGeometry(.008,.008,1.4,6),M.pole);
pl.position.set(holeP.x,hH+.7,holeP.z);pl.castShadow=true;grp.add(pl);
const fs=new THREE.Shape();fs.moveTo(0,0);fs.lineTo(.32,-.08);fs.lineTo(0,-.16);
flagM=new THREE.Mesh(new THREE.ShapeGeometry(fs),M.red);
flagM.position.set(holeP.x+.008,hH+1.38,holeP.z);flagM.castShadow=true;grp.add(flagM);

// 벙커
if(rng()>.2){const nb=1+Math.floor(rng()*2);for(let i=0;i<nb;i++){
const bt=.35+rng()*.4;
const bp=new THREE.Vector3();bp.lerpVectors(teeP,holeP,bt);
const bx=bp.x+(rng()-.5)*fwW*1.6,bz=bp.z+(rng()-.5)*2.5,br=1.0+rng()*1.2;
const bH=gndH(bx,bz);
const bkm=new THREE.Mesh(new THREE.CircleGeometry(br,20),M.sand);
bkm.rotation.x=-Math.PI/2;bkm.position.set(bx,bH+.03,bz);bkm.receiveShadow=true;grp.add(bkm);
const lip=new THREE.Mesh(new THREE.TorusGeometry(br,.065,6,28),new THREE.MeshStandardMaterial({color:0xc4a44a,roughness:.72}));
lip.rotation.x=-Math.PI/2;lip.position.set(bx,bH+.07,bz);lip.castShadow=true;grp.add(lip);
bunks.push({x:bx,z:bz,r:br})}}

// 워터 해저드
if(c.water.includes(hi+1)){
const wt=.28+rng()*.3;
const wp=new THREE.Vector3();wp.lerpVectors(teeP,holeP,wt);
const woff=(rng()>.5?1:-1)*(fwW*.9+rng()*2.5);
const wx=wp.x+woff,wz=wp.z+(rng()-.5)*3;
const ww=4+rng()*4,wh=3+rng()*2.5;
const wH=gndH(wx,wz)-.12;
const wm=new THREE.Mesh(new THREE.PlaneGeometry(ww,wh),M.water);
wm.rotation.x=-Math.PI/2;wm.position.set(wx,wH,wz);wm.receiveShadow=true;wm.userData={isWater:true,baseY:wH};grp.add(wm);
waters.push({x:wx,z:wz,w:ww/2,h:wh/2,mesh:wm});
// 연못 주변 바위
for(let i=0;i<12;i++){
const ra2=rng()*Math.PI*2,rd2=Math.max(ww,wh)/2+.4+rng()*.7;
const rkx=wx+Math.cos(ra2)*rd2,rkz=wz+Math.sin(ra2)*rd2;
const rk=new THREE.Mesh(new THREE.DodecahedronGeometry(.15+rng()*.3,0),rng()>.5?M.rock:M.rockLight);
rk.position.set(rkx,gndH(rkx,rkz)+.08,rkz);rk.rotation.set(rng(),rng(),rng());rk.castShadow=true;grp.add(rk)}}

// === 나무 === 페어웨이 양쪽으로 밀집된 숲
const treeTT=c.trees==='mixed'?null:c.trees;
function rndTree(){return treeTT||((['deciduous','pine','palm'])[Math.floor(rng()*3)])}

// 1열: 페어웨이 바로 옆 — 밀집 (매 2번째)
for(let fi=0;fi<fwPath.length;fi+=2){const fp=fwPath[fi];
for(const side of[-1,1]){
const off=fwW*1.3+rng()*1.5;
const nx=fp.x+side*off+(rng()-.5)*1.0,nz=fp.z+(rng()-.5)*1.5;
grp.add(mkTree(rndTree(),nx,nz,1.2+rng()*.6));
// 덤불도 함께
const bs=.4+rng()*.6;
const bC=new THREE.Color().setHSL(.28+rng()*.08,.55+rng()*.2,.16+rng()*.12);
const bush=new THREE.Mesh(new THREE.SphereGeometry(bs,8,6),new THREE.MeshStandardMaterial({color:bC,roughness:.78}));
bush.position.set(nx+(rng()-.5)*1,gndH(nx,nz)+bs*.3,nz+(rng()-.5)*1);
bush.scale.set(1,.55+rng()*.3,1);bush.castShadow=true;grp.add(bush)}}

// 2열: 중간 거리
for(let fi=0;fi<fwPath.length;fi+=3){const fp=fwPath[fi];
for(const side of[-1,1]){for(let j=0;j<2;j++){
const off=fwW*3.0+rng()*4;
const nx=fp.x+side*off+(rng()-.5)*3,nz=fp.z+(rng()-.5)*3;
grp.add(mkTree(rndTree(),nx,nz,1.4+rng()*1.0))}}}

// 3열: 뒤쪽 숲 벽
for(let fi=0;fi<fwPath.length;fi+=3){const fp=fwPath[fi];
for(const side of[-1,1]){for(let j=0;j<2;j++){
const off=fwW*6+rng()*6;
const nx=fp.x+side*off+(rng()-.5)*4,nz=fp.z+(rng()-.5)*4;
grp.add(mkTree(rndTree(),nx,nz,1.5+rng()*1.4))}}}

// 배경 숲 (원형)
for(let i=0;i<80;i++){
const ta2=rng()*Math.PI*2,td2=15+rng()*55;
const ttx=Math.cos(ta2)*td2,ttz=-dist*.15+Math.sin(ta2)*td2;
let onFw=false;
for(const fp of fwPath)if(Math.hypot(ttx-fp.x,ttz-fp.z)<fwW*1.3){onFw=true;break}
if(onFw)continue;
grp.add(mkTree(rndTree(),ttx,ttz,1.0+rng()*1.2))}

// 원경 대형나무 — 거대한 배경숲
for(let i=0;i<40;i++){
const ta3=rng()*Math.PI*2,td3=45+rng()*40;
const ttx2=Math.cos(ta3)*td3,ttz2=-dist*.15+Math.sin(ta3)*td3;
grp.add(mkTree(rndTree(),ttx2,ttz2,1.8+rng()*2.0))}

// === 추가 덤불 ===
for(let i=0;i<30+Math.floor(rng()*20);i++){
const ba=rng()*Math.PI*2,bd=5+rng()*45;
const bx=Math.cos(ba)*bd,bz=-dist*.15+Math.sin(ba)*bd;
let onFw2=false;for(const fp of fwPath)if(Math.hypot(bx-fp.x,bz-fp.z)<fwW*1.1){onFw2=true;break}
if(onFw2)continue;
const bs=.35+rng()*.7;
const bC=new THREE.Color().setHSL(.26+rng()*.1,.5+rng()*.25,.14+rng()*.13);
const bush=new THREE.Mesh(new THREE.SphereGeometry(bs,8,6),new THREE.MeshStandardMaterial({color:bC,roughness:.78}));
bush.position.set(bx,gndH(bx,bz)+bs*.3,bz);bush.scale.set(1,.5+rng()*.35,1);bush.castShadow=true;grp.add(bush)}

// === 바위 ===
for(let i=0;i<15+Math.floor(rng()*10);i++){
const ra=rng()*Math.PI*2,rd=6+rng()*40;
const rx=Math.cos(ra)*rd,rz=-dist*.15+Math.sin(ra)*rd;
const rsize=.15+rng()*.5;
const rk=new THREE.Mesh(new THREE.DodecahedronGeometry(rsize,1),rng()>.5?M.rock:M.rockLight);
rk.position.set(rx,gndH(rx,rz)+rsize*.25,rz);rk.rotation.set(rng()*2,rng()*2,rng()*2);
rk.castShadow=true;grp.add(rk)}

// === 꽃 클러스터 ===
const fMats=[M.fl1,M.fl2,M.fl3,M.fl4];
for(let i=0;i<30+Math.floor(rng()*20);i++){
const fa=rng()*Math.PI*2,fd=3+rng()*30;
const fx=Math.cos(fa)*fd,fz=-dist*.15+Math.sin(fa)*fd;
const fh=gndH(fx,fz);
const fsize=.06+rng()*.07;
const fl=new THREE.Mesh(new THREE.SphereGeometry(fsize,6,4),fMats[Math.floor(rng()*4)]);
fl.position.set(fx,fh+fsize+.02,fz);grp.add(fl);
const stem=new THREE.Mesh(new THREE.CylinderGeometry(.004,.004,.1,4),new THREE.MeshStandardMaterial({color:0x228822}));
stem.position.set(fx,fh+.045,fz);grp.add(stem);
// 주변 추가 꽃
if(rng()>.35){for(let j=0;j<4;j++){
const ox=fx+(rng()-.5)*.5,oz=fz+(rng()-.5)*.5,oh=gndH(ox,oz);
const fl2=new THREE.Mesh(new THREE.SphereGeometry(.04+rng()*.05,5,3),fMats[Math.floor(rng()*4)]);
fl2.position.set(ox,oh+.06,oz);grp.add(fl2)}}}

// === 잔디 터프트 (티 주변 디테일) ===
for(let i=0;i<100;i++){
const gta=rng()*Math.PI*2,gtd=1.5+rng()*10;
const gtx=teeP.x+Math.cos(gta)*gtd,gtz=teeP.z+Math.sin(gta)*gtd;
const gth=gndH(gtx,gtz);
const tH2=.1+rng()*.1;
const tuft=new THREE.Mesh(new THREE.ConeGeometry(.03+rng()*.03,tH2,4),
new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(.28+rng()*.06,.5+rng()*.2,.2+rng()*.12),roughness:.8}));
tuft.position.set(gtx,gth+tH2/2,gtz);grp.add(tuft)}

// 카트 길
const cpx=teeP.x+fwW+2.5,cpz=(teeP.z+holeP.z)/2;
const cp=new THREE.Mesh(new THREE.PlaneGeometry(.8,dist*.38),M.dirt);
cp.rotation.x=-Math.PI/2;cp.position.set(cpx,gndH(cpx,cpz)+.02,cpz);cp.receiveShadow=true;grp.add(cp);

// OB 말뚝
obB=22+dist*.16;
for(let a=0;a<Math.PI*2;a+=Math.PI/7){
const ox=Math.cos(a)*obB,oz=-dist*.15+Math.sin(a)*obB;
const ob=new THREE.Mesh(new THREE.CylinderGeometry(.02,.02,.5,4),M.ob);
ob.position.set(ox,gndH(ox,oz)+.25,oz);grp.add(ob)}

grp.add(mkMountains());
scene.add(grp)}

/* ========== 볼 + 조준 ========== */
let ballM,ballShadow,aimLine,aimDot,landingZone,landingRing,trailLine,trailPts=[],particles=[];
function mkBall(){

function updBM(){if(!ballM)return;ballM.position.set(G.ball.x,G.ball.y,G.ball.z);

function mkAim(){
// 밝고 두꺼운 조준선
const pts=[];for(let i=0;i<30;i++)pts.push(new THREE.Vector3(0,0,0));
const curve=new THREE.CatmullRomCurve3(pts);
aimLine=new THREE.Mesh(new THREE.TubeGeometry(curve,40,.09,8,false),
new THREE.MeshBasicMaterial({color:0x55eeff,transparent:true,opacity:.95,depthWrite:false}));
aimLine._pts=pts;scene.add(aimLine);
// 글로우
const glow=new THREE.Mesh(new THREE.TubeGeometry(curve,40,.18,8,false),
new THREE.MeshBasicMaterial({color:0x33bbff,transparent:true,opacity:.4,depthWrite:false}));
glow.name='glow';aimLine.add(glow);

// 랜딩존 — 크고 밝게
landingZone=new THREE.Mesh(new THREE.RingGeometry(.8,3.0,36),
new THREE.MeshBasicMaterial({color:0xffdd22,transparent:true,opacity:.8,side:THREE.DoubleSide,depthWrite:false}));
landingZone.rotation.x=-Math.PI/2;scene.add(landingZone);
// 중앙 타겟
const ct=new THREE.Mesh(new THREE.CircleGeometry(.4,20),
new THREE.MeshBasicMaterial({color:0xffee44,transparent:true,opacity:.4,side:THREE.DoubleSide,depthWrite:false}));
ct.rotation.x=-Math.PI/2;ct.position.y=.002;landingZone.add(ct);
// 외곽 링
landingRing=new THREE.Mesh(new THREE.RingGeometry(2.8,3.5,36),
new THREE.MeshBasicMaterial({color:0xffaa00,transparent:true,opacity:.8,side:THREE.DoubleSide,depthWrite:false}));
landingRing.rotation.x=-Math.PI/2;scene.add(landingRing);
// 조준점
aimDot=new THREE.Mesh(new THREE.SphereGeometry(.3,12,8),
new THREE.MeshBasicMaterial({color:0x55eeff,transparent:true,opacity:.95}));scene.add(aimDot)}

function updAim(pwr){if(!aimLine||!G)return;
const cl=G.putting?PUTTER:CLUB,maxD=cl.power*(pwr/100)*2.5,loft=rad(cl.loft),dir=G.aim;
const n=30,dx=Math.sin(dir),dz=-Math.cos(dir),landD=maxD*.3;
const pts=aimLine._pts;
for(let i=0;i<n;i++){const t=i/(n-1),d=landD*t;
const terrH=gndH(G.ball.x+dx*d,G.ball.z+dz*d);
const arcH=Math.sin(t*Math.PI)*maxD*Math.sin(loft)*.12;
pts[i].set(G.ball.x+dx*d,Math.max(terrH+.2,G.ball.y+arcH)+.1,G.ball.z+dz*d)}
const curve=new THREE.CatmullRomCurve3(pts);
aimLine.geometry.dispose();aimLine.geometry=new THREE.TubeGeometry(curve,40,.09,8,false);
const glow=aimLine.getObjectByName('glow');
if(glow){glow.geometry.dispose();glow.geometry=new THREE.TubeGeometry(curve,40,.18,8,false)}
const lx=G.ball.x+dx*landD,lz=G.ball.z+dz*landD,lh=gndH(lx,lz);
if(landingZone){landingZone.position.set(lx,lh+.08,lz);landingZone.visible=true;const sc=.5+maxD*.03;landingZone.scale.set(sc,sc,sc)}
if(landingRing){landingRing.position.set(lx,lh+.07,lz);landingRing.visible=true;const sc=.5+maxD*.03;landingRing.scale.set(sc,sc,sc)}
if(aimDot){aimDot.position.set(lx,lh+.2,lz);aimDot.visible=true}}

function hideAim(){if(aimLine)aimLine.visible=false;if(aimDot)aimDot.visible=false;if(landingZone)landingZone.visible=false;if(landingRing)landingRing.visible=false}
function showAimL(){if(aimLine)aimLine.visible=true;if(aimDot)aimDot.visible=true;if(landingZone)landingZone.visible=true;if(landingRing)landingRing.visible=true}

function initTrail(){const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(new Float32Array(90*3),3));geo.setDrawRange(0,0);
trailLine=new THREE.Line(geo,new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.5}));scene.add(trailLine)}
function updTrail(){if(!trailLine||!G.ball.flying)return;trailPts.push(G.ball.x,G.ball.y,G.ball.z);if(trailPts.length>90*3)trailPts.splice(0,3);
const a=trailLine.geometry.attributes.position.array;for(let i=0;i<trailPts.length;i++)a[i]=trailPts[i];
trailLine.geometry.attributes.position.needsUpdate=true;trailLine.geometry.setDrawRange(0,trailPts.length/3);trailLine.visible=true}
function clearTrail(){trailPts=[];if(trailLine){trailLine.geometry.setDrawRange(0,0);trailLine.visible=false}}

function spawnP(x,y,z,col,n=10){for(let i=0;i<n;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.015,4,3),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.8}));
m.position.set(x,y,z);scene.add(m);particles.push({m,v:{x:(Math.random()-.5)*.12,y:.05+Math.random()*.12,z:(Math.random()-.5)*.12},life:1})}}
function updP(dt){for(let i=particles.length-1;i>=0;i--){const p=particles[i];
p.m.position.x+=p.v.x*dt*3;p.m.position.y+=p.v.y*dt*3;p.m.position.z+=p.v.z*dt*3;p.v.y-=.15*dt;p.life-=dt*1.5;p.m.material.opacity=p.life;
if(p.life<=0){scene.remove(p.m);particles.splice(i,1)}}}

/* ========== 카메라 — 골프킹 스타일 (더 넓은 시야) ========== */
const CAM={
tgt:new THREE.Vector3(),pos:new THREE.Vector3(),mode:'behind',shakeT:0,shakeI:0,
behind(bp,aa){
// Golf King 스타일 — 골퍼 뒤 위에서 코스를 넓게
const d=3.8,h=2.4;
this.pos.set(bp.x-Math.sin(aa)*d,bp.y+h,bp.z+Math.cos(aa)*d);
this.tgt.set(bp.x+Math.sin(aa)*7,bp.y+.05,bp.z-Math.cos(aa)*7)},
swingClose(bp,aa){
const sa=aa+Math.PI*.14;
this.pos.set(bp.x-Math.sin(sa)*4.2,bp.y+2.2,bp.z+Math.cos(sa)*4.2);
this.tgt.set(bp.x+Math.sin(aa)*5,bp.y+.2,bp.z-Math.cos(aa)*5)},
follow(bp,v){
const sp=Math.sqrt(v.x*v.x+v.z*v.z),d=4.5+sp*.15,h=2.5+bp.y*.25;
const bh=sp>.1?Math.atan2(v.x,-v.z):G.aim;
this.tgt.lerp(new THREE.Vector3(bp.x,bp.y*.3+.3,bp.z),.09);
this.pos.lerp(new THREE.Vector3(bp.x-Math.sin(bh)*d,h,bp.z+Math.cos(bh)*d),.07)},
flyover(t,tp,hp){
const p=clamp(t,0,1);
// 게임뷰 behind 카메라와 동일한 구도로 코스를 따라 이동
// 홀에서 시작 → 티로 돌아옴 (코스 전체를 역방향으로 보여줌)
const fwdA=Math.atan2(hp.x-tp.x,-(hp.z-tp.z));
const rp=1-p;
const bx=tp.x+(hp.x-tp.x)*rp;
const bz=tp.z+(hp.z-tp.z)*rp;
const by=gndH(bx,bz);
// behind 카메라 스타일 — 뒤 위에서 진행방향을 봄
const d=3.8,h=2.4;
this.pos.set(bx-Math.sin(fwdA)*d,by+h,bz+Math.cos(fwdA)*d);
this.tgt.set(bx+Math.sin(fwdA)*7,by+.05,bz-Math.cos(fwdA)*7)},
result(hp){const t=performance.now()*.00025;
this.pos.set(hp.x+Math.sin(t)*4,hp.y+3.2,hp.z+Math.cos(t)*4);
this.tgt.set(hp.x,hp.y+.3,hp.z)},
shake(i=.03,d=.2){this.shakeT=d;this.shakeI=i},
snap(){camera.position.copy(this.pos);camera.lookAt(this.tgt)},
update(dt){
const sp=this.mode==='flyover'||this.mode==='result'?.99:this.mode==='behind'?.15:this.mode==='swing'?.12:.09;
camera.position.lerp(this.pos,sp);
const lt=this.tgt.clone();
if(this.shakeT>0){this.shakeT-=dt;const s=this.shakeI*(this.shakeT/.2);
lt.x+=Math.sin(performance.now()*.05)*s;lt.y+=Math.cos(performance.now()*.07)*s}
camera.lookAt(lt)}};

/* ========== 물리 ========== */
function isGrn(x,z){return grnC&&Math.hypot(x-grnC.x,z-grnC.z)<grnR}
function isBnk(x,z){for(const b of bunks)if(Math.hypot(x-b.x,z-b.z)<b.r)return true;return false}
function physTick(dt){
if(!G.ball.flying)return;const ss=3,sd=dt/ss;
for(let s=0;s<ss;s++){
G.ball.vy-=9.81*sd;G.ball.vx*=(1-.03*sd);G.ball.vz*=(1-.03*sd);
G.ball.vx+=G.wind.x*sd*.08;G.ball.vz+=G.wind.z*sd*.08;
G.ball.x+=G.ball.vx*sd;G.ball.y+=G.ball.vy*sd;G.ball.z+=G.ball.vz*sd;
const gh=gndH(G.ball.x,G.ball.z);
if(G.ball.y<=gh+.063){
G.ball.y=gh+.063;
const onG=isGrn(G.ball.x,G.ball.z),inB=isBnk(G.ball.x,G.ball.z);
if(G.ball.vy<-.3){G.ball.vy=-G.ball.vy*(inB?.15:onG?.3:.45);G.ball.vx*=.7;G.ball.vz*=.7;AUD.play('bounce');spawnP(G.ball.x,G.ball.y,G.ball.z,inB?0xd4b978:0x44aa44,5)}else G.ball.vy=0;
const fr=onG?.985:inB?.93:.96;G.ball.vx*=fr;G.ball.vz*=fr;
if(onG&&holeP){const ddx=holeP.x-G.ball.x,ddz=holeP.z-G.ball.z,dd=Math.sqrt(ddx*ddx+ddz*ddz);if(dd>.1&&dd<grnR){const sl=.015/(dd+.5);G.ball.vx+=ddx/dd*sl;G.ball.vz+=ddz/dd*sl}}
const spd=Math.sqrt(G.ball.vx*G.ball.vx+G.ball.vy*G.ball.vy+G.ball.vz*G.ball.vz);
if(spd<.02&&Math.abs(G.ball.vy)<.05){G.ball.vx=G.ball.vy=G.ball.vz=0;G.ball.flying=false;G.ball.stopped=true}}
for(const w of waters){if(Math.abs(G.ball.x-w.x)<w.w&&Math.abs(G.ball.z-w.z)<w.h&&G.ball.y<gndH(w.x,w.z)+.1){G.ball.flying=false;G.ball.stopped=true;G.ball.inWater=true;AUD.play('splash');spawnP(G.ball.x,.05,G.ball.z,0x4488cc,15);CAM.shake(.04,.3);return}}
if(holeP&&Math.hypot(G.ball.x,G.ball.z+holeP.z*.5)>obB){G.ball.flying=false;G.ball.stopped=true;G.ball.isOB=true;AUD.play('ob');return}
if(holeP){const hd=Math.hypot(G.ball.x-holeP.x,G.ball.z-holeP.z),sp2=Math.sqrt(G.ball.vx*G.ball.vx+G.ball.vz*G.ball.vz);
if(hd<.12&&G.ball.y<gndH(holeP.x,holeP.z)+.15&&sp2<2.2){G.ball.x=holeP.x;G.ball.z=holeP.z;G.ball.y=gndH(holeP.x,holeP.z);G.ball.vx=G.ball.vy=G.ball.vz=0;G.ball.flying=false;G.ball.stopped=true;G.ball.holed=true;AUD.play('hole');spawnP(holeP.x,.1,holeP.z,0xffd700,20);CAM.shake(.02,.3);return}}
}}

const G={
state:'menu',ci:0,hi:0,par:0,stroke:0,maxStk:8,
scores:[],wind:{spd:0,dir:0,x:0,z:0},
aim:0,power:0,accuracy:50,
swPhase:'idle',gaugeVal:0,gaugeDir:1,
accVal:50,accDir:1,
flyT:0,flyActive:false,
ball:{x:0,y:.063,z:0,vx:0,vy:0,vz:0,flying:false,stopped:true,holed:false,inWater:false,isOB:false},
putting:false,settled:false,roundActive:false
};

/* ========== UI ========== */
const SCREENS=['hud','clubBtn','miniWrap','swingPanel','flyover','scoreScr','resultScr','menuScr','courseScr','recordScr','settingScr','loading','distShow'];
function hideAll(){SCREENS.forEach(id=>{const e=$(id);if(e)e.style.display='none'})}
function showScr(mode){hideAll();
if(mode==='menu'){$('menuScr').style.display='flex'}
else if(mode==='loading'){$('loading').style.display='flex'}
else if(mode==='flyover'){$('hud').style.display='block';$('flyover').style.display='block'}
else if(mode==='game'){$('hud').style.display='block';$('miniWrap').style.display='block';$('distShow').style.display='block';$('swingPanel').style.display='block';$('clubBtn').style.display='block'}
else if(mode==='score'){$('scoreScr').style.display='block'}
else if(mode==='result'){$('resultScr').style.display='block'}
else if(mode==='course'){$('courseScr').style.display='block'}
else if(mode==='records'){$('recordScr').style.display='block'}
else if(mode==='settings'){$('settingScr').style.display='block'}}

function updHUD(){
const c=COURSES[G.ci];
$('hCourse').textContent=c.name;
$('hHole').textContent=`${G.hi+1}홀`;
$('hPar').textContent=`PAR ${G.par}`;
$('hClub').textContent=G.putting?PUTTER.name:CLUB.name;
$('hWind').textContent=`${G.wind.spd.toFixed(1)} m/s`;
const dirs=['↑','↗','→','↘','↓','↙','←','↖'];
$('hWindDir').textContent=dirs[Math.round(G.wind.dir/(Math.PI/4))%8]||'↑';
$('hStroke').textContent=G.stroke;
const d=holeP?Math.hypot(G.ball.x-holeP.x,G.ball.z-holeP.z):0;
$('hDist').textContent=d.toFixed(0)+'m';
$('dpVal').textContent=d.toFixed(1)}

function showBig(txt,dur=1500){$('bigMsg').textContent=txt;$('bigMsg').style.display='block';setTimeout(()=>$('bigMsg').style.display='none',dur)}

/* ========== 미니맵 ========== */
function drawMinimap(){
const c=$('miniCvs');if(!c||!holeP||!teeP)return;const x=c.getContext('2d');
const w=c.width,h=c.height;
x.clearRect(0,0,w,h);
x.fillStyle='rgba(0,40,0,.85)';x.fillRect(0,0,w,h);
const scale=w/(Math.max(Math.abs(holeP.z-teeP.z),Math.abs(holeP.x-teeP.x))*1.5+10);
const ox=w/2,oz=h/2;
function mtx(wx){return ox+(wx-(teeP.x+holeP.x)/2)*scale}
function mtz(wz){return oz+(wz-(teeP.z+holeP.z)/2)*scale}
// 페어웨이
x.strokeStyle='rgba(80,180,80,.6)';x.lineWidth=8*scale*.3;x.beginPath();
fwPath.forEach((p,i)=>{i===0?x.moveTo(mtx(p.x),mtz(p.z)):x.lineTo(mtx(p.x),mtz(p.z))});x.stroke();
// 그린
x.fillStyle='rgba(100,220,100,.6)';x.beginPath();x.arc(mtx(grnC.x),mtz(grnC.z),grnR*scale,0,Math.PI*2);x.fill();
// 홀
x.fillStyle='#ffd700';x.beginPath();x.arc(mtx(holeP.x),mtz(holeP.z),3,0,Math.PI*2);x.fill();
// 볼
x.fillStyle='#fff';x.beginPath();x.arc(mtx(G.ball.x),mtz(G.ball.z),3.5,0,Math.PI*2);x.fill();
// 방향
x.strokeStyle='rgba(100,200,255,.7)';x.lineWidth=1.5;x.beginPath();
x.moveTo(mtx(G.ball.x),mtz(G.ball.z));
x.lineTo(mtx(G.ball.x)+Math.sin(G.aim)*18,mtz(G.ball.z)-Math.cos(G.aim)*18);x.stroke()}

/* ========== 스코어카드 ========== */
function mkScore(){
const c=COURSES[G.ci],tp=c.par.reduce((a,v)=>a+v,0);
let html='<tr><th>홀</th>';for(let i=0;i<9;i++)html+=`<th>${i+1}</th>`;html+='<th>합계</th></tr>';
html+='<tr><td style="color:#ffd700;font-weight:700">PAR</td>';for(let i=0;i<9;i++)html+=`<td>${c.par[i]}</td>`;html+=`<td style="color:#ffd700;font-weight:700">${tp}</td></tr>`;
html+='<tr><td style="font-weight:700">타수</td>';let tot=0;
for(let i=0;i<9;i++){const s=G.scores[i];if(s!==undefined){tot+=s;const d=s-c.par[i];
const cls=d<=-2?'eagle':d===-1?'birdie':d===0?'par-sc':d===1?'bogey':'dbogey';
html+=`<td class="${cls}">${s}</td>`}else html+='<td>-</td>'}
html+=`<td style="font-weight:800">${tot||'-'}</td></tr>`;
$('scTbl').innerHTML=html;
$('scTot').textContent=`합계: ${tot}타 (${tot-tp>=0?'+':''}${tot-tp})`}

/* ========== 바람/자동클럽 ========== */
function setWind(){const s=.5+Math.random()*3,d=Math.random()*Math.PI*2;G.wind={spd:s,dir:d,x:Math.cos(d)*s*.01,z:Math.sin(d)*s*.01}}
function autoClub(){const d=holeP?Math.hypot(G.ball.x-holeP.x,G.ball.z-holeP.z):50;G.putting=d<6}
function posGolfer(){if(!golfer)return;golfer.visible=true;golfer.position.set(G.ball.x,gndH(G.ball.x,G.ball.z),G.ball.z);golfer.rotation.set(0,G.aim,0);P.addr(golfer)}

/* ========== 게임 흐름 ========== */
function startRound(ci){
G.ci=ci;G.hi=0;G.scores=[];G.roundActive=true;
showScr('loading');$('ldFill').style.width='0%';
setTimeout(()=>$('ldFill').style.width='50%',100);
setTimeout(()=>{$('ldFill').style.width='100%';startHole()},500)}

function startHole(){
const c=COURSES[G.ci];
G.par=c.par[G.hi];G.stroke=0;G.settled=false;G.putting=false;
G.ball.holed=false;G.ball.inWater=false;G.ball.isOB=false;G.ball.flying=false;G.ball.stopped=true;
setWind();buildCourse(G.ci,G.hi);
G.ball.x=teeP.x;G.ball.y=gndH(teeP.x,teeP.z)+.063;G.ball.z=teeP.z;
G.ball.vx=G.ball.vy=G.ball.vz=0;
updBM();if(ballM)ballM.visible=true;
autoClub();
G.aim=Math.atan2(holeP.x-teeP.x,-(holeP.z-teeP.z));
clearTrail();
G.flyActive=true;G.flyT=0;
showScr('flyover');
$('flyH').textContent=`${G.hi+1}홀`;
$('flyPar').textContent=G.par;
$('flyDist').textContent=COURSES[G.ci].dist[G.hi];
updHUD();drawMinimap();
AUD.init();AUD.resume()}

window.endFly=function(){
G.flyActive=false;G.state='aim';G.swPhase='idle';
showScr('game');
posGolfer();updAim(70);showAimL();
CAM.behind({x:G.ball.x,y:G.ball.y,z:G.ball.z},G.aim);CAM.mode='behind';CAM.snap();
updHUD();drawMinimap();
showBig(`${G.hi+1}홀 PAR ${G.par}`,1500)};

function doSwing(power,accuracy){
G.state='swing';G.settled=false;G.stroke++;
const cl=G.putting?PUTTER:CLUB;
const accOff=(accuracy-50)/50*.12;
const dir=G.aim+accOff;
const spd=cl.power*(power/100);
const loft=rad(cl.loft);
G.ball.vx=Math.sin(dir)*Math.cos(loft)*spd;
G.ball.vy=Math.sin(loft)*spd;
G.ball.vz=-Math.cos(dir)*Math.cos(loft)*spd;
G.ball.flying=true;G.ball.stopped=false;G.ball.holed=false;G.ball.inWater=false;G.ball.isOB=false;
hideAim();clearTrail();
if(!G.putting)AUD.play('hit');else AUD.play('putt');
SA.start(power,G.putting);
CAM.swingClose({x:G.ball.x,y:G.ball.y,z:G.ball.z},G.aim);CAM.mode='swing';
CAM.shake(.03,.25);updHUD()}

function onBallStop(){
if(G.settled)return;G.settled=true;updBM();
if(G.ball.holed){
const d=G.stroke-G.par;
const names={'-3':'앨버트로스!','-2':'이글!','-1':'버디!','0':'파!','1':'보기','2':'더블보기'};
showBig(names[d]||(d<0?`${Math.abs(d)}언더!`:`+${d}`),2000);
if(golfer)P.celebrate(golfer);
G.scores[G.hi]=G.stroke;
setTimeout(()=>showScorecard(),2500);return}
if(G.ball.inWater){showBig('워터 해저드! +1벌타',1500);G.stroke++;G.ball.x=fwPath[Math.floor(fwPath.length*.3)].x;G.ball.z=fwPath[Math.floor(fwPath.length*.3)].z;G.ball.y=gndH(G.ball.x,G.ball.z)+.063;updBM()}
else if(G.ball.isOB){showBig('OB! +1벌타',1500);G.stroke++;G.ball.x=fwPath[Math.floor(fwPath.length*.2)].x;G.ball.z=fwPath[Math.floor(fwPath.length*.2)].z;G.ball.y=gndH(G.ball.x,G.ball.z)+.063;updBM()}
if(G.stroke>=G.maxStk){G.scores[G.hi]=G.maxStk;setTimeout(()=>showScorecard(),1000);return}
setTimeout(()=>{G.state='aim';G.swPhase='idle';autoClub();
G.aim=Math.atan2(holeP.x-G.ball.x,-(holeP.z-G.ball.z));
posGolfer();showScr('game');updAim(70);showAimL();
CAM.behind({x:G.ball.x,y:G.ball.y,z:G.ball.z},G.aim);CAM.mode='behind';CAM.snap();
updHUD();drawMinimap()},1200)}

function showScorecard(){mkScore();$('scTitle').textContent=`${G.hi+1}홀 완료`;
$('scSub').textContent=COURSES[G.ci].name;
$('scNext').textContent=G.hi<8?'다음 홀':'결과 보기';
$('scNext').onclick=G.hi<8?nextHole:showResult;
showScr('score')}

window.nextHole=function(){G.hi++;startHole()};
function showResult(){
const c=COURSES[G.ci],tp=c.par.reduce((a,v)=>a+v,0),tot=G.scores.reduce((a,v)=>a+v,0);
$('rsSub').textContent=c.name;$('rsTot').textContent=`최종: ${tot}타 (${tot-tp>=0?'+':''}${tot-tp})`;
let html='';G.scores.forEach((s,i)=>{const d=s-c.par[i];html+=`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px;color:#fff"><span>${i+1}홀 (PAR ${c.par[i]})</span><span style="color:${d<0?'#ff4444':d===0?'rgba(255,255,255,.5)':'#4af'}">${s}타 (${d>=0?'+':''}${d})</span></div>`});
$('rsBody').innerHTML=html;
if(!STO.d.best)STO.d.best={};
if(!STO.d.best['c'+G.ci]||tot<STO.d.best['c'+G.ci]){STO.d.best['c'+G.ci]=tot;STO.save()}
showScr('result');G.state='result';if(holeP){CAM.result(holeP);CAM.mode='result'}
$('rsReplay').onclick=()=>startRound(G.ci);$('rsMenuBtn').onclick=()=>showMenu()}

/* ========== 스윙 게이지 ========== */
function tickGauge(dt){
if(G.swPhase==='power'){G.gaugeVal+=G.gaugeDir*dt*100;if(G.gaugeVal>=100){G.gaugeVal=100;G.gaugeDir=-1}else if(G.gaugeVal<=0){G.gaugeVal=0;G.gaugeDir=1}
$('pwrFill').style.width=G.gaugeVal+'%';$('pwrVal').textContent=Math.round(G.gaugeVal)+'%';updAim(G.gaugeVal)}
else if(G.swPhase==='accuracy'){G.accVal+=G.accDir*dt*140;if(G.accVal>=100){G.accVal=100;G.accDir=-1}else if(G.accVal<=0){G.accVal=0;G.accDir=1}
$('accFill').style.width=G.accVal+'%';$('accVal').textContent=Math.abs(G.accVal-50)<8?'GOOD!':Math.abs(G.accVal-50)<16?'OK':'MISS'}}

function showSwing(){$('swingPanel').style.display='block';G.swPhase='power';G.gaugeVal=0;G.gaugeDir=1;
$('pwrFill').style.width='0%';$('accWrap').style.display='none';$('accLabel').style.display='none';$('swBtn').textContent='탭하여 스윙!'}

window.onSwTap=function(e){e.preventDefault();AUD.play('click');
if(G.swPhase==='idle'&&G.state==='aim'){showSwing();return}
if(G.swPhase==='power'){G.power=G.gaugeVal;G.swPhase='accuracy';G.accVal=0;G.accDir=1;
$('accWrap').style.display='block';$('accLabel').style.display='flex';$('swBtn').textContent='탭하여 조준!'}
else if(G.swPhase==='accuracy'){G.accuracy=G.accVal;G.swPhase='idle';
$('swingPanel').style.display='none';doSwing(G.power,G.accuracy)}};

/* ========== 입력 처리 ========== */
let dragStart=null,dragAim=0;
function bindInput(){
const gc=$('gameContainer');
gc.addEventListener('touchstart',e=>{if(G.state!=='aim')return;dragStart={x:e.touches[0].clientX,y:e.touches[0].clientY};dragAim=G.aim},{passive:true});
gc.addEventListener('touchmove',e=>{if(!dragStart||G.state!=='aim')return;const dx=e.touches[0].clientX-dragStart.x;G.aim=dragAim-dx*.004;posGolfer();updAim(G.gaugeVal||70);updHUD();drawMinimap()},{passive:true});
gc.addEventListener('touchend',()=>{dragStart=null},{passive:true});
gc.addEventListener('mousedown',e=>{if(G.state!=='aim')return;dragStart={x:e.clientX,y:e.clientY};dragAim=G.aim});
gc.addEventListener('mousemove',e=>{if(!dragStart||G.state!=='aim')return;const dx=e.clientX-dragStart.x;G.aim=dragAim-dx*.004;posGolfer();updAim(G.gaugeVal||70);updHUD();drawMinimap()});
gc.addEventListener('mouseup',()=>{dragStart=null});
document.addEventListener('keydown',e=>{
if(e.key==='ArrowLeft'&&G.state==='aim'){G.aim-=.02;posGolfer();updAim(G.gaugeVal||70);updHUD();drawMinimap()}
if(e.key==='ArrowRight'&&G.state==='aim'){G.aim+=.02;posGolfer();updAim(G.gaugeVal||70);updHUD();drawMinimap()}
if(e.key===' '&&G.state==='aim'){showSwing()}})}

/* ========== 메뉴 ========== */
window.showMenu=function(){G.state='menu';showScr('menu')};
window.openCourseSelect=function(){
let html='';COURSES.forEach((c,i)=>{
const tp=c.par.reduce((a,v)=>a+v,0);
const best=STO.d.best&&STO.d.best['c'+i]?` 🏆 ${STO.d.best['c'+i]}타`:'';
html+=`<div class="course-item" onclick="startRound(${i})"><div class="ci-icon">⛳</div><div><div class="ci-name">${c.name}</div><div class="ci-desc">${c.city} · 9홀 · PAR ${tp}${best}</div></div></div>`});
$('cList').innerHTML=html;showScr('course');G.state='course'};
window.openRecords=function(){
let html='';COURSES.forEach((c,i)=>{
const tp=c.par.reduce((a,v)=>a+v,0);const best=STO.d.best&&STO.d.best['c'+i];
html+=`<div style="padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.04)"><div style="display:flex;justify-content:space-between"><span style="color:#fff;font-weight:700">${c.name}</span><span style="color:${best?'#ffd700':'rgba(255,255,255,.3)'}">${best?best+'타':'-'}</span></div><div style="font-size:11px;color:rgba(255,255,255,.4)">${c.city} · PAR ${tp}${best?` (${best-tp>=0?'+':''}${best-tp})`:''}</div></div>`});
$('rList').innerHTML=html;showScr('records');G.state='records'};
window.openSettings=function(){showScr('settings');G.state='settings'};
window.startRound=startRound;

/* ========== 메인 루프 ========== */
const clock=new THREE.Clock();let lastMiniT=0;
function gameLoop(){
requestAnimationFrame(gameLoop);
const dt=Math.min(clock.getDelta(),.05),elapsed=clock.getElapsedTime();

if(G.swPhase==='power'||G.swPhase==='accuracy')tickGauge(dt);
SA.update(dt);

if(G.flyActive){G.flyT+=dt*.3;if(G.flyT>=1)endFly();else{CAM.flyover(G.flyT,teeP,holeP);CAM.update(dt)}}
if(G.state==='swing'&&G.ball.flying){physTick(dt);updBM();updTrail();CAM.follow({x:G.ball.x,y:G.ball.y,z:G.ball.z},{x:G.ball.vx,z:G.ball.vz});CAM.update(dt);if(G.ball.stopped&&!G.settled)setTimeout(()=>onBallStop(),400)}
if(G.state==='aim')CAM.update(dt);
if(G.state==='result'&&holeP){CAM.result(holeP);CAM.update(dt)}

updP(dt);
waters.forEach(w=>{if(w.mesh)w.mesh.position.y=w.mesh.userData.baseY+Math.sin(elapsed*1.5+w.x*.1)*.05});
if(landingZone&&landingZone.visible){landingZone.material.opacity=.5+Math.sin(elapsed*3)*.12;if(landingRing)landingRing.material.opacity=.55+Math.sin(elapsed*4)*.15}
if(flagM)flagM.rotation.y=Math.sin(elapsed*3)*.3;

if(golfer&&golfer.visible&&G.state==='aim'&&!SA.active){
const u=golfer.userData;u.torso.position.y=u.torsoBaseY+Math.sin(elapsed*1.8)*.008;
u.hips.rotation.z=Math.sin(elapsed*.7)*.012;u.torso.rotation.z=-Math.sin(elapsed*.7)*.006;
u.head.rotation.y=Math.sin(elapsed*.5)*.04;u.head.rotation.x=.05+Math.sin(elapsed*1.2)*.015}

if(elapsed-lastMiniT>.3&&(G.state==='aim'||G.state==='swing')){drawMinimap();lastMiniT=elapsed}
renderer.render(scene,camera)}

/* ========== 초기화 ========== */
function init(){
initScene();initMaterials();createGolfer();mkBall();mkAim();initTrail();bindInput();
showScr('menu');G.state='menu';$('loading').style.display='none';
gameLoop();console.log('파크골프 프로 v18 초기화 완료');
window._dbg=()=>({cam:{x:camera.position.x.toFixed(2),y:camera.position.y.toFixed(2),z:camera.position.z.toFixed(2)},
ball:{x:G.ball.x.toFixed(2),y:G.ball.y.toFixed(2),z:G.ball.z.toFixed(2)},
aim:G.aim.toFixed(3),state:G.state,
golferVis:golfer?golfer.visible:false,
golferPos:golfer?{x:golfer.position.x.toFixed(2),y:golfer.position.y.toFixed(2),z:golfer.position.z.toFixed(2)}:null,
tee:teeP?{x:teeP.x.toFixed(2),z:teeP.z.toFixed(2)}:null,
hole:holeP?{x:holeP.x.toFixed(2),z:holeP.z.toFixed(2)}:null,
aimLineVis:aimLine?aimLine.visible:false})}

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW:',e))}
window.addEventListener('DOMContentLoaded',()=>setTimeout(init,100));
</script>
</body>
</html>
