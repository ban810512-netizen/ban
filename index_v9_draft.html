<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',system-ui,sans-serif;touch-action:none;user-select:none}
#GC{position:fixed;top:0;left:0;width:100%;height:100%}
canvas{display:block;width:100%!important;height:100%!important}
#hud{position:absolute;top:0;left:0;width:100%;pointer-events:none;z-index:10}

.hd{text-align:center;min-width:48px}.hd .hl{font-size:8px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.5px}

#clubBtn{position:absolute;top:52px;right:8px;pointer-events:auto;z-index:15;background:rgba(0,0,0,.7);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}
#minimap{position:absolute;bottom:130px;right:6px;width:120px;height:120px;border-radius:10px;border:1.5px solid rgba(255,255,255,.2);z-index:12;pointer-events:none;overflow:hidden}
#mmCvs{width:100%;height:100%}
#bigMsg{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:20;pointer-events:none;display:none}
.bm{font-size:38px;font-weight:900;color:#ffd700;text-shadow:0 0 20px rgba(255,215,0,.5),0 2px 4px rgba(0,0,0,.8);animation:pop .35s ease-out}
.bs{font-size:15px;color:rgba(255,255,255,.8);margin-top:4px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
@keyframes pop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
#aimGuide{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.6);font-size:11px;z-index:10;pointer-events:none;background:rgba(0,0,0,.3);padding:3px 12px;border-radius:10px;display:none}
#swingPanel{position:absolute;bottom:0;left:0;width:100%;z-index:15;display:none;pointer-events:auto}
#swingInner{padding:8px 14px 16px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.7) 40%,rgba(0,0,0,.9))}
#swingTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#swingLabel{color:rgba(255,255,255,.6);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
#swingVal{color:#ffd700;font-size:14px;font-weight:800}

#accZone{position:absolute;height:100%;background:rgba(46,204,64,.2);border-left:2px solid rgba(46,204,64,.5);border-right:2px solid rgba(46,204,64,.5)}
#accPerf{position:absolute;height:100%;width:2px;background:#2ecc40;transform:translateX(-50%);z-index:1}
#accNdl{position:absolute;top:-1px;bottom:-1px;width:3px;background:#fff;border-radius:2px;box-shadow:0 0 8px #fff;z-index:2;display:none}
#swBtn{width:100%;padding:11px;border:none;border-radius:10px;font-size:16px;font-weight:800;cursor:pointer;color:#fff;background:linear-gradient(135deg,#27ae60,#2ecc71);box-shadow:0 3px 10px rgba(46,204,64,.35);letter-spacing:1px}
#puttInfo{position:absolute;bottom:145px;left:50%;transform:translateX(-50%);color:#fff;font-size:11px;z-index:10;pointer-events:none;display:none;background:rgba(0,0,0,.4);padding:4px 12px;border-radius:8px}
#flyover{position:absolute;top:0;left:0;width:100%;height:100%;z-index:25;display:none;pointer-events:auto}
#flyTop{position:absolute;top:0;left:0;width:100%;padding:14px;background:linear-gradient(180deg,rgba(0,0,0,.75),transparent)}
#flyH{font-size:26px;font-weight:900;color:#ffd700}
#flyD{display:flex;gap:14px;margin-top:4px}#flyD span{font-size:12px;color:rgba(255,255,255,.8)}#flyD em{font-style:normal;color:#ffd700}
#flySk{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.4);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:7px 22px;font-size:12px;cursor:pointer}
#scoreScr,#resultScr{position:absolute;top:0;left:0;width:100%;height:100%;z-index:30;display:none;background:linear-gradient(135deg,rgba(0,35,0,.96),rgba(0,18,0,.98));overflow-y:auto;-webkit-overflow-scrolling:touch}
.si{max-width:400px;margin:0 auto;padding:18px 14px}
.st{font-size:20px;font-weight:900;color:#ffd700;text-align:center;margin-bottom:3px}
.ss{font-size:12px;color:rgba(255,255,255,.5);text-align:center;margin-bottom:14px}
.tb{width:100%;border-collapse:collapse;margin-bottom:14px}
.tb th{background:rgba(255,215,0,.12);color:#ffd700;font-size:9px;padding:5px 3px;font-weight:700;text-transform:uppercase}
.tb td{text-align:center;padding:5px 3px;font-size:12px;color:#fff;border-bottom:1px solid rgba(255,255,255,.06)}
.tb .par{color:rgba(255,255,255,.4);font-size:10px}
.tb .eg{color:#ffd700;font-weight:800}.tb .bi{color:#f44;font-weight:700}.tb .bo{color:#4af}.tb .db{color:#88f}
.tot{text-align:center;font-size:16px;font-weight:800;color:#fff;margin:10px 0;padding:8px;background:rgba(255,215,0,.08);border-radius:8px}
.btn{display:block;width:100%;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;color:#fff;margin-top:8px;text-align:center}
.btn.p{background:linear-gradient(135deg,#27ae60,#2ecc71)}.btn.s{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15)}
.rk{display:inline-block;padding:2px 10px;border-radius:8px;font-size:11px;font-weight:700;margin-bottom:10px}
.rk.rs{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#000}.rk.ra{background:linear-gradient(135deg,#c0c0c0,#e0e0e0);color:#000}.rk.rb{background:linear-gradient(135deg,#cd7f32,#b87333);color:#fff}
#menuScr{position:absolute;top:0;left:0;width:100%;height:100%;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(0,50,0,.95),rgba(0,25,0,.98))}
#menuLogo{font-size:34px;font-weight:900;color:#ffd700;text-shadow:0 0 25px rgba(255,215,0,.35);margin-bottom:3px;letter-spacing:2px}
#menuSub{font-size:13px;color:rgba(255,255,255,.4);margin-bottom:26px}
#mPlayer{font-size:13px;color:rgba(255,255,255,.6);margin-bottom:20px}
.mb{display:block;width:200px;padding:12px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;color:#fff;margin:5px 0;text-align:center}
#btnPlay{background:linear-gradient(135deg,#27ae60,#2ecc71)}#btnPrac{background:linear-gradient(135deg,#2980b9,#3498db)}
#btnRec,#btnSet{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15)}

#courseScr,#recordScr,#settingScr{position:absolute;top:0;left:0;width:100%;height:100%;z-index:30;display:none;background:linear-gradient(135deg,rgba(0,35,0,.97),rgba(0,18,0,.98));overflow-y:auto;-webkit-overflow-scrolling:touch}
.ph{display:flex;align-items:center;padding:12px 14px;background:rgba(0,0,0,.25)}.ph h2{flex:1;text-align:center;font-size:16px;color:#ffd700;font-weight:800}
.pb{background:none;border:none;color:rgba(255,255,255,.6);font-size:22px;cursor:pointer;padding:3px 6px}
.ci{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer}
.ci:active{background:rgba(255,255,255,.04)}
.ck{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-right:12px}
.cn{font-size:14px;font-weight:700;color:#fff}.cc{font-size:10px;color:rgba(255,255,255,.4);margin-top:1px}.cb{font-size:11px;color:#ffd700;font-weight:600}
.ri{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.05)}
.sr{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.05)}
.sr label{font-size:13px;color:#fff;font-weight:600}
.sr input[type="text"]{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;padding:7px 10px;border-radius:7px;font-size:13px;width:130px}
.sr input[type="range"]{width:110px;accent-color:#2ecc71}
.tg{position:relative;width:44px;height:24px;background:rgba(255,255,255,.15);border-radius:12px;cursor:pointer;transition:.3s}
.tg.on{background:#2ecc71}.tg::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.3s}.tg.on::after{left:22px}
#loading{position:absolute;top:0;left:0;width:100%;height:100%;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a1a0a}
.lt{color:#ffd700;font-size:15px;font-weight:700;margin-top:14px}
.lb{width:180px;height:3px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:8px;overflow:hidden}
.lf{height:100%;width:0%;background:linear-gradient(90deg,#27ae60,#ffd700);border-radius:2px;transition:width .3s}
</style>
</head>

<div class="sr"><label>볼륨</label><input type="range" id="sVol" min="0" max="100" value="80"></div>
<div class="sr"><label>진동</label><div class="tg on" id="sVib"></div></div>
<div style="padding:14px"><button class="btn p" id="sSave">저장</button></div></div>
<div id="loading"><div style="font-size:36px">⛳</div><div class="lt">로딩중...</div><div class="lb"><div class="lf" id="ldFill"></div></div></div>
</div>

<script type="module">
import * as THREE from 'three';

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a=0,b=1)=>Math.random()*(b-a)+a;
const deg=r=>r*180/Math.PI;
const rad=d=>d*Math.PI/180;
function mulberry32(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/4294967296}}

/* ===== REALISTIC TEXTURES ===== */
const TEX={
 grass(w=1024,h=1024){
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  for(let y=0;y<h;y+=2){
   const g=x.createLinearGradient(0,y,w,y+2);
   const b=.22+Math.sin(y*.01)*.03;
   g.addColorStop(0,`hsl(${110+Math.random()*15},${55+Math.random()*15}%,${(b+Math.random()*.04)*100}%)`);
   g.addColorStop(1,`hsl(${115+Math.random()*10},${50+Math.random()*20}%,${(b+Math.random()*.04)*100}%)`);
   x.fillStyle=g;x.fillRect(0,y,w,2);
  }
  for(let i=0;i<12000;i++){
   const bx=Math.random()*w,by=Math.random()*h,bl=4+Math.random()*12;
   const hue=100+Math.random()*30,sat=40+Math.random()*30,lit=18+Math.random()*22;
   x.strokeStyle=`hsla(${hue},${sat}%,${lit}%,${.3+Math.random()*.4})`;
   x.lineWidth=.4+Math.random()*.8;x.beginPath();x.moveTo(bx,by);
   x.quadraticCurveTo(bx+(Math.random()-0.5)*3,by-bl*.5,bx+(Math.random()-0.5)*2,by-bl);x.stroke();
  }
  for(let i=0;i<25;i++){
   const px=Math.random()*w,py=Math.random()*h,pr=20+Math.random()*50;
   const rg=x.createRadialGradient(px,py,0,px,py,pr);
   rg.addColorStop(0,`rgba(${80+Math.random()*40},${140+Math.random()*60},${40+Math.random()*30},${.06+Math.random()*.06})`);
   rg.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=rg;x.fillRect(px-pr,py-pr,pr*2,pr*2);
  }
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(15,15);t.anisotropy=4;return t;
 },
 fairway(w=1024,h=1024){
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  x.fillStyle='#2a8a2a';x.fillRect(0,0,w,h);
  const sw=48;
  for(let i=0;i<w;i+=sw){
   const dark=Math.floor(i/sw)%2===0;
   x.fillStyle=dark?'rgba(20,90,20,.18)':'rgba(50,150,50,.15)';x.fillRect(i,0,sw,h);
  }
  for(let i=0;i<8000;i++){
   const bx=Math.random()*w,by=Math.random()*h;
   x.strokeStyle=`hsla(${110+Math.random()*20},${50+Math.random()*20}%,${25+Math.random()*20}%,.25)`;
   x.lineWidth=.3+Math.random()*.5;x.beginPath();x.moveTo(bx,by);x.lineTo(bx+(Math.random()-0.5)*1.5,by-2-Math.random()*5);x.stroke();
  }
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(3,10);t.anisotropy=4;return t;
 },
 green(w=1024,h=1024){
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  const g=x.createRadialGradient(w/2,h/2,0,w/2,h/2,w*.7);
  g.addColorStop(0,'#3dbf3d');g.addColorStop(.7,'#35a835');g.addColorStop(1,'#2d9a2d');
  x.fillStyle=g;x.fillRect(0,0,w,h);
  for(let r=8;r<w*.65;r+=5){
   x.strokeStyle=r%10<5?'rgba(55,195,55,.08)':'rgba(35,155,35,.08)';
   x.lineWidth=2.5;x.beginPath();x.arc(w/2,h/2,r,0,Math.PI*2);x.stroke();
  }
  for(let i=0;i<3000;i++){
   x.fillStyle=`rgba(${40+Math.random()*30},${160+Math.random()*40},${30+Math.random()*30},${.03+Math.random()*.04})`;
   x.fillRect(Math.random()*w,Math.random()*h,1,1);
  }
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t;
 },
 sand(w=512,h=512){
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  x.fillStyle='#d4be8a';x.fillRect(0,0,w,h);
  for(let i=0;i<15000;i++){
   const v=Math.random();
   x.fillStyle=v<.3?'rgba(210,185,130,.3)':v<.6?'rgba(240,215,160,.25)':'rgba(185,160,100,.25)';
   x.fillRect(Math.random()*w,Math.random()*h,.8+Math.random()*1.5,.8+Math.random()*1.5);
  }
  for(let y=0;y<h;y+=6+Math.random()*6){
   x.strokeStyle='rgba(180,155,95,.1)';x.lineWidth=.8;x.beginPath();x.moveTo(0,y);
   for(let xx=0;xx<w;xx+=8)x.quadraticCurveTo(xx+4,y+Math.random()*2.5-1.2,xx+8,y+Math.random()*2-1);x.stroke();
  }
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,2);return t;
 },
 water(w=512,h=512){
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,w,h);
  g.addColorStop(0,'#0d5575');g.addColorStop(.5,'#0a4060');g.addColorStop(1,'#073050');
  x.fillStyle=g;x.fillRect(0,0,w,h);
  for(let i=0;i<50;i++){
   const cx=Math.random()*w,cy=Math.random()*h,cr=4+Math.random()*25;
   x.strokeStyle=`rgba(80,180,240,${.06+Math.random()*.08})`;x.lineWidth=.8;
   x.beginPath();x.arc(cx,cy,cr,0,Math.PI*2);x.stroke();
  }
  for(let i=0;i<150;i++){
   x.fillStyle=`rgba(180,230,255,${.04+Math.random()*.08})`;

  }
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,2);return t;
 },
 dirt(w=256,h=256){
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  x.fillStyle='#8B7355';x.fillRect(0,0,w,h);
  for(let i=0;i<5000;i++){x.fillStyle=Math.random()>.5?'rgba(120,95,60,.25)':'rgba(160,130,90,.25)';x.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1+Math.random()*2)}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(4,4);return t;
 },
 bark(w=128,h=256){

function applyPose(g,pose,t=1){
  if(!g||!g.userData)return;
  const u=g.userData;
  const parts=['torso','hips','head','lArm','lFore','rArm','rFore','lLeg','lShin','rLeg','rShin'];
  for(const p of parts){
    if(!u[p]||!pose[p])continue;
    u[p].rotation.x=lerp(u[p].rotation.x,pose[p][0],t);
    u[p].rotation.y=lerp(u[p].rotation.y,pose[p][1],t);
    u[p].rotation.z=lerp(u[p].rotation.z,pose[p][2],t);
  }
}

function lerpPose(a,b,t){
  const r={};
  for(const k in a){if(b[k])r[k]=[lerp(a[k][0],b[k][0],t),lerp(a[k][1],b[k][1],t),lerp(a[k][2],b[k][2],t)];else r[k]=a[k]}
  return r;
}

const SWING={
  active:false,phase:'idle',time:0,power:0,isPutt:false,cb:null,

  update(dt){
    if(!this.active||!golfer)return;
    this.time+=dt;
    if(this.isPutt)return this._putt();
    const d=this.dur;
    switch(this.phase){
      case'back':{
        const t=Math.min(this.time/d.back,1);
        const ease=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2; // easeInOutQuad
        applyPose(golfer,lerpPose(POSES.address,POSES.backswingTop,ease),1);
        if(t>=1){this.phase='down';this.time=0}break;
      }
      case'down':{
        const t=Math.min(this.time/d.down,1);
        const ease=t*t*t; // easeInCubic - accelerating
        applyPose(golfer,lerpPose(POSES.backswingTop,POSES.impact,ease),1);
        if(t>=1){this.phase='hit';this.time=0;if(this.cb){this.cb();this.cb=null}vib(35)}break;
      }
      case'hit':{
        const t=Math.min(this.time/d.impact,1);

function mkTree(type,x,z,sc=1){

  if(type==='palm'){
    const pts=[];for(let i=0;i<=10;i++){const t=i/10;pts.push(new THREE.Vector3(Math.sin(t*1.5)*.3*s,t*3*s,Math.cos(t*.5)*.1*s))}
    const curve=new THREE.CatmullRomCurve3(pts);
    g.add(Object.assign(new THREE.Mesh(new THREE.TubeGeometry(curve,12,.06*s,6,false),M.bark),{castShadow:true}));
    for(let i=0;i<7;i++){const a=i/7*Math.PI*2,len=1.2*s+Math.random()*.5*s;const sh=new THREE.Shape();sh.moveTo(0,0);sh.quadraticCurveTo(len*.3,.15*s,len,-.1*s);sh.quadraticCurveTo(len*.3,-.05*s,0,0);const fr=new THREE.Mesh(new THREE.ShapeGeometry(sh),new THREE.MeshStandardMaterial({color:0x228833,roughness:.7,side:THREE.DoubleSide}));fr.position.copy(pts[10]);fr.rotation.set(-.3+Math.random()*.3,a,Math.random()*.2-.1);fr.castShadow=true;g.add(fr)}

    g.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(.04*s,.06*s,2*s,6),M.bark),{position:{x:0,y:s,z:0},castShadow:true}));

function mkMountains(){
  const g=new THREE.Group();
  for(let layer=0;layer<3;layer++){
    const dist=70+layer*35,peaks=10+layer*5;
    const colors=[0x3a6a3a,0x4a7a4a,0x5a8a5a];
    const verts=[],idx=[];
    for(let i=0;i<=peaks;i++){
      const angle=(i/peaks)*Math.PI*2;const r=dist+Math.random()*12;
      const x=Math.cos(angle)*r,z=Math.sin(angle)*r;
      const h=(10+Math.random()*18)*(1-layer*.2);
      verts.push(x,0,z,x,h,z);
      if(i<peaks){const b=i*2;idx.push(b,b+1,b+2,b+1,b+3,b+2)}
    }
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
    geo.setIndex(idx);geo.computeVertexNormals();
    const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:colors[layer],roughness:.85,flatShading:true}));
    m.receiveShadow=true;g.add(m);
  }
  return g;
}

function buildCourse(ci,hi){
  if(grp)scene.remove(grp);
  grp=new THREE.Group();bunks=[];waters=[];fwPath=[];
  const c=COURSES[ci],seed=ci*100+hi,rng=mulberry32(seed);
  const par=c.par[hi],dist=c.dist[hi];
  teeP=new THREE.Vector3(0,0,0);
  const angle=rng()*Math.PI*.4-.2;
  holeP=new THREE.Vector3(Math.sin(angle)*dist*.3,0,-dist*.3);
  // Ground - undulating terrain
  const gS=140,gSeg=80;
  const gGeo=new THREE.PlaneGeometry(gS,gS,gSeg,gSeg);
  const pa=gGeo.attributes.position.array;
  for(let i=0;i<pa.length;i+=3){
    const gx=pa[i],gy=pa[i+1];
    pa[i+2]=Math.sin(gx*.04)*Math.cos(gy*.04)*.4+Math.sin(gx*.1+gy*.07)*.2+Math.cos(gx*.06-gy*.05)*.15;
  }
  gGeo.computeVertexNormals();
  const gnd=new THREE.Mesh(gGeo,M.grass);gnd.rotation.x=-Math.PI/2;gnd.receiveShadow=true;grp.add(gnd);
  // Second ground layer for distance
  const gnd2=new THREE.Mesh(new THREE.PlaneGeometry(300,300),M.grass);gnd2.rotation.x=-Math.PI/2;gnd2.position.y=-.05;gnd2.receiveShadow=true;grp.add(gnd2);
  // Fairway path
  const midX=(teeP.x+holeP.x)/2+(rng()-.5)*dist*.15;
  for(let i=0;i<=20;i++){const t=i/20;fwPath.push(new THREE.Vector3(teeP.x*(1-t)*(1-t)+2*midX*t*(1-t)+holeP.x*t*t,.01,teeP.z*(1-t)+holeP.z*t))}
  const fwW=2.8+dist*.016;
  for(let i=0;i<fwPath.length-1;i++){
    const p1=fwPath[i],p2=fwPath[i+1],dx=p2.x-p1.x,dz=p2.z-p1.z,len=Math.sqrt(dx*dx+dz*dz);
    const fw=new THREE.Mesh(new THREE.PlaneGeometry(fwW,len),M.fairway);
    fw.rotation.x=-Math.PI/2;fw.rotation.z=-Math.atan2(dz,dx)+Math.PI/2;
    fw.position.set((p1.x+p2.x)/2,.016,(p1.z+p2.z)/2);fw.receiveShadow=true;grp.add(fw);
    for(const side of[-1,1]){
      const rw=new THREE.Mesh(new THREE.PlaneGeometry(fwW*.7,len),M.rough);
      const nx=-dz/len*side,nz=dx/len*side;
      rw.rotation.x=-Math.PI/2;rw.rotation.z=-Math.atan2(dz,dx)+Math.PI/2;

  tgt:new THREE.Vector3(),pos:new THREE.Vector3(),mode:'behind',shakeT:0,shakeI:0,
  behind(bp,aa){const d=3.8,h=2.4;this.tgt.set(bp.x-Math.sin(aa)*.8,.25,bp.z+Math.cos(aa)*.8);this.pos.set(bp.x+Math.sin(aa)*d,bp.y+h,bp.z+Math.cos(aa)*d);this.mode='behind'},

  follow(bp,v){const sp=Math.sqrt(v.x*v.x+v.z*v.z),d=4.5+sp*.4,h=2.2+bp.y*.4;const bh=sp>.1?Math.atan2(-v.x,-v.z):G.aimAngle;this.tgt.lerp(new THREE.Vector3(bp.x,bp.y*.4,bp.z),.07);this.pos.lerp(new THREE.Vector3(bp.x+Math.sin(bh)*d,h,bp.z+Math.cos(bh)*d),.05);this.mode='follow'},

function physTick(dt){
  if(!G.ball.flying)return;const ss=3,sd=dt/ss;
  for(let s=0;s<ss;s++){
    G.ball.vy-=9.81*sd;G.ball.vx*=(1-.03*sd);G.ball.vz*=(1-.03*sd);
    G.ball.vx+=G.wind.x*sd*.08;G.ball.vz+=G.wind.z*sd*.08;
    G.ball.x+=G.ball.vx*sd;G.ball.y+=G.ball.vy*sd;G.ball.z+=G.ball.vz*sd;
    const gh=gndH(G.ball.x,G.ball.z);
    if(G.ball.y<=gh+.063){
      G.ball.y=gh+.063;const onG=isGrn(G.ball.x,G.ball.z),inB=isBnk(G.ball.x,G.ball.z);
      if(G.ball.vy<-.3){G.ball.vy=-G.ball.vy*(inB?.15:onG?.3:.45);G.ball.vx*=.7;G.ball.vz*=.7;AUD.play('bounce');spawnP(G.ball.x,G.ball.y,G.ball.z,inB?0xd4b978:0x44aa44,5)}else G.ball.vy=0;
      const fr=onG?.985:inB?.93:.96;G.ball.vx*=fr;G.ball.vz*=fr;
      if(onG){const dx=holeP.x-G.ball.x,dz=holeP.z-G.ball.z,dd=Math.sqrt(dx*dx+dz*dz);if(dd>.1&&dd<grnR){const sl=.015/(dd+.5);G.ball.vx+=dx/dd*sl;G.ball.vz+=dz/dd*sl}}
      const spd=Math.sqrt(G.ball.vx*G.ball.vx+G.ball.vy*G.ball.vy+G.ball.vz*G.ball.vz);
      if(spd<.02&&Math.abs(G.ball.vy)<.05){G.ball.vx=G.ball.vy=G.ball.vz=0;G.ball.flying=false;G.ball.stopped=true}
    }
    for(const w of waters){if(Math.abs(G.ball.x-w.x)<w.w&&Math.abs(G.ball.z-w.z)<w.h&&G.ball.y<.1){G.ball.flying=false;G.ball.stopped=true;G.ball.inWater=true;AUD.play('splash');spawnP(G.ball.x,.05,G.ball.z,0x4488cc,15);CAM.shake(.04,.3);return}}
    if(Math.hypot(G.ball.x,G.ball.z+holeP.z*.5)>obB){G.ball.flying=false;G.ball.stopped=true;G.ball.isOB=true;AUD.play('ob');return}
    const hd=Math.hypot(G.ball.x-holeP.x,G.ball.z-holeP.z),sp2=Math.sqrt(G.ball.vx*G.ball.vx+G.ball.vz*G.ball.vz);
    if(hd<.12&&G.ball.y<.15&&sp2<2.2){G.ball.x=holeP.x;G.ball.z=holeP.z;G.ball.y=0;G.ball.vx=G.ball.vy=G.ball.vz=0;G.ball.flying=false;G.ball.stopped=true;G.ball.holed=true;AUD.play('hole');spawnP(holeP.x,.1,holeP.z,0xffd700,20);CAM.shake(.02,.3);return}
  }
}

this.tgt.lerp(new THREE.Vector3(bp.x,bp.y*.5,bp.z),.08);this.pos.lerp(new THREE.Vector3(bp.x+Math.sin(ba)*d,h,bp.z+Math.cos(ba)*d),.06);this.mode='follow'},

this.pos.set(cx+Math.sin(a+.3)*6,h,cz+Math.cos(a+.3)*6);this.tgt.set(cx,0,cz);this.mode='flyover'},
result(hp){const t=performance.now()*.0003;this.pos.set(hp.x+Math.sin(t)*3,2,hp.z+Math.cos(t)*3);this.tgt.set(hp.x,.5,hp.z);this.mode='result'},
shake(i=.03,d=.2){this.skT=d;this.skI=i},
update(dt){const s=this.mode==='flyover'||this.mode==='result'?.99:.06;camera.position.lerp(this.pos,s);

function isGrn(x,z){return Math.hypot(x-grnC.x,z-grnC.z)<grnR}
function isBnk(x,z){for(const b of bunks)if(Math.hypot(x-b.x,z-b.z)<b.r)return true;return false}
function d2h(x,z){return Math.hypot(x-holeP.x,z-holeP.z)}
function gndH(x,z){return Math.sin(x*.04)*Math.cos(z*.04)*.4+Math.sin(x*.1+z*.07)*.2+Math.cos(x*.06-z*.09)*.15}

for(let s=0;s<sub;s++){G.ball.vy-=9.81*sd;G.ball.vx*=(1-.03*sd);G.ball.vz*=(1-.03*sd);

G.ball.x+=G.ball.vx*sd;G.ball.y+=G.ball.vy*sd;G.ball.z+=G.ball.vz*sd;

const fr=og?.985:ib?.93:.96;G.ball.vx*=fr;G.ball.vz*=fr;
if(og){const dx=holeP.x-G.ball.x,dz=holeP.z-G.ball.z,dd=Math.sqrt(dx*dx+dz*dz);if(dd>.1&&dd<grnR){const sl=.015/(dd+.5);G.ball.vx+=dx/dd*sl;G.ball.vz+=dz/dd*sl}}

if(Math.hypot(G.ball.x,G.ball.z+holeP.z*.5)>obB){G.ball.flying=false;G.ball.stopped=true;G.ball.isOB=true;AUD.play('ob');return}
const hd=Math.hypot(G.ball.x-holeP.x,G.ball.z-holeP.z),sp2=Math.sqrt(G.ball.vx**2+G.ball.vz**2);

/* --- Minimap Drawing --- */
function drawMinimap(){
 const cv=UI.mini;if(!cv)return;
 const ctx=cv.getContext('2d');
 const W=cv.width,H=cv.height;
 ctx.clearRect(0,0,W,H);
 /* background */
 ctx.fillStyle='rgba(0,60,0,0.85)';
 ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;ctx.strokeRect(0,0,W,H);
 /* scale: map 140m course to minimap */
 const sc=W/160;
 const ox=W/2,oz=H*0.85;
 function tx(x){return ox+x*sc}
 function tz(z){return oz+z*sc}
 /* fairway area */
 if(curHoleData){
  const hp=curHoleData;
  ctx.fillStyle='rgba(100,200,80,0.4)';
  ctx.beginPath();
  ctx.ellipse(tx((hp.tee[0]+hp.pin[0])/2),tz((hp.tee[2]+hp.pin[2])/2),
   Math.abs(hp.pin[2]-hp.tee[2])*sc/2+10,15,
   Math.atan2(hp.pin[0]-hp.tee[0],hp.pin[2]-hp.tee[2]),0,Math.PI*2);
  ctx.fill();
  /* green */
  ctx.fillStyle='rgba(0,180,60,0.7)';
  ctx.beginPath();ctx.arc(tx(hp.pin[0]),tz(hp.pin[2]),8,0,Math.PI*2);ctx.fill();
  /* pin flag */
  ctx.fillStyle='#ff3333';
  ctx.beginPath();ctx.arc(tx(hp.pin[0]),tz(hp.pin[2]),3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 8px sans-serif';ctx.textAlign='center';
  ctx.fillText('🏁',tx(hp.pin[0]),tz(hp.pin[2])-5);
  /* tee */
  ctx.fillStyle='#ffcc00';
  ctx.beginPath();ctx.arc(tx(hp.tee[0]),tz(hp.tee[2]),3,0,Math.PI*2);ctx.fill();
 }
 /* water hazards */
 if(waterMeshes){
  waterMeshes.forEach(w=>{
   ctx.fillStyle='rgba(30,100,200,0.5)';
   ctx.beginPath();ctx.arc(tx(w.position.x),tz(w.position.z),5,0,Math.PI*2);ctx.fill();
  });
 }
 /* ball */
 if(ball){
  ctx.fillStyle='#ffffff';ctx.strokeStyle='#000';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(tx(ball.position.x),tz(ball.position.z),4,0,Math.PI*2);ctx.fill();ctx.stroke();
 }
 /* wind arrow */
 if(G.wind.spd>0){
  ctx.save();ctx.translate(W-20,20);ctx.rotate(G.wind.dir);
  ctx.strokeStyle='#ff6';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(0,10);ctx.moveTo(-4,-5);ctx.lineTo(0,-10);ctx.lineTo(4,-5);ctx.stroke();
  ctx.restore();
  ctx.fillStyle='#ff6';ctx.font='9px sans-serif';ctx.textAlign='center';
  ctx.fillText(`${G.wind.spd.toFixed(1)}`,W-20,38);
 }
}

/* water mesh refs for minimap */
let waterMeshes=[];

/* --- Scorecard Builder --- */
function mkScore(){
 const c=COURSES[G.course];
 let html='<tr><th>홀</th>';
 for(let i=0;i<9;i++)html+=`<th>${i+1}</th>`;
 html+='<th>합계</th></tr><tr><td>PAR</td>';
 let tp=0;
 for(let i=0;i<9;i++){tp+=c.holes[i].par;html+=`<td>${c.holes[i].par}</td>`}
 html+=`<td>${tp}</td></tr><tr><td>스코어</td>`;
 let ts=0;
 for(let i=0;i<9;i++){
  const s=G.scores[i];
  if(s!==undefined){ts+=s;
   const diff=s-c.holes[i].par;
   const cls=diff<=-2?'eagle':diff===-1?'birdie':diff===0?'par':diff===1?'bogey':'dbogey';
   html+=`<td class="${cls}">${s}</td>`;
  }else html+='<td>-</td>';
 }
 html+=`<td>${ts||'-'}</td></tr>`;
 UI.scoreBody.innerHTML=html;
 UI.scoreTtl.textContent=ts?`${ts}타 (${ts-tp>=0?'+':''}${ts-tp})`:'';
}

/* --- Set Wind --- */
function setWind(){
 G.wind.spd=Math.random()*4+0.5;
 G.wind.dir=Math.random()*Math.PI*2;
 G.wind.dx=Math.sin(G.wind.dir)*G.wind.spd*0.15;
 G.wind.dz=Math.cos(G.wind.dir)*G.wind.spd*0.15;
}

/* --- Current hole helpers --- */
let curHoleData=null;

/* --- Start Round --- */
function startRound(ci){
 G.course=ci;G.hole=0;G.scores=[];G.totalPar=0;G.totalStrk=0;G.roundActive=true;
 showScr('loading');
 setTimeout(()=>{startHole()},600);
}

/* --- Start Hole --- */
function startHole(){
 const c=COURSES[G.course];const h=c.holes[G.hole];
 G.par=h.par;G.stroke=0;G.settled=false;G.ballInHole=false;G.camFollow=false;G.shotReady=false;
 G.putting=false;G.clubIdx=0;G.spinX=0;G.spinZ=0;
 curHoleData=h;
 setWind();
 /* rebuild course */
 buildCourse(G.course,G.hole);
 /* collect water meshes for minimap */
 waterMeshes=[];
 scene.traverse(o=>{if(o.userData&&o.userData.isWater)waterMeshes.push(o)});
 /* position ball at tee */
 G.teePos.set(h.tee[0],gndH(h.tee[0],h.tee[2])+0.22,h.tee[2]);
 G.pinPos.set(h.pin[0],gndH(h.pin[0],h.pin[2]),h.pin[2]);
 G.holeDist=G.teePos.distanceTo(G.pinPos);
 ball.position.copy(G.teePos);
 ballVel.set(0,0,0);ballSpin.set(0,0,0);
 ball.visible=true;
 if(trail)trail.visible=false;
 trailPts=[];
 G.ballStartPos.copy(G.teePos);
 /* position golfer at tee */
 positionGolfer();
 /* auto select club */
 autoClub();
 /* aim toward pin */
 G.aimYaw=Math.atan2(G.pinPos.x-G.teePos.x,G.pinPos.z-G.teePos.z);
 G.aimPitch=0;
 updAimLine();
 /* flyover */
 G.flyoverActive=true;G.flyoverT=0;
 showScr('flyover');showFly(h);
 CAM.mode='flyover';CAM.flyT=0;
 updHUD();
 drawMinimap();
}

/* --- Position Golfer --- */
function positionGolfer(){
 if(!golfer)return;
 golfer.visible=true;
 const bp=ball.position;
 golfer.position.set(bp.x,gndH(bp.x,bp.z),bp.z);
 golfer.rotation.set(0,G.aimYaw,0);
 P.idle(golfer);
}

/* --- Auto Club Selection --- */
function autoClub(){
 const d=ball.position.distanceTo(G.pinPos);
 if(d<8){G.clubIdx=3;G.putting=true}
 else if(d<30)G.clubIdx=2;
 else if(d<60)G.clubIdx=1;
 else G.clubIdx=0;
 G.putting=G.clubIdx===3;
}

/* --- Aim Line --- */
let aimLine=null,aimDots=[];
function updAimLine(){
 if(!aimLine){
  const geo=new THREE.BufferGeometry();
  const pts=[];for(let i=0;i<30;i++)pts.push(0,0,0);
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
  aimLine=new THREE.Line(geo,new THREE.LineBasicMaterial({color:0xffff44,transparent:true,opacity:0.7}));
  aimLine.frustumCulled=false;scene.add(aimLine);
 }
 const pos=aimLine.geometry.attributes.position;
 const bx=ball.position.x,by=ball.position.y,bz=ball.position.z;
 const dx=Math.sin(G.aimYaw)*Math.cos(G.aimPitch);
 const dy=Math.sin(G.aimPitch);
 const dz=Math.cos(G.aimYaw)*Math.cos(G.aimPitch);
 for(let i=0;i<30;i++){
  const t=i*0.5;
  pos.setXYZ(i,bx+dx*t,by+dy*t*0.3+0.1,bz+dz*t);
 }
 pos.needsUpdate=true;
 aimLine.visible=G.state==='aim';
}

/* --- End Flyover --- */
function endFly(){
 G.flyoverActive=false;
 UI.flyover.style.display='none';
 G.state='aim';G.shotReady=true;
 showScr('game');
 CAM.mode='behind';
 CAM.update(0,ball.position,G.aimYaw);
 positionGolfer();
 P.addr(golfer);
 updAimLine();
 updHUD();
 showBig(`${G.hole+1}홀 PAR ${G.par}`,1500);
}

/* --- Do Swing (launch ball) --- */
function doSwing(power,accuracy){
 G.state='swing';G.settled=false;G.ballInHole=false;G.camFollow=true;
 G.stroke++;
 const club=CLUBS[G.clubIdx];
 /* accuracy offset: 0=perfect center, ±deviation */
 const accOff=(accuracy-50)/50*0.15;
 const yaw=G.aimYaw+accOff;
 /* launch params */
 const spd=club.power*power/100;
 const loft=club.loft*Math.PI/180;
 const vx=Math.sin(yaw)*Math.cos(loft)*spd;
 const vy=Math.sin(loft)*spd;
 const vz=Math.cos(yaw)*Math.cos(loft)*spd;
 ballVel.set(vx,vy,vz);
 /* spin */
 ballSpin.set(G.spinX*0.02,0,G.spinZ*0.02);
 G.ballStartPos.copy(ball.position);
 if(trail)trail.visible=true;
 trailPts=[];
 /* hide aim line */
 if(aimLine)aimLine.visible=false;
 /* swing animation */
 const isPutt=G.putting;
 SA.start(power,isPutt,()=>{
  /* ball launched on impact frame handled by velocity already set */
 });
 CAM.mode='swingClose';
 CAM.shakeT=0.3;
 updHUD();
}

/* --- On Ball Stop --- */
function onStop(){
 G.settled=true;G.camFollow=false;
 /* check hole in */
 const dp=ball.position.distanceTo(G.pinPos);
 if(G.ballInHole||dp<0.7){
  G.ballInHole=true;
  ball.visible=false;
  const diff=G.stroke-G.par;
  let msg='';
  if(G.stroke===1)msg='🎉 홀인원!!!';
  else if(diff<=-3)msg='🦅 알바트로스!';
  else if(diff===-2)msg='🦅 이글!';
  else if(diff===-1)msg='🐦 버디!';
  else if(diff===0)msg='👍 파!';
  else if(diff===1)msg='보기';
  else if(diff===2)msg='더블보기';
  else msg='트리플보기+';
  showBig(msg,2500);
  AUD.play('hole');
  if(golfer){P.celebrate(golfer)}
  G.scores[G.hole]=G.stroke;
  setTimeout(()=>showScorecard(),3000);
  return;
 }
 /* max strokes */
 if(G.stroke>=G.maxStrk){
  showBig('최대타수 도달',1500);
  G.scores[G.hole]=G.maxStrk;
  setTimeout(()=>showScorecard(),2000);
  return;
 }
 /* continue */
 autoClub();
 G.aimYaw=Math.atan2(G.pinPos.x-ball.position.x,G.pinPos.z-ball.position.z);
 positionGolfer();
 P.addr(golfer);
 G.state='aim';G.shotReady=true;
 CAM.mode='behind';
 updAimLine();
 updHUD();
 drawMinimap();
}

/* --- Show Scorecard --- */
function showScorecard(){
 mkScore();
 showScr('scorecard');
 G.state='scorecard';
}

/* --- Next Hole --- */
function nextHole(){
 if(G.hole<8){
  G.hole++;
  showScr('loading');
  setTimeout(()=>startHole(),500);
 } else {
  showResult();
 }
}

/* --- Show Result --- */
function showResult(){
 G.roundActive=false;
 const c=COURSES[G.course];
 let tp=0,ts=0;
 for(let i=0;i<9;i++){tp+=c.holes[i].par;ts+=G.scores[i]||0}
 G.totalPar=tp;G.totalStrk=ts;
 UI.resCourse.textContent=c.name;
 UI.resTotal.textContent=`${ts}타`;
 const diff=ts-tp;
 UI.resToPar.textContent=diff===0?'이븐파':diff>0?`+${diff}`:`${diff}`;
 UI.resToPar.style.color=diff<0?'#4f4':diff===0?'#fff':'#f66';
 /* per-hole results */
 let html='';
 for(let i=0;i<9;i++){
  const s=G.scores[i]||0;const p=c.holes[i].par;const d=s-p;
  const cls=d<=-2?'eagle':d===-1?'birdie':d===0?'par':d===1?'bogey':'dbogey';
  html+=`<div class="resHole"><span>${i+1}홀</span><span>PAR${p}</span><span class="${cls}">${s}(${d>=0?'+':''}${d})</span></div>`;
 }
 UI.resBody.innerHTML=html;
 /* save record */
 saveRecord(G.course,ts,tp);
 showScr('result');
 G.state='result';
}

/* --- Save / Load Records --- */
function saveRecord(ci,total,par){
 let data=STO.load()||{};
 if(!data.records)data.records={};
 const key='c'+ci;
 if(!data.records[key]||total<data.records[key].best){
  data.records[key]={best:total,par:par,date:new Date().toLocaleDateString('ko-KR')};
 }
 data.lastCourse=ci;
 STO.save(data);
}

function loadRecords(){
 const data=STO.load()||{};
 if(!data.records)return;
 let html='';
 COURSES.forEach((c,i)=>{
  const r=data.records['c'+i];
  html+=`<div class="recRow"><span>${c.name}</span>`;
  if(r)html+=`<span>${r.best}타(${r.best-r.par>=0?'+':''}${r.best-r.par})</span><span>${r.date}</span>`;
  else html+=`<span>-</span><span>-</span>`;
  html+=`</div>`;
 });
 UI.recBody.innerHTML=html;
}

function vib(ms){
 try{if(navigator.vibrate&&UI.vibChk&&UI.vibChk.checked)navigator.vibrate(ms)}catch(e){}
}


/* ========== PART 6: INPUT + MENU + LOOP + INIT ========== */

/* --- Gauge Tick (power & accuracy bars) --- */
function tickGauge(dt){
 if(G.swingPhase==='power'){
  G.gaugeVal+=G.gaugeDir*G.gaugeSpd*dt*100;
  if(G.gaugeVal>=100){G.gaugeVal=100;G.gaugeDir=-1}
  if(G.gaugeVal<=0){G.gaugeVal=0;G.gaugeDir=1}
  UI.pwrFill.style.height=G.gaugeVal+'%';
 } else if(G.swingPhase==='accuracy'){
  G.accVal+=G.accDir*G.accSpd*dt*100;
  if(G.accVal>=100){G.accVal=100;G.accDir=-1}
  if(G.accVal<=0){G.accVal=0;G.accDir=1}
  UI.accFill.style.height=G.accVal+'%';
 }
}

/* --- Swing Tap Handler --- */
function onSwingTap(){
 if(G.swingPhase==='power'){
  G.power=G.gaugeVal;
  G.swingPhase='accuracy';
  UI.accBar.style.display='block';
  G.accVal=50;G.accDir=1;
  AUD.play('click');
 } else if(G.swingPhase==='accuracy'){
  G.accuracy=G.accVal;
  G.swingPhase='idle';
  showSwing(false);
  doSwing(G.power,G.accuracy);
  AUD.play('click');
 }
}

/* --- Touch / Mouse Input --- */
let dragStart=null,dragging=false,lastTouch=null;

function getXY(e){
 if(e.touches&&e.touches.length>0)return{x:e.touches[0].clientX,y:e.touches[0].clientY};
 return{x:e.clientX,y:e.clientY};
}

function onPointerDown(e){
 const p=getXY(e);
 dragStart={x:p.x,y:p.y};dragging=false;lastTouch=p;
}

function onPointerMove(e){
 if(!dragStart)return;
 const p=getXY(e);
 const dx=p.x-dragStart.x,dy=p.y-dragStart.y;
 if(Math.abs(dx)+Math.abs(dy)>5)dragging=true;
 if(dragging&&G.state==='aim'){
  const sens=0.004;
  G.aimYaw-=(p.x-lastTouch.x)*sens;
  G.aimPitch=Math.max(-0.15,Math.min(0.3,G.aimPitch+(p.y-lastTouch.y)*sens*0.5));
  updAimLine();
  if(golfer)golfer.rotation.y=G.aimYaw;
  CAM.update(0,ball.position,G.aimYaw);
 }
 lastTouch=p;
}

function onPointerUp(e){
 if(!dragging){
  /* tap */
  if(G.state==='aim'&&G.shotReady){
   G.shotReady=false;
   showSwing(true);
   showScr('swing');
   P.addr(golfer);
  } else if(G.swingPhase==='power'||G.swingPhase==='accuracy'){
   onSwingTap();
  } else if(G.flyoverActive){
   endFly();
  } else if(G.state==='scorecard'){
   nextHole();
  }
 }
 dragStart=null;dragging=false;
}

/* keyboard support */
function onKeyDown(e){
 if(e.code==='Space'||e.code==='Enter'){
  if(G.state==='aim'&&G.shotReady){
   G.shotReady=false;showSwing(true);showScr('swing');P.addr(golfer);
  } else if(G.swingPhase==='power'||G.swingPhase==='accuracy'){
   onSwingTap();
  } else if(G.flyoverActive){endFly()}
  else if(G.state==='scorecard'){nextHole()}
 }
 if(G.state==='aim'){
  if(e.code==='ArrowLeft')G.aimYaw+=0.03;
  if(e.code==='ArrowRight')G.aimYaw-=0.03;
  if(e.code==='ArrowUp')G.clubIdx=Math.max(0,G.clubIdx-1);
  if(e.code==='ArrowDown')G.clubIdx=Math.min(3,G.clubIdx+1);
  G.putting=G.clubIdx===3;
  updAimLine();updHUD();
  if(golfer)golfer.rotation.y=G.aimYaw;
 }
}

/* bind events */
function bindInput(){
 const c=renderer.domElement;
 c.addEventListener('mousedown',onPointerDown);
 c.addEventListener('mousemove',onPointerMove);
 c.addEventListener('mouseup',onPointerUp);
 c.addEventListener('touchstart',onPointerDown,{passive:true});
 c.addEventListener('touchmove',onPointerMove,{passive:true});
 c.addEventListener('touchend',onPointerUp);
 document.addEventListener('keydown',onKeyDown);
}

/* --- Club Cycle Button --- */
function cycleClub(){
 G.clubIdx=(G.clubIdx+1)%4;
 G.putting=G.clubIdx===3;
 updHUD();AUD.play('click');
}

/* --- Menu Functions --- */
function showMenu(){
 G.state='menu';showScr('menu');
}

function openCourseSelect(){
 let html='';
 COURSES.forEach((c,i)=>{
  html+=`<div class="csItem" onclick="startRound(${i})"><span class="csName">${c.name}</span><span class="csInfo">9홀 · PAR ${c.holes.reduce((a,h)=>a+h.par,0)}</span></div>`;
 });
 UI.csList.innerHTML=html;
 showScr('courseSelect');G.state='courseSelect';
}

function openRecords(){
 loadRecords();showScr('records');G.state='records';
}

function openSettings(){
 showScr('settings');G.state='settings';
}

function backToMenu(){
 showMenu();
}

function resumeGame(){
 if(G.roundActive){
  G.state='aim';G.shotReady=true;showScr('game');
  CAM.mode='behind';updHUD();drawMinimap();
 }
}

/* --- Resize Handler --- */
function onResize(){
 const w=window.innerWidth,h=window.innerHeight;
 camera.aspect=w/h;camera.updateProjectionMatrix();
 renderer.setSize(w,h);
}

/* --- Main Game Loop --- */
const clock=new THREE.Clock();
let lastMiniT=0;

function gameLoop(){
 requestAnimationFrame(gameLoop);
 const dt=Math.min(clock.getDelta(),0.05);
 const elapsed=clock.getElapsedTime();

 /* gauge animation */
 if(G.swingPhase==='power'||G.swingPhase==='accuracy')tickGauge(dt);

 /* swing animation */
 SA.update(dt);

 /* flyover camera */
 if(G.flyoverActive){
  G.flyoverT+=dt*0.35;
  if(G.flyoverT>=1){endFly()}
  else{
   const t=G.flyoverT;
   const tp=G.teePos,pp=G.pinPos;
   const mx=(tp.x+pp.x)/2,mz=(tp.z+pp.z)/2;
   const dist=tp.distanceTo(pp);
   const cx=mx+Math.sin(t*Math.PI)*dist*0.4;
   const cy=15+dist*0.15+Math.sin(t*Math.PI)*8;
   const cz=mz+Math.cos(t*Math.PI)*dist*0.4;
   camera.position.set(cx,cy,cz);
   const lookT=t<0.5?t*2:1;
   const lx=tp.x+(pp.x-tp.x)*lookT;
   const lz=tp.z+(pp.z-tp.z)*lookT;
   camera.lookAt(lx,gndH(lx,lz)+1,lz);
  }
 }

 /* ball physics */
 if(G.state==='swing'&&!G.settled){
  const stopped=physTick(dt);
  /* trail update */
  if(ball.visible){
   trailPts.push(ball.position.clone());
   if(trailPts.length>90)trailPts.shift();
   updTrail();
  }
  if(stopped){
   setTimeout(()=>onStop(),500);
  }
  /* camera follow */
  if(G.camFollow){
   CAM.update(dt,ball.position,G.aimYaw);
  }
 }

 /* camera update in aim mode */
 if(G.state==='aim'){
  CAM.update(dt,ball.position,G.aimYaw);
 }

 /* animate water */
 scene.traverse(o=>{
  if(o.userData&&o.userData.isWater&&o.material){
   o.position.y=o.userData.baseY+Math.sin(elapsed*1.5+o.position.x*0.1)*0.05;
  }
 });

 /* animate flag */
 scene.traverse(o=>{
  if(o.userData&&o.userData.isFlag&&o.material){
   o.rotation.y=Math.sin(elapsed*3)*0.3;
  }
 });

 /* golfer breathing idle */
 if(golfer&&golfer.visible&&G.state==='aim'&&!SA.active){
  const b=Math.sin(elapsed*2)*0.01;
  golfer.userData.torso.position.y=golfer.userData.torsoBaseY+(b);
 }

 /* minimap refresh every 0.3s */
 if(elapsed-lastMiniT>0.3&&(G.state==='aim'||G.state==='swing')){
  drawMinimap();lastMiniT=elapsed;
 }

 renderer.render(scene,camera);
}

/* --- Initialization --- */
function init(){
 /* init Three.js scene */
 initScene();
 initMaterials();

 /* create golfer */
 createGolfer();

 /* create ball */
 const bg=new THREE.SphereGeometry(0.22,16,16);
 const bm=new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.3,metalness:0.05});
 ball=new THREE.Mesh(bg,bm);ball.castShadow=true;ball.visible=false;scene.add(ball);

 /* trail */
 const tg=new THREE.BufferGeometry();
 const tp=new Float32Array(90*3);
 tg.setAttribute('position',new THREE.BufferAttribute(tp,3));
 trail=new THREE.Line(tg,new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.4}));
 trail.frustumCulled=false;trail.visible=false;scene.add(trail);

 /* bind input */
 bindInput();
 window.addEventListener('resize',onResize);
 onResize();

 /* connect menu buttons */
 const btnStart=$('btnStart');if(btnStart)btnStart.onclick=openCourseSelect;
 const btnRecords=$('btnRecords');if(btnRecords)btnRecords.onclick=openRecords;
 const btnSettings=$('btnSettings');if(btnSettings)btnSettings.onclick=openSettings;
 const btnResume=$('btnResume');if(btnResume)btnResume.onclick=resumeGame;
 const btnBack=$('btnBack');if(btnBack)btnBack.onclick=backToMenu;
 const btnBackR=$('btnBackR');if(btnBackR)btnBackR.onclick=backToMenu;
 const btnBackS=$('btnBackS');if(btnBackS)btnBackS.onclick=backToMenu;
 const btnClub=$('btnClub');if(btnClub)btnClub.onclick=cycleClub;
 const btnMenu=$('btnMenu');if(btnMenu)btnMenu.onclick=showMenu;
 const btnScNext=$('btnScNext');if(btnScNext)btnScNext.onclick=nextHole;
 const btnResMenu=$('btnResMenu');if(btnResMenu)btnResMenu.onclick=showMenu;
 const btnResReplay=$('btnResReplay');if(btnResReplay)btnResReplay.onclick=()=>startRound(G.course);

 /* settings */
 if(UI.sfxRange)UI.sfxRange.oninput=e=>{/* sfx vol */};
 if(UI.bgmRange)UI.bgmRange.oninput=e=>{/* bgm vol */};

 /* show menu */
 showScr('menu');
 G.state='menu';

 /* hide loading */
 UI.loading.style.display='none';

 /* start loop */
 gameLoop();
 console.log('Park Golf Pro v9 initialized');
}

/* --- Register Service Worker --- */
if('serviceWorker' in navigator){
 navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW reg fail:',e));
}

/* --- Start --- */
window.addEventListener('DOMContentLoaded',()=>{
 setTimeout(init,100);
});

</script>
